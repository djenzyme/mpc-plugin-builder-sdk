name: Build Loudness Meter

# One-file setup: this workflow writes the whole Loudness Meter project (code, UI layout and the brushed
# silver skin generator, which also draws the meters, the logo, title and button names) into
# plugins/Loudness Meter/ on the build server, then builds and validates it.
# To change the plugin later, edit the file contents below.

on:
  push:
  workflow_dispatch:   # lets you press "Run workflow" from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write plugin files
        run: |
          set -e
          mkdir -p "plugins/Loudness Meter"
          cd "plugins/Loudness Meter"
          mkdir -p "$(dirname "plugin.json")"
          cat > "plugin.json" <<'LMEOF'
          {
            "name": "Loudness Meter",
            "manufacturer": "gltchsqnz",
            "version": "1.1.0",
            "format": "vst2",
            "kind": "effect",
            "uid": "GLdM",
            "numInputs": 2,
            "numOutputs": 2,
            "category": "Effect",
            "shortName": "Loudness",
            "knobs": [
              { "parameter": 1, "label": "Mode" },
              { "parameter": 2, "label": "View" },
              { "parameter": 0, "label": "Target" }
            ],
            "shiftKnobs": [
              { "parameter": 5, "label": "VU Ref" },
              { "parameter": 6, "label": "TP Limit" },
              { "parameter": 4, "label": "Auto Rst" }
            ],
            "file32": "VST/loudness-meter-arm32.so",
            "file64": "VST/loudness-meter-arm64.so",
            "description": "Loudness and level meter: LUFS (momentary, short-term, integrated), LRA, PLR, true peak, sample peak, RMS, VU and phase correlation, with LED bars, a VU needle, precise readouts and platform targets.",
            "author": "gltchsqnz",
            "url": "",
            "license": "MIT"
          }
          LMEOF
          mkdir -p "$(dirname "ui.json")"
          cat > "ui.json" <<'LMEOF'
          {
            "kit": "silver",
            "qlinkGroups": "rows",
            "style": {
              "background": "ffc4c7cd",
              "text": "ff16181b",
              "muted": "ff3d4148"
            },
            "pages": [
              {
                "name": "METER",
                "background": "silver_meter_bg.png",
                "controls": [
                  { "param": "Mode", "widget": "switch" },
                  { "param": "View", "widget": "switch" },
                  { "param": "Target", "widget": "knob", "overlay": "menu" },
                  { "param": "Reset", "widget": "switch" }
                ]
              },
              {
                "name": "SETUP",
                "background": "silver_setup_bg.png",
                "controls": [
                  { "param": "Auto Reset", "widget": "switch" },
                  { "param": "VU Ref", "widget": "knob" },
                  { "param": "TP Limit", "widget": "knob" }
                ]
              }
            ]
          }
          LMEOF
          mkdir -p "$(dirname "README.md")"
          cat > "README.md" <<'LMEOF'
          # Loudness Meter

          Shown on screen as **Utility Meter**. A loudness, level and phase meter for Akai MPC standalone, by gltchsqnz, in the spirit of the
          Youlean Loudness Meter. Put it last on a track or the master: audio passes through untouched,
          the plugin only measures.

          Measurements follow ITU-R BS.1770-4 / EBU R128 and read within 0.1 LU of the EBU Tech 3341
          reference signals (and exactly on the Tech 3342 LRA cases) at 44.1, 48 and 96 kHz.

          ## The screen (METER tab)

          - **Mode** buttons choose what the big readout and the two bars show:
            - **dB**: sample peak in dBFS (bars = L / R peak, falling at 20 dB/s; readout = peak of the last 0.5 s)
            - **TRUE PEAK**: 4x oversampled true peak in dBTP (same bars and readout, inter-sample peaks included)
            - **LUFS**: loudness (bars = **M**omentary / **S**hort-term; readout = the loudness picked with **View**)
          - **View**: MOM (momentary, 400 ms), SHORT (short-term, 3 s) or INT (integrated, gated, since the last reset)
          - **Target**: the loudness target, with platform presets (-14 Spotify / YouTube / Amazon, -16 Apple / Podcast,
            -15 Deezer, -23 EBU R128, -24 ATSC A/85, -18, -12, -10, -8 Club)
          - **Reset**: restart the measurement (springs back by itself)
          - **VU needle**: a classic VU (300 ms ballistics, 0 VU = **VU Ref**) in dB and True Peak modes; in LUFS mode it
            shows momentary loudness relative to the Target in LU, so 0 on the dial means "on target"
          - **Readout**: the large precise number, with an **OVER** lamp that latches when the true peak passes **TP Limit**
          - **Correlation**: phase correlation of left and right, -1 .. +1 (+1 mono / in phase, 0 wide or unrelated,
            below 0 out of phase: red). Lit from the centre out to the value, with a white marker; ~300 ms response
          - **Readings**: Integrated, Vs Target (integrated minus target), Short-term, Momentary, their maxima, LRA,
            PLR (true-peak max minus integrated), True Peak max, Sample Peak max, RMS (300 ms), Target

          ## SETUP tab

          - **Auto Reset**: On restarts the measurement whenever the MPC starts playing
          - **VU Ref**: the level that reads 0 VU (a sine peaking at this dBFS level), -24 to -8, default -18
          - **TP Limit**: the true-peak ceiling for the OVER lamp, -6 to 0 dBTP, default -1

          ## Parameters

          | # | Name | |
          |---|------|--|
          | 0 | Target | target preset |
          | 1 | Mode | dB / True Peak / LUFS |
          | 2 | View | Momentary / Short-term / Integrated |
          | 3 | Reset | momentary |
          | 4 | Auto Reset | Off / On |
          | 5 | VU Ref | dBFS |
          | 6 | TP Limit | dBTP |
          | 7-22 | readings | written by the plugin, not automatable: Readout, Bar L, Bar R, Needle, Integrated, Vs Target, Short-term, Momentary, Short Max, Mom Max, LRA, PLR, True Peak, Sample Peak, RMS, TP Over |
          | 23 | Correlation | reading, -1 .. +1 (added in 1.1.0) |

          Programs: Spotify, YouTube, Apple Music, EBU R128, ATSC A/85 (VU Ref -20, TP -2), Podcast, Club Master
          (-8 target, True Peak mode, TP -0.3), Peak / VU (dB mode).

          ## How the meters reach the screen

          The MPC gives scripted skins no audio level of their own, so every reading is a parameter that the
          plugin writes and reports to the host: the bars and needle about 30 times a second, the numbers 10 times
          a second, each only when it has visibly changed. The skin binds film-strip images (LED bars, needle,
          correlation bar, OVER lamp) and text labels to those parameters. For 0.3 s after a project or preset
          load nothing is written, so the loaded state stays intact.

          ## Measurement notes

          - K-weighting coefficients are derived for the running sample rate (libebur128 formulas).
          - Integrated loudness and LRA use 0.01 LU histograms, so memory stays fixed however long you measure.
          - RMS is plain RMS (a full-scale sine reads -3.0 dBFS); VU uses the AES17 convention (a sine reads its peak level).
          - Correlation = E[LR] / sqrt(E[L²] E[R²]) over ~300 ms; it reads 0 while either side is silent.
          - True peak uses the 48-tap interpolator of BS.1770-4 Annex 2; a worst-case inter-sample sine reads +0.08 dBTP
            high, within the standard's tolerance.
          - Resuming playback or loading a preset does not clear the measurement; Reset (or Auto Reset) does.

          ## Look

          Brushed silver skin, blue Mode / View buttons with their names painted underneath, the gltchsqnz logo with
          the title "Utility Meter" bottom right. `make_silver.py` draws it (LED bars, VU face, needle, correlation bar,
          panels, logo). The plugin's name stays "Loudness Meter" so existing projects and the skin folder keep working.

          ## Knob FX mapping

          The SDK requires effects to declare one. It only matters on an MPC Sample (which has no screen, so a
          meter is of little use there): knobs Mode / View / Target; SHIFT + knobs VU Ref / TP Limit / Auto Reset.

          ## Licence

          MIT.
          LMEOF
          mkdir -p "$(dirname ".gitignore")"
          cat > ".gitignore" <<'LMEOF'
          build/
          dist/
          LMEOF
          mkdir -p "$(dirname "src/LoudnessMeter.cpp")"
          cat > "src/LoudnessMeter.cpp" <<'LMEOF'
          // Loudness Meter - an MPC insert effect plugin by gltchsqnz
          //
          // A loudness / level meter in the spirit of Youlean Loudness Meter. Audio passes through untouched
          // (bit-exact); the plugin only measures. The measuring core is LoudnessDsp.h (its header explains the
          // maths: BS.1770-4 / EBU R128 loudness, LRA, 4x true peak, sample peak, RMS and VU ballistics).
          //
          // Signal flow:
          //     in -> out (unchanged)
          //      \-> K-weighting -> M / S / I loudness, LRA
          //      \-> 4x oversampled true peak, sample peak, RMS, VU ballistics
          //
          // How the screen is driven: the MPC has no level feed from a plugin, so every reading is a parameter
          // that the plugin writes itself (the "read-only" parameters below) and reports to the host. The skin
          // binds its bars, needle, readouts and history graph to those parameters.
          //   - bars and needle are refreshed about 30 times a second, numbers 10 times a second,
          //   - a parameter is only re-sent when its value has visibly changed,
          //   - for 0.3 s after a project / preset load nothing is written, so the loaded state stays intact.
          //
          // Parameters (order is permanent once released; append new ones at the END):
          //   Controls
          //   0 Target      loudness target preset (platform / standard). Harmless on load (the host nudges param 0).
          //   1 Mode        what the big readout and the bars show: dB (sample peak, dBFS), True Peak (dBTP), LUFS
          //   2 View        which loudness the big readout shows in LUFS mode: Momentary, Short-term, Integrated
          //   3 Reset       press to restart the measurement (springs back to Off by itself)
          //   4 Auto Reset  On: the measurement restarts whenever the MPC starts playing
          //   5 VU Ref      the dBFS level that reads 0 VU (a sine peaking at this level)
          //   6 TP Limit    true-peak ceiling: the OVER lamp lights when the true peak goes above it
          //   Readings (written by the plugin, not automatable)
          //   7 Readout     the big number (unit follows Mode)
          //   8 Bar L       left bar  (dB / TP modes: channel level; LUFS mode: Momentary)
          //   9 Bar R       right bar (dB / TP modes: channel level; LUFS mode: Short-term)
          //  10 Needle      needle position: VU in dB / TP modes, Momentary relative to Target (LU) in LUFS mode
          //  11 Integrated  12 Vs Target  13 Short-term  14 Momentary  15 Short Max  16 Mom Max
          //  17 LRA         18 PLR (true peak max - integrated)  19 True Peak (max)  20 Sample Peak (max)  21 RMS
          //  22 TP Over     latched when the true peak exceeds TP Limit (cleared by Reset)
          //  23 Correlation phase correlation of L and R, -1 .. +1 (appended in 1.1.0)

          #include "mpc_plugin.h"
          #include "LoudnessDsp.h"

          #include <algorithm>
          #include <cmath>
          #include <cstdio>
          #include <cstring>

          namespace {

          enum ParamIndex
          {
              kTarget = 0, kMode, kView, kReset, kAutoReset, kVuRef, kTpLimit,
              kReadout, kBarL, kBarR, kNeedle,
              kInteg, kVsTarget, kShort, kMom, kShortMax, kMomMax, kLra, kPlr, kTpMax, kPeakMax, kRms, kOver,
              kCorr,       // appended in 1.1.0 (new parameters always go at the end)
              kNumParams
          };

          enum Mode { kModeDb = 0, kModeTp, kModeLufs };
          enum View { kViewMom = 0, kViewShort, kViewInteg };

          struct TargetDef { const char* name; float lufs; };
          const TargetDef kTargets[] = {
              {"-23 EBU", -23.0f}, {"-24 ATSC", -24.0f}, {"-14 Spotify", -14.0f}, {"-14 YouTube", -14.0f},
              {"-16 Apple", -16.0f}, {"-14 Amazon", -14.0f}, {"-15 Deezer", -15.0f}, {"-16 Podcast", -16.0f},
              {"-18", -18.0f}, {"-12", -12.0f}, {"-10", -10.0f}, {"-8 Club", -8.0f},
          };
          constexpr int kNumTargets = (int)(sizeof(kTargets) / sizeof(kTargets[0]));
          constexpr int kDefaultTarget = 2;     // -14 Spotify

          // Ranges of the reading parameters (plain values). The bottom of each range means "nothing yet".
          constexpr float kLoudLo = -70.0f, kLoudHi = 5.0f;     // LUFS readings
          constexpr float kBarLo = -60.0f,  kBarHi = 3.0f;      // bars: 63 one-dB segments
          constexpr float kPkLo = -70.0f,   kPkHi = 12.0f;      // peaks
          constexpr float kLuLo = -1.0f,    kLuHi = 40.0f;      // LRA / PLR (-1 = undefined)
          constexpr float kDevLo = -40.0f,  kDevHi = 40.0f;     // Vs Target (-40 = undefined)

          // VU / LU needle scale: -20 .. +3, with the classic VU law (deflection follows voltage).
          constexpr double kNeedleLo = -20.0, kNeedleHi = 3.0;
          double needleFraction(double v)
          {
              const double lo = std::pow(10.0, kNeedleLo / 20.0), hi = std::pow(10.0, kNeedleHi / 20.0);
              double f = (std::pow(10.0, v / 20.0) - lo) / (hi - lo);
              return std::min(1.0, std::max(0.0, f));
          }
          double needleValue(double f)
          {
              const double lo = std::pow(10.0, kNeedleLo / 20.0), hi = std::pow(10.0, kNeedleHi / 20.0);
              return 20.0 * std::log10(lo + std::max(0.0, f) * (hi - lo));
          }

          } // namespace

          class LoudnessMeter : public mpc::Plugin
          {
          public:
              LoudnessMeter() : mpc::Plugin(makeInfo())
              {
                  using namespace mpc;
                  std::vector<std::string> targetNames;
                  for (int i = 0; i < kNumTargets; ++i) targetNames.push_back(kTargets[i].name);

                  // ids are saved in projects: never rename them once released.
                  addParam(choiceParam("target",    "Target",     targetNames, kDefaultTarget));
                  addParam(choiceParam("mode",      "Mode",       {"dB", "True Peak", "LUFS"}, kModeLufs));
                  addParam(choiceParam("view",      "View",       {"Momentary", "Short-term", "Integrated"}, kViewShort));
                  addParam(boolParam  ("reset",     "Reset",      false));
                  addParam(choiceParam("autoreset", "Auto Reset", {"Off", "On"}, 0));
                  addParam(floatParam ("vuref",     "VU Ref",     -24.0f, -8.0f, -18.0f, "dBFS", 1));
                  addParam(floatParam ("tplimit",   "TP Limit",   -6.0f, 0.0f, -1.0f, "dBTP", 1));

                  reading("readout",   "Readout",     kLoudLo, kLoudHi);
                  reading("barl",      "Bar L",       kBarLo, kBarHi);
                  reading("barr",      "Bar R",       kBarLo, kBarHi);
                  reading("needle",    "Needle",      0.0f, 1.0f, 4);
                  reading("integ",     "Integrated",  kLoudLo, kLoudHi);
                  reading("vstarget",  "Vs Target",   kDevLo, kDevHi);
                  reading("short",     "Short-term",  kLoudLo, kLoudHi);
                  reading("mom",       "Momentary",   kLoudLo, kLoudHi);
                  reading("shortmax",  "Short Max",   kLoudLo, kLoudHi);
                  reading("mommax",    "Mom Max",     kLoudLo, kLoudHi);
                  reading("lra",       "LRA",         kLuLo, kLuHi);
                  reading("plr",       "PLR",         kLuLo, kLuHi);
                  reading("tpmax",     "True Peak",   kPkLo, kPkHi);
                  reading("peakmax",   "Sample Peak", kPkLo, kPkHi);
                  reading("rms",       "RMS",         kPkLo, kPkHi);
                  {
                      Param p = boolParam("tpover", "TP Over", false);
                      p.automatable = false;
                      addParam(p);
                  }
                  // appended in 1.1.0
                  reading("corr",      "Correlation", -1.0f, 1.0f, 2);

                  // Built-in programs (plain values of the controls, in parameter order):
                  //                         Target Mode       View        Reset AutoRst VURef  TPLimit
                  addProgram("Spotify",      { 2.0f, kModeLufs, kViewInteg, 0.0f, 0.0f, -18.0f, -1.0f});
                  addProgram("YouTube",      { 3.0f, kModeLufs, kViewInteg, 0.0f, 0.0f, -18.0f, -1.0f});
                  addProgram("Apple Music",  { 4.0f, kModeLufs, kViewInteg, 0.0f, 0.0f, -18.0f, -1.0f});
                  addProgram("EBU R128",     { 0.0f, kModeLufs, kViewInteg, 0.0f, 0.0f, -18.0f, -1.0f});
                  addProgram("ATSC A/85",    { 1.0f, kModeLufs, kViewInteg, 0.0f, 0.0f, -20.0f, -2.0f});
                  addProgram("Podcast",      { 7.0f, kModeLufs, kViewShort, 0.0f, 0.0f, -18.0f, -1.0f});
                  addProgram("Club Master",  {11.0f, kModeTp,   kViewShort, 0.0f, 0.0f, -14.0f, -0.3f});
                  addProgram("Peak / VU",    { 2.0f, kModeDb,   kViewShort, 0.0f, 0.0f, -18.0f, -1.0f});
              }

              void prepare(double sampleRate, int maxBlockSize) override
              {
                  (void)maxBlockSize;
                  fs_ = sampleRate;
                  meter_.prepare(sampleRate);
                  fastLen_ = std::max(1, (int)std::lround(sampleRate / 30.0));
                  barFallPerTick_ = 20.0f / 30.0f;            // bars fall at 20 dB per second
                  readoutTicks_ = 15;                          // dB / TP readout: peak of the last 0.5 s (15 x 1/30 s)
                  clearAll();
                  quiet_ = 0;
              }

              void reset() override
              {
                  // Called on resume and after a state / preset load: keep the measurement, clear filter memories,
                  // and stay quiet for a moment so freshly loaded parameter values are not overwritten at once.
                  meter_.resetFilters();
                  quiet_ = (int)(fs_ * 0.3);
              }

              bool formatValue(int index, float v, std::string& out) override
              {
                  char buf[48];
                  switch (index)
                  {
                      case kReadout:
                      {
                          const int mode = getInt(kMode);
                          const char* unit = mode == kModeDb ? "dBFS" : (mode == kModeTp ? "dBTP" : "LUFS");
                          if (v <= kLoudLo + 0.05f) std::snprintf(buf, sizeof(buf), "-inf %s", unit);
                          else std::snprintf(buf, sizeof(buf), "%.1f %s", (double)v, unit);
                          out = clean(buf); return true;
                      }
                      case kBarL: case kBarR:
                          out = v <= kBarLo + 0.05f ? "-inf" : clean(fmt(buf, sizeof(buf), "%.1f", v)); return true;
                      case kNeedle:
                      {
                          double n = needleValue(v);
                          if (std::fabs(n) < 0.05) n = 0.0;
                          std::snprintf(buf, sizeof(buf), "%+.1f %s", n, getInt(kMode) == kModeLufs ? "LU" : "VU");
                          out = buf; return true;
                      }
                      case kInteg: case kShort: case kMom: case kShortMax: case kMomMax:
                          out = v <= kLoudLo + 0.05f ? "-inf LUFS" : clean(fmt(buf, sizeof(buf), "%.1f LUFS", v)); return true;
                      case kVsTarget:
                          if (v <= kDevLo + 0.05f) { out = "-"; return true; }
                          if (std::fabs(v) < 0.05f) { out = "0.0 LU"; return true; }
                          std::snprintf(buf, sizeof(buf), "%+.1f LU", (double)v); out = buf; return true;
                      case kCorr:
                          if (std::fabs(v) < 0.005f) { out = "0.00"; return true; }
                          std::snprintf(buf, sizeof(buf), "%+.2f", (double)v); out = buf; return true;
                      case kLra: case kPlr:
                          out = v < 0.0f ? "-" : fmt(buf, sizeof(buf), "%.1f LU", v); return true;
                      case kTpMax:
                          out = v <= kPkLo + 0.05f ? "-inf dBTP" : clean(fmt(buf, sizeof(buf), "%.1f dBTP", v)); return true;
                      case kPeakMax: case kRms:
                          out = v <= kPkLo + 0.05f ? "-inf dBFS" : clean(fmt(buf, sizeof(buf), "%.1f dBFS", v)); return true;
                      default:
                          return false;
                  }
              }

              void process(mpc::ProcessContext& ctx) override
              {
                  const int n = ctx.numFrames;
                  const float* inL = ctx.inputs ? ctx.inputs[0] : nullptr;
                  const float* inR = (ctx.inputs && ctx.numInputs > 1) ? ctx.inputs[1] : inL;

                  // Audio passes through unchanged. With in-place processing the buffers are the same; otherwise copy.
                  for (int c = 0; c < ctx.numOutputs; ++c)
                  {
                      const float* src = (c == 0) ? inL : inR;
                      if (src && ctx.outputs[c] && ctx.outputs[c] != src) std::memcpy(ctx.outputs[c], src, sizeof(float) * (size_t)n);
                  }
                  if (!inL) return;

                  // Controls
                  if (getBool(kReset))
                  {
                      clearAll();
                      publish(kReset, 0.0f, 0.5f, true);
                  }
                  const bool playing = ctx.transport.playing;
                  if (playing && !wasPlaying_ && getInt(kAutoReset) == 1) clearAll();
                  wasPlaying_ = playing;

                  for (int i = 0; i < n; ++i)
                  {
                      const bool blockDone = meter_.frame(inL[i], inR[i]);
                      if (++fastCount_ >= fastLen_) { fastCount_ = 0; fastTick(); }
                      if (blockDone) slowTick();
                  }
                  if (quiet_ > 0) quiet_ = std::max(0, quiet_ - n);
              }

          private:
              static mpc::PluginInfo makeInfo()
              {
                  mpc::PluginInfo i;
                  i.name = "Loudness Meter";
                  i.vendor = "gltchsqnz";
                  i.uniqueId = MPC_FOURCC('G', 'L', 'd', 'M');
                  i.version = 1100;
                  i.isInstrument = false;
                  i.numInputs = 2;
                  i.numOutputs = 2;
                  i.tailSamples = 1;
                  return i;
              }

              void reading(const char* id, const char* name, float lo, float hi, int decimals = 1)
              {
                  mpc::Param p = mpc::floatParam(id, name, lo, hi, lo, "", decimals);
                  p.automatable = false;
                  addParam(p);
              }

              static const char* fmt(char* buf, size_t size, const char* f, float v)
              {
                  std::snprintf(buf, size, f, (double)v);
                  return buf;
              }
              static std::string clean(const char* s)            // "-0.0 ..." -> "0.0 ..."
              {
                  if (s[0] == '-' && s[1] == '0' && s[2] == '.' && s[3] == '0' && (s[4] == 0 || s[4] == ' ')) return std::string(s + 1);
                  return s;
              }

              float targetLufs() const { return kTargets[std::min(std::max(getInt(kTarget), 0), kNumTargets - 1)].lufs; }

              // Write a reading and tell the host, if it moved by at least `step` (or `force`).
              void publish(int idx, float plain, float step, bool force = false)
              {
                  if (quiet_ > 0 && !force) return;
                  const mpc::Param& p = param(idx);
                  plain = std::min(std::max(plain, std::fmin(p.min, p.max)), std::fmax(p.min, p.max));
                  if (!force && std::fabs(get(idx) - plain) < step) return;
                  set(idx, plain);
                  notifyHostParameterChanged(idx);
              }

              static float lufsOrFloor(double l, float lo) { return l <= loud::kSilent + 1.0 ? lo : (float)l; }
              static float dbOrFloor(double g, float lo) { double d = loud::gainToDb(g); return d <= loud::kSilent + 1.0 ? lo : (float)d; }

              void clearAll()
              {
                  meter_.clear();
                  barL_ = barR_ = kBarLo;
                  needleF_ = 0.0;
                  holdTicks_ = 0;
                  holdPeak_ = holdTp_ = 0.0f;
                  fastCount_ = 0;
                  publish(kOver, 0.0f, 0.5f, true);
                  publish(kCorr, 0.0f, 0.0f, true);
                  for (int idx = kReadout; idx < kOver; ++idx)
                  {
                      const mpc::Param& p = param(idx);
                      publish(idx, p.min, 0.0f, true);
                  }
              }

              // ~30 Hz: bars, needle, dB / TP readout window
              void fastTick()
              {
                  const int mode = getInt(kMode);
                  meter_.notePeaks();
                  float lvl[2];
                  for (int c = 0; c < 2; ++c)
                  {
                      const float pk = (mode == kModeTp) ? meter_.winTp[c] : meter_.winPeak[c];
                      lvl[c] = dbOrFloor(pk, kBarLo);
                  }
                  holdPeak_ = std::max(holdPeak_, std::max(meter_.winPeak[0], meter_.winPeak[1]));
                  holdTp_ = std::max(holdTp_, std::max(meter_.winTp[0], meter_.winTp[1]));
                  meter_.clearWindow();

                  if (mode == kModeLufs)
                  {
                      barL_ = lufsOrFloor(meter_.momentary, kBarLo);
                      barR_ = lufsOrFloor(meter_.shortTerm, kBarLo);
                  }
                  else
                  {
                      // instant attack, 20 dB/s fall
                      barL_ = std::max(lvl[0], std::max(kBarLo, barL_ - barFallPerTick_));
                      barR_ = std::max(lvl[1], std::max(kBarLo, barR_ - barFallPerTick_));
                  }
                  publish(kBarL, barL_, 0.25f);
                  publish(kBarR, barR_, 0.25f);

                  double target;
                  if (mode == kModeLufs)
                      target = meter_.momentary <= loud::kSilent + 1.0 ? -60.0 : meter_.momentary - targetLufs();
                  else
                      target = meter_.vuDbfs() - get(kVuRef);
                  const double f = needleFraction(target);
                  needleF_ += 0.5 * (f - needleF_);        // a little extra damping between updates
                  publish(kNeedle, (float)needleF_, 0.002f);
                  publish(kCorr, (float)meter_.correlation(), 0.01f);

                  // Over lamp (latched)
                  if (meter_.tpMax > 0.0f && loud::gainToDb(meter_.tpMax) > get(kTpLimit) + 1e-4 && !getBool(kOver))
                      publish(kOver, 1.0f, 0.5f);

                  // dB / TP readout: the peak of the last 0.5 s, refreshed every 0.5 s
                  if (mode != kModeLufs && ++holdTicks_ >= readoutTicks_)
                  {
                      holdTicks_ = 0;
                      publish(kReadout, dbOrFloor(mode == kModeTp ? holdTp_ : holdPeak_, kLoudLo), 0.05f);
                      holdPeak_ = holdTp_ = 0.0f;
                  }
              }

              // every 100 ms: loudness numbers
              void slowTick()
              {
                  const loud::Meter& m = meter_;
                  const float integ = lufsOrFloor(m.integrated, kLoudLo);
                  const float tpDb = dbOrFloor(m.tpMax, kPkLo);
                  publish(kInteg, integ, 0.05f);
                  publish(kShort, lufsOrFloor(m.shortTerm, kLoudLo), 0.05f);
                  publish(kMom, lufsOrFloor(m.momentary, kLoudLo), 0.05f);
                  publish(kShortMax, lufsOrFloor(m.shortMax, kLoudLo), 0.05f);
                  publish(kMomMax, lufsOrFloor(m.momMax, kLoudLo), 0.05f);
                  publish(kLra, m.lra < 0.0 ? kLuLo : (float)m.lra, 0.05f);
                  const bool haveI = integ > kLoudLo + 0.05f;
                  publish(kPlr, (haveI && tpDb > kPkLo + 0.05f) ? std::max(0.0f, tpDb - integ) : kLuLo, 0.05f);
                  publish(kVsTarget, haveI ? integ - targetLufs() : kDevLo, 0.05f);
                  publish(kTpMax, tpDb, 0.05f);
                  publish(kPeakMax, dbOrFloor(m.peakMax, kPkLo), 0.05f);
                  publish(kRms, m.rms <= loud::kSilent + 1.0 ? kPkLo : (float)m.rms, 0.05f);

                  if (getInt(kMode) == kModeLufs)
                  {
                      const int view = getInt(kView);
                      const double l = view == kViewMom ? m.momentary : (view == kViewShort ? m.shortTerm : m.integrated);
                      publish(kReadout, lufsOrFloor(l, kLoudLo), 0.05f);
                  }
              }

              loud::Meter meter_;
              double fs_ = 48000.0;
              int fastLen_ = 1600, fastCount_ = 0;
              float barFallPerTick_ = 0.67f;
              float barL_ = kBarLo, barR_ = kBarLo;
              double needleF_ = 0.0;
              int holdTicks_ = 0, readoutTicks_ = 15;
              float holdPeak_ = 0.0f, holdTp_ = 0.0f;
              int quiet_ = 0;
              bool wasPlaying_ = false;
          };

          MPC_PLUGIN_ENTRY(LoudnessMeter)
          LMEOF
          mkdir -p "$(dirname "src/LoudnessDsp.h")"
          cat > "src/LoudnessDsp.h" <<'LMEOF'
          // LoudnessDsp.h - the measuring core of the gltchsqnz Loudness Meter.
          //
          // Everything here follows ITU-R BS.1770-4 / EBU R128 (Tech 3341, 3342):
          //
          //   K-weighting      a high shelf (+4 dB above ~1.7 kHz, the "head" filter) followed by a high-pass
          //                    (~38 Hz, the "RLB" filter). Coefficients are derived for any sample rate with the
          //                    bilinear-transform formulas used by libebur128, so 44.1, 48, 88.2 and 96 kHz all read
          //                    the same.
          //   Loudness         L = -0.691 + 10 log10( sum over channels of mean(square(K-weighted signal)) )
          //                    (left and right have weight 1.0)
          //   Momentary  (M)   400 ms sliding window, updated every 100 ms
          //   Short-term (S)   3 s sliding window, updated every 100 ms
          //   Integrated (I)   all 400 ms blocks (75 % overlap) since the last reset, gated twice:
          //                    absolute gate -70 LUFS, then relative gate 10 LU below the loudness of the blocks that
          //                    passed the absolute gate. Stored as a 0.01 LU histogram of block energies, so memory is
          //                    fixed however long the measurement runs.
          //   LRA              EBU Tech 3342: short-term values (every 100 ms), absolute gate -70, relative gate -20 LU,
          //                    LRA = 95th percentile - 10th percentile.
          //   True peak        4x oversampling with the 48-tap polyphase FIR of BS.1770-4 Annex 2, absolute maximum.
          //   Sample peak      plain absolute maximum of the input samples.
          //   RMS              300 ms window (3 x 100 ms blocks), unweighted, of the louder channel.
          //                    Plain RMS: a full-scale sine reads -3.0 dB.
          //   Correlation      phase correlation of L and R: E[LR] / sqrt(E[L^2] E[R^2]), each average an exponential
          //                    window of about 300 ms. +1 = mono / in phase, 0 = unrelated (wide), -1 = out of phase.
          //   VU               the squared signal through two cascaded one-pole low-passes (critically damped,
          //                    reaches 99 % of a step in about 300 ms, like a VU needle), read with the AES17
          //                    convention (+3.01 dB) so a sine peaking at the VU reference reads 0 VU.
          //
          // Real-time safe: no allocation after prepare(), no locks.

          #pragma once

          #include <algorithm>
          #include <cmath>
          #include <cstring>
          #include <vector>

          namespace loud {

          constexpr double kPi = 3.14159265358979323846;
          constexpr double kAbsGate = -70.0;          // LUFS
          constexpr double kHistLo = -70.0;           // histogram range for gating, LUFS
          constexpr double kHistHi = 10.0;
          constexpr double kHistStep = 0.01;          // LU per bin
          constexpr int    kHistBins = (int)((kHistHi - kHistLo) / kHistStep + 0.5);   // 8000
          constexpr int    kShortBlocks = 30;         // 30 x 100 ms = 3 s
          constexpr int    kMomBlocks = 4;            // 4 x 100 ms = 400 ms
          constexpr int    kRmsBlocks = 3;            // 300 ms
          constexpr double kSilent = -200.0;          // "no value" loudness

          inline double energyToLufs(double e) { return e > 1e-20 ? -0.691 + 10.0 * std::log10(e) : kSilent; }
          inline double lufsToEnergy(double l) { return std::pow(10.0, (l + 0.691) / 10.0); }
          inline double gainToDb(double g) { return g > 1e-10 ? 20.0 * std::log10(g) : kSilent; }

          // ------------------------------------------------------------------------------------------
          // K-weighting (two biquads, transposed direct form II, double precision)
          // ------------------------------------------------------------------------------------------
          struct Biquad
          {
              double b0 = 1, b1 = 0, b2 = 0, a1 = 0, a2 = 0;
              double z1 = 0, z2 = 0;
              void reset() { z1 = z2 = 0.0; }
              double process(double x)
              {
                  double y = b0 * x + z1;
                  z1 = b1 * x - a1 * y + z2;
                  z2 = b2 * x - a2 * y;
                  return y;
              }
          };

          struct KWeighting
          {
              Biquad shelf, highpass;

              void prepare(double fs)
              {
                  // Stage 1: high shelf (libebur128 / BS.1770 derivation)
                  {
                      const double f0 = 1681.974450955533, G = 3.999843853973347, Q = 0.7071752369554196;
                      const double K = std::tan(kPi * f0 / fs);
                      const double Vh = std::pow(10.0, G / 20.0);
                      const double Vb = std::pow(Vh, 0.4996667741545416);
                      const double a0 = 1.0 + K / Q + K * K;
                      shelf.b0 = (Vh + Vb * K / Q + K * K) / a0;
                      shelf.b1 = 2.0 * (K * K - Vh) / a0;
                      shelf.b2 = (Vh - Vb * K / Q + K * K) / a0;
                      shelf.a1 = 2.0 * (K * K - 1.0) / a0;
                      shelf.a2 = (1.0 - K / Q + K * K) / a0;
                  }
                  // Stage 2: high-pass (RLB)
                  {
                      const double f0 = 38.13547087602444, Q = 0.5003270373238773;
                      const double K = std::tan(kPi * f0 / fs);
                      const double a0 = 1.0 + K / Q + K * K;
                      highpass.b0 = 1.0; highpass.b1 = -2.0; highpass.b2 = 1.0;
                      highpass.a1 = 2.0 * (K * K - 1.0) / a0;
                      highpass.a2 = (1.0 - K / Q + K * K) / a0;
                  }
                  reset();
              }
              void reset() { shelf.reset(); highpass.reset(); }
              double process(double x) { return highpass.process(shelf.process(x)); }
          };

          // ------------------------------------------------------------------------------------------
          // True peak: 4x polyphase interpolator, BS.1770-4 Annex 2 (12 taps per phase)
          // ------------------------------------------------------------------------------------------
          struct TruePeak
          {
              static constexpr int kTaps = 12;
              float hist[kTaps * 2] = {};     // doubled ring so a contiguous window is always available
              int   pos = 0;

              void reset() { std::memset(hist, 0, sizeof(hist)); pos = 0; }

              // Push one sample, return the largest absolute value of the 4 interpolated points.
              float process(float x)
              {
                  static const float kCoef[4][kTaps] = {
                      { 0.0017089843750f,  0.0109863281250f, -0.0196533203125f,  0.0332031250000f, -0.0594482421875f,  0.1373291015625f,
                        0.9721679687500f, -0.1022949218750f,  0.0476074218750f, -0.0266113281250f,  0.0148925781250f, -0.0083007812500f },
                      {-0.0291748046875f,  0.0292968750000f, -0.0517578125000f,  0.0891113281250f, -0.1665039062500f,  0.4650878906250f,
                        0.7797851562500f, -0.2003173828125f,  0.1015625000000f, -0.0582275390625f,  0.0330810546875f, -0.0189208984375f },
                      {-0.0189208984375f,  0.0330810546875f, -0.0582275390625f,  0.1015625000000f, -0.2003173828125f,  0.7797851562500f,
                        0.4650878906250f, -0.1665039062500f,  0.0891113281250f, -0.0517578125000f,  0.0292968750000f, -0.0291748046875f },
                      {-0.0083007812500f,  0.0148925781250f, -0.0266113281250f,  0.0476074218750f, -0.1022949218750f,  0.9721679687500f,
                        0.1373291015625f, -0.0594482421875f,  0.0332031250000f, -0.0196533203125f,  0.0109863281250f,  0.0017089843750f },
                  };
                  // newest sample at hist[pos + kTaps - 1] after the write below; window = hist[pos .. pos+kTaps-1], oldest first
                  hist[pos] = x;
                  hist[pos + kTaps] = x;
                  pos = (pos + 1) % kTaps;
                  const float* w = hist + pos;           // oldest .. newest
                  float m = 0.0f;
                  for (int ph = 0; ph < 4; ++ph)
                  {
                      float acc = 0.0f;
                      // coefficient k multiplies the sample k steps back from the newest
                      for (int k = 0; k < kTaps; ++k) acc += kCoef[ph][k] * w[kTaps - 1 - k];
                      m = std::max(m, std::fabs(acc));
                  }
                  return m;
              }
          };

          // ------------------------------------------------------------------------------------------
          // Gating histogram (energies, 0.01 LU bins from -70 to +10 LUFS)
          // ------------------------------------------------------------------------------------------
          struct GateHistogram
          {
              std::vector<unsigned> count;
              std::vector<double>   energy;
              unsigned long long    total = 0;

              void prepare() { count.assign(kHistBins, 0u); energy.assign(kHistBins, 0.0); total = 0; }
              void clear() { std::fill(count.begin(), count.end(), 0u); std::fill(energy.begin(), energy.end(), 0.0); total = 0; }

              static int binOf(double lufs)
              {
                  int b = (int)std::floor((lufs - kHistLo) / kHistStep);
                  return std::min(std::max(b, 0), kHistBins - 1);
              }
              static double binLufs(int b) { return kHistLo + (b + 0.5) * kHistStep; }

              void add(double e)
              {
                  double l = energyToLufs(e);
                  if (l <= kAbsGate || count.empty()) return;      // absolute gate
                  int b = binOf(l);
                  count[(size_t)b]++; energy[(size_t)b] += e; total++;
              }

              // Mean energy of the blocks whose loudness is above `gate` (bins entirely above it). Returns 0 when none.
              double meanAbove(double gate, unsigned long long* n = nullptr) const
              {
                  int first = (gate <= kHistLo) ? 0 : binOf(gate) + 1;
                  double e = 0.0; unsigned long long c = 0;
                  for (int b = first; b < kHistBins; ++b) { c += count[(size_t)b]; e += energy[(size_t)b]; }
                  if (n) *n = c;
                  return c ? e / (double)c : 0.0;
              }

              // Integrated loudness, gated at -70 and then 10 LU below the absolute-gated loudness.
              double integrated() const
              {
                  if (total == 0) return kSilent;
                  double absMean = meanAbove(kHistLo);
                  double rel = energyToLufs(absMean) - 10.0;
                  double e = meanAbove(rel);
                  return e > 0.0 ? energyToLufs(e) : kSilent;
              }

              // Loudness range (Tech 3342): relative gate -20 LU, 10th..95th percentile. Returns < 0 when undefined.
              double range() const
              {
                  if (total < 2) return -1.0;
                  double absMean = meanAbove(kHistLo);
                  double rel = energyToLufs(absMean) - 20.0;
                  unsigned long long n = 0;
                  meanAbove(rel, &n);
                  if (n < 2) return -1.0;
                  int first = binOf(rel) + 1;
                  auto percentile = [&](double p) {
                      unsigned long long target = (unsigned long long)std::floor((double)(n - 1) * p + 0.5);
                      unsigned long long acc = 0;
                      for (int b = first; b < kHistBins; ++b)
                      {
                          acc += count[(size_t)b];
                          if (acc > target) return binLufs(b);
                      }
                      return binLufs(kHistBins - 1);
                  };
                  return std::max(0.0, percentile(0.95) - percentile(0.10));
              }
          };

          // ------------------------------------------------------------------------------------------
          // The meter: feed stereo frames, read results after each 100 ms block
          // ------------------------------------------------------------------------------------------
          class Meter
          {
          public:
              void prepare(double fs)
              {
                  fs_ = fs;
                  blockLen_ = std::max(1, (int)std::lround(fs * 0.1));
                  for (int c = 0; c < 2; ++c) kw_[c].prepare(fs);
                  integ_.prepare();
                  lra_.prepare();
                  // VU: two one-poles with tau = 300 ms / 6.64 (99 % of a step in ~300 ms)
                  vuCoef_ = 1.0 - std::exp(-1.0 / (fs * 0.300 / 6.64));
                  corrCoef_ = 1.0 - std::exp(-1.0 / (fs * 0.300));
                  clear();
              }

              // Clear filter memories only (used on resume): measurements continue.
              void resetFilters()
              {
                  for (int c = 0; c < 2; ++c) { kw_[c].reset(); tp_[c].reset(); }
              }

              // Start a fresh measurement.
              void clear()
              {
                  resetFilters();
                  integ_.clear(); lra_.clear();
                  std::fill(std::begin(blockE_), std::end(blockE_), 0.0);
                  std::memset(rawE_, 0, sizeof(rawE_));
                  blocks_ = 0; ring_ = 0; inBlock_ = 0;
                  acc_ = 0.0; raw_[0] = raw_[1] = 0.0;
                  momentary = shortTerm = integrated = kSilent;
                  momMax = shortMax = kSilent;
                  lra = -1.0;
                  tpMax = peakMax = 0.0f;
                  rms = kSilent;
                  for (int c = 0; c < 2; ++c) { vu1_[c] = vu2_[c] = 0.0; winPeak[c] = winTp[c] = 0.0f; }
                  sLR_ = sLL_ = sRR_ = 0.0;
              }

              // Process one stereo frame. Returns true when a 100 ms block has just completed (results updated).
              bool frame(float l, float r)
              {
                  const float in[2] = { l, r };
                  double sum = 0.0;
                  for (int c = 0; c < 2; ++c)
                  {
                      const double x = in[c];
                      const double k = kw_[c].process(x);
                      sum += k * k;
                      raw_[c] += x * x;
                      const float a = std::fabs(in[c]);
                      if (a > winPeak[c]) winPeak[c] = a;
                      const float t = std::max(tp_[c].process(in[c]), a);   // a true peak is never below the sample peak
                      if (t > winTp[c]) winTp[c] = t;
                      // VU ballistics on the squared signal
                      vu1_[c] += vuCoef_ * (x * x - vu1_[c]);
                      vu2_[c] += vuCoef_ * (vu1_[c] - vu2_[c]);
                  }
                  sLR_ += corrCoef_ * ((double)l * r - sLR_);
                  sLL_ += corrCoef_ * ((double)l * l - sLL_);
                  sRR_ += corrCoef_ * ((double)r * r - sRR_);
                  acc_ += sum;
                  if (++inBlock_ < blockLen_) return false;
                  endBlock();
                  return true;
              }

              // VU level of the louder channel in dBFS, AES17 convention (a sine reads its peak level).
              // Phase correlation -1 .. +1 (0 while either channel is silent).
              double correlation() const
              {
                  const double d = sLL_ * sRR_;
                  if (d < 1e-14) return 0.0;
                  return std::min(1.0, std::max(-1.0, sLR_ / std::sqrt(d)));
              }

              double vuDbfs() const { return gainToDb(std::sqrt(std::max(vu2_[0], vu2_[1]))) + 3.0103; }

              // Results (LUFS / LU / linear peaks), valid after each completed block.
              double momentary = kSilent, shortTerm = kSilent, integrated = kSilent;
              double momMax = kSilent, shortMax = kSilent;
              double lra = -1.0;
              float  tpMax = 0.0f, peakMax = 0.0f;
              double rms = kSilent;                    // dBFS
              // Per-channel maxima since the caller last cleared them (the caller resets these after reading).
              float  winPeak[2] = { 0.0f, 0.0f }, winTp[2] = { 0.0f, 0.0f };

              void clearWindow() { winPeak[0] = winPeak[1] = winTp[0] = winTp[1] = 0.0f; }
              void notePeaks()   // fold the window peaks into the maxima since reset
              {
                  peakMax = std::max(peakMax, std::max(winPeak[0], winPeak[1]));
                  tpMax = std::max(tpMax, std::max(winTp[0], winTp[1]));
              }

          private:
              void endBlock()
              {
                  blockE_[ring_] = acc_ / (double)blockLen_;
                  rawE_[ring_][0] = raw_[0] / (double)blockLen_;
                  rawE_[ring_][1] = raw_[1] / (double)blockLen_;
                  ring_ = (ring_ + 1) % kShortBlocks;
                  acc_ = 0.0; raw_[0] = raw_[1] = 0.0; inBlock_ = 0;
                  blocks_++;

                  auto meanOf = [&](int n) {
                      n = std::min(n, blocks_);
                      double e = 0.0;
                      for (int i = 1; i <= n; ++i) e += blockE_[(ring_ - i + kShortBlocks) % kShortBlocks];
                      return n ? e / n : 0.0;
                  };
                  const double eM = meanOf(kMomBlocks);
                  const double eS = meanOf(kShortBlocks);
                  momentary = energyToLufs(eM);
                  shortTerm = energyToLufs(eS);
                  if (blocks_ >= kMomBlocks)
                  {
                      integ_.add(eM);                     // one 400 ms gating block every 100 ms (75 % overlap)
                      momMax = std::max(momMax, momentary);
                  }
                  if (blocks_ >= kShortBlocks)
                  {
                      lra_.add(eS);
                      shortMax = std::max(shortMax, shortTerm);
                  }
                  integrated = integ_.integrated();
                  lra = lra_.range();

                  double r[2] = { 0.0, 0.0 };
                  int n = std::min(kRmsBlocks, blocks_);
                  for (int i = 1; i <= n; ++i)
                      for (int c = 0; c < 2; ++c) r[c] += rawE_[(ring_ - i + kShortBlocks) % kShortBlocks][c];
                  rms = n ? gainToDb(std::sqrt(std::max(r[0], r[1]) / n)) : kSilent;
              }

              double fs_ = 48000.0;
              int blockLen_ = 4800;
              KWeighting kw_[2];
              TruePeak tp_[2];
              GateHistogram integ_, lra_;
              double blockE_[kShortBlocks] = {};
              double rawE_[kShortBlocks][2] = {};
              int blocks_ = 0, ring_ = 0, inBlock_ = 0;
              double acc_ = 0.0, raw_[2] = { 0.0, 0.0 };
              double corrCoef_ = 0.0001, sLR_ = 0.0, sLL_ = 0.0, sRR_ = 0.0;
              double vuCoef_ = 0.001, vu1_[2] = { 0.0, 0.0 }, vu2_[2] = { 0.0, 0.0 };
          };

          } // namespace loud
          LMEOF
          mkdir -p "$(dirname "make_silver.py")"
          cat > "make_silver.py" <<'LMEOF'
          #!/usr/bin/env python3
          """Loudness Meter - brushed silver skin.

          Same design language as Sweep Filter and Comb Filter: a brushed-aluminium version of the SDK's UI kit
          (knobs, blue segment buttons), the gltchsqnz logo (about 1.5 cm) bottom right with the bold title ("Utility Meter") to its
          left, and the button names painted in black under the buttons. On top of the SDK's gen_ui.py output it
          adds the meter page:

            * two LED bar meters (L / R, or M / S in LUFS mode) with a dB scale and their values,
            * a VU-style needle meter (VU in dB / True Peak modes, LU relative to the target in LUFS mode),
            * a large precise readout with its caption and an OVER lamp for the true-peak limit,
            * a phase correlation meter (-1 .. +1),
            * a grid of readings: Integrated, Vs Target, Short-term, Momentary, maxima, LRA, PLR, peaks, RMS.

          The meters are film-strip images and labels bound to the plugin's read-only "reading" parameters, which
          the plugin writes about 30 (bars, needle) and 10 (numbers) times a second. All text drawn by the MPC uses
          its own Titillium Web; painted text (title, button names, scales) is pre-rendered Poppins Bold.

          The result goes to ./skins/, which build.py copies verbatim into "Plugin Skins/".

          Needs build/params.json first:   python tools/build.py "plugins/Loudness Meter" --target native
          Run from anywhere:               python "plugins/Loudness Meter/make_silver.py"

          Standard library only. Nothing here changes the SDK; the silver theme is registered inside this process.
          """

          import base64
          import math
          import os
          import shutil
          import struct
          import sys
          import zlib

          HERE = os.path.dirname(os.path.abspath(__file__))
          SDK = os.path.dirname(os.path.dirname(HERE))          # plugins/<Name>/ -> SDK root
          sys.path.insert(0, os.path.join(SDK, "tools"))

          import make_ui_kit as K   # noqa: E402
          import gen_ui             # noqa: E402

          ACCENT = "ff1d5fd6"       # the lit colour (knob arcs). Change it here.

          # Button colours (brushed blue).
          BTN_OFF = ((70, 120, 215, 255), (36, 78, 170, 255))     # top -> bottom, resting
          BTN_ON = ((90, 158, 255, 255), (40, 112, 238, 255))     # top -> bottom, selected
          BTN_EDGE_ON = (205, 228, 255, 255)
          BTN_EDGE_OFF = (16, 40, 92, 255)

          # Logo and text on the page.
          LOGO_PLATE = 128          # logo size in screen pixels: about 1.5 cm on the 7" MPC screens (~85 px/cm)
          LOGO_MARGIN = 26          # gap from the bottom-right corner of the screen
          TITLE_GAP = 24            # gap between the title and the logo
          TEXT_BLACK = (14, 15, 17)
          BLOCK_SHIFT = -20         # SETUP page: nudge the control block up a little to leave room for the logo band

          # Names painted under the segment buttons (choice -> text).
