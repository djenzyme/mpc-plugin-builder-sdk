              return e


          # --------------------------------------------------------------------------------------------
          # Images
          # --------------------------------------------------------------------------------------------
          def write_png_rgba(path, width, rows):
              def chunk(tag, data):
                  body = tag + data
                  return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)
              raw = b"".join(b"\0" + bytes(r) for r in rows)
              png = b"\x89PNG\r\n\x1a\n"
              png += chunk(b"IHDR", struct.pack(">IIBBBBB", width, len(rows), 8, 6, 0, 0, 0))
              png += chunk(b"IDAT", zlib.compress(raw, 9))
              png += chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)


          def canvas_rows(c):
              return [bytearray(r) for r in c.rows()]


          def seg_colour(db, lit):
              """LED colour for the segment that starts at `db`: blue, amber from -9 dB, red above 0 dB."""
              if db >= 0:
                  on, off = (255, 66, 58), (82, 30, 30)
              elif db >= -9:
                  on, off = (255, 186, 40), (78, 62, 26)
              else:
                  on, off = (70, 150, 255), (28, 44, 74)
              return on + (255,) if lit else off + (255,)


          def make_bar_strip(path):
              """BAR_FRAMES frames, frame k = k segments lit (k = 0: all dark). Built by copying rows."""
              lit_c = K.Canvas(BAR_W, BAR_H)
              off_c = K.Canvas(BAR_W, BAR_H)
              for s in range(BAR_SEGS):                       # s = 0 is the bottom segment (-60 .. -59 dB)
                  y = BAR_H - (s + 1) * SEG_PITCH + (SEG_PITCH - SEG_LIT) // 2
                  db = BAR_LO + s
                  K.rrect(lit_c, 2, y, BAR_W - 4, SEG_LIT, 1.0, seg_colour(db, True))
                  K.rrect(off_c, 2, y, BAR_W - 4, SEG_LIT, 1.0, seg_colour(db, False))
              lit, off = canvas_rows(lit_c), canvas_rows(off_c)
              rows = []
              for k in range(BAR_FRAMES):
                  cut = BAR_H - k * SEG_PITCH                  # rows below `cut` are lit
                  rows += [bytes(lit[y]) if y >= cut else bytes(off[y]) for y in range(BAR_H)]
              write_png_rgba(path, BAR_W, rows)


          def corr_colour(centre, lit):
              """Correlation segment colour: red when out of phase (< 0), blue when in phase."""
              if centre < 0:
                  on, off = (255, 66, 58), (74, 28, 28)
              else:
                  on, off = (70, 150, 255), (28, 44, 74)
              return (on if lit else off) + (255,)


          def make_corr_strip(path):
              """CORR_FRAMES frames for -1 .. +1: segments lit from the centre (0) out to the value, plus a white marker."""
              w, h = CORR_SEGS * CORR_PITCH, CORR_H
              rows = []
              for k in range(CORR_FRAMES):
                  v = -1.0 + 2.0 * k / (CORR_FRAMES - 1)
                  c = K.Canvas(w, h)
                  lo, hi = min(0.0, v), max(0.0, v)
                  for i in range(CORR_SEGS):
                      s0 = -1.0 + 2.0 * i / CORR_SEGS
                      s1 = s0 + 2.0 / CORR_SEGS
                      lit = s1 > lo + 1e-9 and s0 < hi - 1e-9
                      K.rrect(c, i * CORR_PITCH + (CORR_PITCH - CORR_LIT) / 2.0, 3, CORR_LIT, h - 6, 1.0,
                              corr_colour((s0 + s1) / 2.0, lit))
                  mx = (v + 1.0) / 2.0 * w
                  K.rrect(c, min(max(mx - 2.0, 0.0), w - 4.0), 0, 4, h, 1.5, (245, 248, 255, 255))
                  rows += c.rows()
              write_png_rgba(path, w, rows)


          def needle_fraction(v):
              lo, hi = 10 ** (-20 / 20.0), 10 ** (3 / 20.0)
              return min(1.0, max(0.0, (10 ** (v / 20.0) - lo) / (hi - lo)))


          def needle_angle(f):
              return math.radians(-NEEDLE_SWEEP + 2.0 * NEEDLE_SWEEP * f)


          def make_needle_strip(path):
              """NEEDLE_FRAMES transparent frames of the needle alone. Only the area the needle sweeps (NEEDLE_BOX) is
              drawn, at NEEDLE_SCALE of screen size (the MPC scales the frames up to the box)."""
              bx, by, bw, bh = NEEDLE_BOX
              s = NEEDLE_SCALE
              w, h = int(round(bw * s)), int(round(bh * s))
              px, py = (PIVOT[0] - bx) * s, (PIVOT[1] - by) * s
              tip, root = (ARC_R + 18) * s, (PIVOT[1] - (by + bh)) * s
              rows = []
              for k in range(NEEDLE_FRAMES):
                  a = needle_angle(k / float(NEEDLE_FRAMES - 1))
                  c = K.Canvas(w, h)
                  x0, y0 = px + root * math.sin(a), py - root * math.cos(a)
                  x1, y1 = px + tip * math.sin(a), py - tip * math.cos(a)
                  K.capsule(c, x0 + 1.5, y0 + 1.5, x1 + 1.5, y1 + 1.5, 2.6, (60, 40, 10, 50))       # soft shadow
                  K.capsule(c, x0, y0, x1, y1, 2.0, (20, 18, 16, 255))
                  rows += c.rows()
              write_png_rgba(path, w, rows)


          def make_vu_hood(path):
              w, h = VU[2] - 16, HOOD_H
              c = K.Canvas(w, h)
              K.rrect(c, 0, 0, w, h + 12, 10.0, K.vgrad(0, h, (46, 48, 54, 255), (16, 17, 20, 255)))
              K.rrect(c, 0, 0, w, 2, 1.0, (90, 94, 102, 255))
              write_png_rgba(path, w, c.rows())


          def make_vu_legend(path):
              """3 frames (Mode dB / True Peak / LUFS): VU, VU, LU on the cream face."""
              w, h = 80, 40
              rows = []
              for key in ("s30:VU", "s30:VU", "s30:LU"):
                  fr = [bytearray(w * 4) for _ in range(h)]
                  tw, th, tb = text_size(key)
                  blend_text(fr, key, (w - tw) // 2, (h - th) // 2, (40, 36, 30), alpha_rows=True)
                  rows += [bytes(r) for r in fr]
              write_png_rgba(path, w, rows)


          def make_over_lamp(path):
              w, h = 96, 30
              rows = []
              for lit in (False, True):
                  c = K.Canvas(w, h)
                  if lit:
                      K.rrect(c, 0, 0, w, h, 7.0, (255, 40, 40, 90))
                  K.rrect(c, 2, 2, w - 4, h - 4, 6.0, (220, 28, 28, 255) if lit else (66, 24, 24, 255))
                  K.rrect_outline(c, 2, 2, w - 4, h - 4, 6.0, 1.0, (255, 150, 150, 255) if lit else (110, 50, 50, 255))
                  fr = canvas_rows(c)
                  tw, th, tb = text_size("s17:OVER")
                  blend_text(fr, "s17:OVER", (w - tw) // 2, (h - th) // 2,
                             (255, 255, 255) if lit else (150, 90, 90), alpha_rows=False)
                  rows += [bytes(r) for r in fr]
              write_png_rgba(path, w, rows)


          # --------------------------------------------------------------------------------------------
          # Page background: brushed aluminium, 1280 x 628 (the tab area, drawn 1:1), logo, title, captions
          # --------------------------------------------------------------------------------------------
          def draw_logo():
              """The invader on a black plate (a canvas with room for the drop shadow), LOGO_PLATE px square.
              Cell geometry is measured from the supplied 512 px logo and scaled."""
              s = LOGO_PLATE / 512.0
              pad, size = 6, LOGO_PLATE
              c = K.Canvas(size + 2 * pad, size + 2 * pad)
              rad = size * 0.11
              K.rrect(c, pad, pad + 3, size, size, rad, (0, 0, 0, 110))
              K.rrect(c, pad, pad, size, size, rad, K.vgrad(pad, pad + size, (24, 25, 28, 255), (2, 2, 3, 255)))
              K.rrect_outline(c, pad, pad, size, size, rad, 1.0, (112, 116, 124, 255))
              for r, line in enumerate(LOGO):
                  for col, ch in enumerate(line):
                      if ch == "#":
                          K.rrect(c, pad + (85 + 43.57 * col) * s, pad + (99 + 43.0 * r) * s, 37 * s, 37 * s, 1.0,
                                  (248, 250, 253, 255))
              return c, pad


          def blend_canvas(rows, canvas, x0, y0):
              for y in range(canvas.h):
                  if not 0 <= y0 + y < len(rows):
                      continue
                  row = rows[y0 + y]
                  for x in range(canvas.w):
                      r, g, b, a = canvas.px[y * canvas.w + x]
                      if a <= 0.0:
                          continue
                      i = (x0 + x) * 4
                      row[i] = clamp8(row[i] + (r - row[i]) * a)
                      row[i + 1] = clamp8(row[i + 1] + (g - row[i + 1]) * a)
                      row[i + 2] = clamp8(row[i + 2] + (b - row[i + 2]) * a)


          def text_size(name):
              w, h, baseline, _ = TEXT_MASKS[name]
              return w, h, baseline


          def blend_text(rows, name, x0, y0, colour, alpha_rows=False):
              """Paint a pre-rendered mask. alpha_rows: the target is transparent, so write colour + alpha."""
              w, h, _baseline, packed = TEXT_MASKS[name]
              alpha = zlib.decompress(base64.b64decode(packed))
              for yy in range(h):
                  if not 0 <= y0 + yy < len(rows):
                      continue
                  row = rows[y0 + yy]
                  for xx in range(w):
                      a = alpha[yy * w + xx] / 255.0
                      if a <= 0.0:
                          continue
                      i = (x0 + xx) * 4
                      if alpha_rows:
                          row[i], row[i + 1], row[i + 2] = colour[0], colour[1], colour[2]
                          row[i + 3] = max(row[i + 3], clamp8(a * 255))
                      else:
                          for k in range(3):
                              row[i + k] = clamp8(row[i + k] + (colour[k] - row[i + k]) * a)


          def text_at(rows, key, cx, baseline_y, colour, align="centre"):
              w, _h, b = text_size(key)
              x = int(round(cx - w / 2.0)) if align == "centre" else (int(round(cx - w)) if align == "right" else int(cx))
              blend_text(rows, key, x, int(round(baseline_y)) - b, colour)


          def fill_rows(rows, x, y, w, h, colour):
              for yy in range(max(0, y), min(len(rows), y + h)):
                  row = rows[yy]
                  for xx in range(max(0, x), min(len(row) // 4, x + w)):
                      i = xx * 4
                      row[i], row[i + 1], row[i + 2] = colour[0], colour[1], colour[2]


          def panel(rows, box, fill, radius=12.0, bezel=True):
              """A recessed panel: dark bevel + shadow, then the face."""
              x, y, w, h = box
              c = K.Canvas(w + 8, h + 8)
              K.rrect(c, 3, 5, w, h, radius + 1, (0, 0, 0, 70))                 # shadow
              if bezel:
                  K.rrect(c, 4, 4, w, h, radius, K.vgrad(4, 4 + h, (96, 100, 108, 255), (236, 238, 242, 255)))
                  K.rrect(c, 6, 6, w - 4, h - 4, radius - 2, fill)
              else:
                  K.rrect(c, 4, 4, w, h, radius, fill)
              blend_canvas(rows, c, x - 4, y - 4)


          def brushed_rows(w, h, seed):
              base = K.parse_argb(SILVER_GREYS["bg"])
              amp = 7.0
              sheen = [7 * math.sin(x / 190.0 + 0.6) + 4 * math.sin(x / 53.0) + 5 * math.sin(x / 611.0) for x in range(w)]
              runs = w // 41 + 2
              rows = []
              for y in range(h):
                  fall = -((y / float(h)) - 0.5) * 8.0                  # slightly lighter at the top
                  row_n = (h01(y * 977 + seed) - 0.5) * 1.2 * amp
                  run_n = [(h01(y * 131 + k * 7919 + seed + 5) - 0.5) * 0.9 * amp for k in range(runs)]
                  row = bytearray(w * 4)
                  for x in range(w):
                      fine = (h01(x * 31 + y * 1009 + seed + 11) - 0.5) * 0.25 * amp
                      d = sheen[x] + fall + row_n + run_n[x // 41] + fine
                      i = x * 4
                      row[i] = clamp8(base[0] + d)
                      row[i + 1] = clamp8(base[1] + d)
                      row[i + 2] = clamp8(base[2] + d * 1.05)
                      row[i + 3] = 255
                  rows.append(row)
              return rows


          def caption_spots(page):
              """[(text key, centre x, baseline y)] for the names under every segmented choice switch."""
              spots = []
              pos = {i: (x, y) for i, x, y in slot_positions(page)}
              for i, ctl in enumerate(page.controls):
                  if ctl.widget == "empty" or not ctl.definition.startswith("radio"):
                      continue
                  x0, y0 = pos[i]
                  width, xs = gen_ui.SEGMENTS[len(ctl.param.choices)]
                  for choice, x in zip(ctl.param.choices, xs):
                      spots.append(("cap:" + CAPTIONS.get(choice, choice.upper()), x0 + x + width / 2.0, y0 + SEG_Y + 56))
              return spots


          def draw_logo_and_title(rows, w, h):
              logo, pad = draw_logo()
              plate_x = w - LOGO_MARGIN - LOGO_PLATE
              plate_y = h - LOGO_MARGIN - LOGO_PLATE
              blend_canvas(rows, logo, plate_x - pad, plate_y - pad)
              # title, to the left of the logo, its baseline level with the bottom of the invader artwork
              tw, th, tb = text_size("title")
              art_bottom = plate_y + int(round((99 + 43.0 * (len(LOGO) - 1) + 37) * LOGO_PLATE / 512.0))
              blend_text(rows, "title", plate_x - TITLE_GAP - tw, art_bottom - tb, TEXT_BLACK)


          def draw_captions(rows, page):
              for key, cx, baseline_y in caption_spots(page):
                  if key not in TEXT_MASKS:
                      print('make_silver: no pre-rendered text for "%s"; that button name is not drawn.' % key)
                      continue
                  text_at(rows, key, cx, baseline_y, TEXT_BLACK)


          def draw_bars_panel(rows):
              panel(rows, BARS, LCD + (255,))
              # scale: numbers between the bars, tick marks beside each bar
              cx = (BAR_XL + BAR_W + BAR_XR) / 2.0
              marks = (3, 0, -3, -6, -9, -12, -18, -24, -30, -40, -50, -60)
              for db in marks:
                  y = BAR_TOP + BAR_H - (db - BAR_LO) * SEG_PITCH
                  col = (255, 120, 110) if db > 0 else (170, 180, 196)
                  fill_rows(rows, BAR_XL + BAR_W + 3, y, 6, 1, col)
                  fill_rows(rows, BAR_XR - 9, y, 6, 1, col)
                  key = "s13:" + ("+3" if db == 3 else str(db))
                  text_at(rows, key, cx, y + 5, col)
              # dark wells behind the bars
              for x in (BAR_XL, BAR_XR):
                  fill_rows(rows, x - 1, BAR_TOP - 2, BAR_W + 2, BAR_H + 4, (8, 9, 12))


          def draw_vu_panel(rows):
              vx, vy, vw, vh = VU
              panel(rows, VU, (34, 36, 40, 255), 14.0)
              # cream face
              face = K.Canvas(vw - 16, vh - 16)
              fw, fh = face.w, face.h
              K.rrect(face, 0, 0, fw, fh, 9.0, K.vgrad(0, fh, (246, 236, 206, 255), (226, 212, 172, 255)))
              ox, oy = vx + 8, vy + 8                       # face origin in tab coordinates
              pxc, pyc = PIVOT[0] - 8, PIVOT[1] - 8         # pivot in face coordinates
              ink = (44, 38, 30, 255)
              red = (200, 36, 30, 255)

              def at(r, f):
                  a = needle_angle(f)
                  return pxc + r * math.sin(a), pyc - r * math.cos(a)

              # main arc (black up to 0, red band from 0 to +3)
              f0 = needle_fraction(0.0)
              K.arc(face, pxc, pyc, ARC_R - 1.2, ARC_R + 1.2, needle_angle(0.0), needle_angle(f0), ink, cap=False)
              K.arc(face, pxc, pyc, ARC_R - 1.2, ARC_R + 9.0, needle_angle(f0), needle_angle(1.0), red, cap=False)
              # ticks
              major = (-20, -10, -7, -5, -3, -2, -1, 0, 1, 2, 3)
              minor = (-15, -6, -4, -0.5, 0.5, 1.5, 2.5)
              for v in major + minor:
                  f = needle_fraction(v)
                  r1 = ARC_R + (14 if v in major else 8)
                  x0, y0 = at(ARC_R, f)
                  x1, y1 = at(r1, f)
                  K.capsule(face, x0, y0, x1, y1, 1.3 if v in major else 0.9, red if v > 0 else ink)
              rows_face = canvas_rows(face)
              # numbers
              for v in major:
                  f = needle_fraction(v)
                  x, y = at(ARC_R + 30, f)
                  key = "s17:" + str(abs(v))
                  w_, h_, b_ = text_size(key)
                  blend_text(rows_face, key, int(round(x - w_ / 2.0)), int(round(y - h_ / 2.0)),
                             (200, 36, 30) if v > 0 else (44, 38, 30))
              # - and + at the ends of the scale
              for sym, f, colour in (("s17:−", 0.0, (44, 38, 30)), ("s17:+", 1.0, (200, 36, 30))):
                  x, y = at(ARC_R - 22, f)
                  w_, h_, b_ = text_size(sym)
                  blend_text(rows_face, sym, int(round(x - w_ / 2.0)), int(round(y - h_ / 2.0)), colour)
              # paste the face (rounded corners via the canvas alpha)
              fc = K.Canvas(fw, fh)
              fc.px = []
              for r in rows_face:
                  for i in range(0, len(r), 4):
                      fc.px.append((float(r[i]), float(r[i + 1]), float(r[i + 2]), r[i + 3] / 255.0))
              blend_canvas(rows, fc, ox, oy)


          def draw_lcd_panels(rows):
              panel(rows, READ, LCD + (255,))
              panel(rows, CORR, LCD + (255,))
              # correlation scale: ticks and numbers under the bar
              cx, cy, cw_, _ = CORR
              w = CORR_SEGS * CORR_PITCH
              x0 = cx + (cw_ - w) // 2
              ybar = cy + 30
              fill_rows(rows, x0 - 2, ybar - 2, w + 4, CORR_H + 4, (8, 9, 12))
              for v, key in ((-1.0, "s13:-1"), (-0.5, "s13:-0.5"), (0.0, "s13:0"), (0.5, "s13:+0.5"), (1.0, "s13:+1")):
                  x = int(round(x0 + (v + 1.0) / 2.0 * w))
                  col = (255, 120, 110) if v < 0 else (170, 180, 196)
                  fill_rows(rows, x, ybar + CORR_H + 2, 1, 4, col)
                  text_at(rows, key, min(max(x, x0 + 8), x0 + w - 8), ybar + CORR_H + 18, col)


          def draw_stats_panel(rows):
              x, y, w, h = STATS
              panel(rows, STATS, K.vgrad(y, y + h, (214, 217, 222, 255), (196, 199, 205, 255)), 12.0)
              # light separators between the rows of the grid
              for r in range(1, 6):
                  yy = y + 8 + r * 52 - 2
                  fill_rows(rows, x + 20, yy, w - 40, 1, (160, 164, 172))
                  fill_rows(rows, x + 20, yy + 1, w - 40, 1, (232, 234, 238))
              fill_rows(rows, x + w // 2, y + 14, 1, h - 28, (160, 164, 172))
              fill_rows(rows, x + w // 2 + 1, y + 14, 1, h - 28, (232, 234, 238))


          def make_background(path, page, w=1280, h=628, seed=41):
              rows = brushed_rows(w, h, seed)
              if page.name == "METER":
                  draw_bars_panel(rows)
                  draw_vu_panel(rows)
                  draw_lcd_panels(rows)
                  draw_stats_panel(rows)
              draw_logo_and_title(rows, w, h)
              draw_captions(rows, page)
              write_png_rgba(path, w, rows)


          # --------------------------------------------------------------------------------------------
          def install_theme():
              gen_ui.tab_component = tab_component
              gen_ui.radio_component = radio_component
              gen_ui.qlink_rects = qlink_rects
              gen_ui.build_qlinks = build_qlinks
              K.GREYS.update(SILVER_GREYS)
              K.THEMES["silver"] = ACCENT
              K.knob_static = knob_static
              K.fader_cap = fader_cap
              K.render_button = render_button


          def main(argv):
              global PARAMS
              install_theme()
              params = os.path.join(HERE, "build", "params.json")
              ui = os.path.join(HERE, "ui.json")
              out = os.path.join(HERE, "skins")
              if not os.path.isfile(params):
                  print("make_silver: build/params.json is missing. Run first:\n"
                        '  python tools/build.py "plugins/Loudness Meter" --target native')
                  return 1
              if os.path.isdir(out):
                  shutil.rmtree(out)
              os.makedirs(out)
              PARAMS = gen_ui.ParamTable(gen_ui.load_params(params))
              pages = gen_ui.load_ui(ui, PARAMS)[0]
              for page in pages:
                  make_background(os.path.join(out, page.background), page)
              make_bar_strip(os.path.join(out, "lm_bar.png"))
              make_needle_strip(os.path.join(out, "lm_needle.png"))
              make_vu_hood(os.path.join(out, "lm_vu_hood.png"))
              make_vu_legend(os.path.join(out, "lm_vu_legend.png"))
              make_over_lamp(os.path.join(out, "lm_over.png"))
              make_corr_strip(os.path.join(out, "lm_corr.png"))
              gen_ui.generate(params, ui, out, assets_dir=out, quiet=False, kit_cache=None)
              print("make_silver: wrote %s (%d files)" % (out, len(os.listdir(out))))
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          LMEOF
      - name: First build (native) to list the parameters
        run: python tools/build.py "plugins/Loudness Meter" --target native
      - name: Draw the brushed silver skin and meters
        run: python "plugins/Loudness Meter/make_silver.py"
      - name: Build, validate, make MPC folder
        run: python tools/build.py "plugins/Loudness Meter"
      - name: Upload MPC plugin folder
        uses: actions/upload-artifact@v4
        with:
          name: Loudness-Meter-MPC
          path: plugins/Loudness Meter/build/*VST*
          if-no-files-found: error
