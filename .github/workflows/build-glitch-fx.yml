          using Bank = const char* const (*)[kLanes];          // points at a [kPatterns][kLanes] bank

          uint16_t bankMask(Bank bank, int pattern, int lane)
          {
              uint16_t m = 0;
              const char* s = bank[pattern][lane];
              for (int i = 0; i < kSteps && s[i]; ++i)
                  if (s[i] == 'x') m = (uint16_t)(m | (1u << i));
              return m;
          }
          uint16_t factoryMask(int pattern, int lane) { return bankMask(kFactory, pattern, lane); }

          // "LP" at 0, "BP" at 50, "HP" at 100, "LP>BP 40" in between (pos in 0..100).
          std::string morphText(float pos, const char* a, const char* b, const char* c)
          {
              char buf[32];
              if (pos <= 1.0f) return a;
              if (std::fabs(pos - 50.0f) <= 1.0f) return b;
              if (pos >= 99.0f) return c;
              if (pos < 50.0f) std::snprintf(buf, sizeof(buf), "%s>%s %d", a, b, (int)std::lround(pos * 2.0f));
              else std::snprintf(buf, sizeof(buf), "%s>%s %d", b, c, (int)std::lround((pos - 50.0f) * 2.0f));
              return buf;
          }

