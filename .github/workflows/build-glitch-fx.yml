          # --------------------------------------------------------------------------------------------
          # Brushed-metal noise (deterministic: same skin on every build)
          # --------------------------------------------------------------------------------------------
          def h01(n):
              """Integer hash -> 0..1."""
              n = (int(n) * 0x9E3779B1) & 0xFFFFFFFF
              n ^= n >> 15
              n = (n * 0x85EBCA77) & 0xFFFFFFFF
              n ^= n >> 13
              return (n & 0xFFFF) / 65535.0


          def streak(x, y, seed):
              """About -1.2 .. +1.2: long thin horizontal brush lines, broken into short runs."""
              row = h01(int(y) * 977 + seed)
              run = h01(int(y) * 131 + (int(x) // 41) * 7919 + seed + 5)
              fine = h01(int(x) * 31 + int(y) * 1009 + seed + 11)
              return (row - 0.5) * 1.2 + (run - 0.5) * 0.9 + (fine - 0.5) * 0.25


          def clamp8(v):
              return max(0, min(255, int(round(v))))


          def shade(c, d):
              return (clamp8(c[0] + d), clamp8(c[1] + d), clamp8(c[2] + d), c[3])


          def brushed(y0, y1, c0, c1, seed, amp=7.0):
              """Vertical gradient c0 -> c1 with horizontal brushing on top."""
              base = K.vgrad(y0, y1, c0, c1)
              return lambda px, py: shade(base(px, py), streak(px, py, seed) * amp)


          # --------------------------------------------------------------------------------------------
          # Drawing overrides (same geometry as the SDK kit, silver surfaces) - identical to the other plugins
          # --------------------------------------------------------------------------------------------
          def turned(cx, cy, radius, seed=3):
              """Turned-aluminium knob face: concentric brush lines and a two-lobed highlight."""
              light = -0.75 * math.pi

              def f(px, py):
                  dx, dy = px - cx, py - cy
                  rad = math.hypot(dx, dy)
                  lobes = math.cos(2.0 * (math.atan2(dy, dx) - light))
                  ring = h01(int(rad * 2.4) + seed * 101) - 0.5
                  fine = h01(int(px * 13) + int(py * 29) * 7 + seed) - 0.5
                  lum = 188 + 30 * lobes * (0.35 + 0.65 * min(1.0, rad / radius)) + ring * 16 + fine * 4
                  return (clamp8(lum), clamp8(lum + 1), clamp8(lum + 4), 255)   # a touch cool
              return f


          def knob_static(size, th):
              c = K.Canvas(size, size)
              cx = cy = size / 2.0
              r = size / 2.0
              ring_out, ring_in = r - 1.0, r - max(4.0, size * 0.1)
              body_r = ring_in - max(3.0, size * 0.07)
              K.arc(c, cx, cy, ring_in, ring_out, -K.SWEEP / 2.0, K.SWEEP / 2.0, th["track"])
              K.circle(c, cx, cy + 1.5, body_r + 1.0, K.with_alpha(th["outline"], 150))
              K.circle(c, cx, cy, body_r, K.light_rim(cx, cy, th["bodyLight"], th["bodyDark"]))
              face_r = body_r - max(1.5, size * 0.035)
              K.circle(c, cx, cy, face_r, turned(cx, cy, face_r))
              return c, (cx, cy, ring_in, ring_out, body_r, face_r)


          def fader_cap(g, th):
              w, h = g["cap_len"], g["cap_th"]
              c = K.Canvas(w + 2, h + 4)
              K.rrect(c, 1, 3, w, h, 5.0, K.with_alpha(th["outline"], 170))
              K.rrect(c, 1, 1, w, h, 5.0, brushed(1, 1 + h, th["thumbLight"], th["thumbDark"], 23, 6.0))
              K.rrect_outline(c, 1, 1, w, h, 5.0, 1.0, K.with_alpha(th["outline"], 180))
              cx = 1 + w / 2.0
              K.capsule(c, cx, 1 + h * 0.28, cx, 1 + h * 0.72, 2.0, th["accentDark"])
              K.capsule(c, cx, 1 + h * 0.28, cx, 1 + h * 0.72, 1.4, th["accent"])
              return c


          def render_button(th, on, w=120, h=44, led=True):
              """Blue brushed key: deep blue at rest, bright lit blue when selected."""
              c = K.Canvas(w, h)
              rad = 8.0
              K.rrect(c, 1, 3, w - 2, h - 4, rad, K.with_alpha(th["outline"], 150))
              top, bottom = BTN_ON if on else BTN_OFF
              K.rrect(c, 1, 1, w - 2, h - 4, rad, brushed(1, h - 3, top, bottom, 17, 6.0))
              K.rrect_outline(c, 1, 1, w - 2, h - 4, rad, 2.0 if on else 1.0, BTN_EDGE_ON if on else BTN_EDGE_OFF)
              if on and not led:
                  K.rrect(c, 10, h - 9, w - 20, 3, 1.5, BTN_EDGE_ON)
              if led:
                  lx, ly, lw, lh = 11, (h - 4) / 2.0 + 1 - 9, 6, 18
                  if on:
                      K.rrect(c, lx - 3, ly - 3, lw + 6, lh + 6, 6.0, th["accentGlow"])
                  K.rrect(c, lx, ly, lw, lh, 3.0, BTN_EDGE_ON if on else th["ledOff"])
              return c.rows(), w


          # --------------------------------------------------------------------------------------------
          def write_png_rgba(path, width, rows):
              def chunk(tag, data):
                  body = tag + data
                  return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)
              raw = b"".join(b"\0" + bytes(r) for r in rows)
              png = b"\x89PNG\r\n\x1a\n"
              png += chunk(b"IHDR", struct.pack(">IIBBBBB", width, len(rows), 8, 6, 0, 0, 0))
              png += chunk(b"IDAT", zlib.compress(raw, 9))
              png += chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)



          # --------------------------------------------------------------------------------------------
          # Page background: brushed aluminium, 1280 x 628 (the tab area, drawn 1:1), logo, title, captions
          # --------------------------------------------------------------------------------------------
          def draw_logo():
              """The invader on a black plate (a canvas with room for the drop shadow), LOGO_PLATE px square.
              Cell geometry is measured from the supplied 512 px logo and scaled."""
              s = LOGO_PLATE / 512.0
              pad, size = 6, LOGO_PLATE
              c = K.Canvas(size + 2 * pad, size + 2 * pad)
              rad = size * 0.11
              K.rrect(c, pad, pad + 3, size, size, rad, (0, 0, 0, 110))
              K.rrect(c, pad, pad, size, size, rad, K.vgrad(pad, pad + size, (24, 25, 28, 255), (2, 2, 3, 255)))
              K.rrect_outline(c, pad, pad, size, size, rad, 1.0, (112, 116, 124, 255))
              for r, line in enumerate(LOGO):
                  for col, ch in enumerate(line):
                      if ch == "#":
                          K.rrect(c, pad + (85 + 43.57 * col) * s, pad + (99 + 43.0 * r) * s, 37 * s, 37 * s, 1.0,
                                  (248, 250, 253, 255))
              return c, pad


          def blend_canvas(rows, canvas, x0, y0):
              for y in range(canvas.h):
                  if not 0 <= y0 + y < len(rows):
                      continue
                  row = rows[y0 + y]
                  for x in range(canvas.w):
                      r, g, b, a = canvas.px[y * canvas.w + x]
                      if a <= 0.0:
                          continue
                      i = (x0 + x) * 4
                      row[i] = clamp8(row[i] + (r - row[i]) * a)
                      row[i + 1] = clamp8(row[i + 1] + (g - row[i + 1]) * a)
                      row[i + 2] = clamp8(row[i + 2] + (b - row[i + 2]) * a)


          def text_size(name):
              w, h, baseline, _ = TEXT_MASKS[name]
              return w, h, baseline


          def blend_text(rows, name, x0, y0, colour, alpha_rows=False):
              """Paint a pre-rendered mask. alpha_rows: the target is transparent, so write colour + alpha."""
              w, h, _baseline, packed = TEXT_MASKS[name]
              alpha = zlib.decompress(base64.b64decode(packed))
              for yy in range(h):
                  if not 0 <= y0 + yy < len(rows):
                      continue
                  row = rows[y0 + yy]
                  for xx in range(w):
                      a = alpha[yy * w + xx] / 255.0
                      if a <= 0.0:
                          continue
                      i = (x0 + xx) * 4
                      if alpha_rows:
                          row[i], row[i + 1], row[i + 2] = colour[0], colour[1], colour[2]
                          row[i + 3] = max(row[i + 3], clamp8(a * 255))
                      else:
                          for k in range(3):
                              row[i + k] = clamp8(row[i + k] + (colour[k] - row[i + k]) * a)


          def text_at(rows, key, cx, baseline_y, colour, align="centre"):
              w, _h, b = text_size(key)
              x = int(round(cx - w / 2.0)) if align == "centre" else (int(round(cx - w)) if align == "right" else int(cx))
              blend_text(rows, key, x, int(round(baseline_y)) - b, colour)


          def fill_rows(rows, x, y, w, h, colour):
              for yy in range(max(0, y), min(len(rows), y + h)):
                  row = rows[yy]
                  for xx in range(max(0, x), min(len(row) // 4, x + w)):
                      i = xx * 4
                      row[i], row[i + 1], row[i + 2] = colour[0], colour[1], colour[2]


          def panel(rows, box, fill, radius=12.0, bezel=True):
              """A recessed panel: dark bevel + shadow, then the face."""
              x, y, w, h = box
              c = K.Canvas(w + 8, h + 8)
              K.rrect(c, 3, 5, w, h, radius + 1, (0, 0, 0, 70))                 # shadow
              if bezel:
                  K.rrect(c, 4, 4, w, h, radius, K.vgrad(4, 4 + h, (96, 100, 108, 255), (236, 238, 242, 255)))
                  K.rrect(c, 6, 6, w - 4, h - 4, radius - 2, fill)
              else:
                  K.rrect(c, 4, 4, w, h, radius, fill)
              blend_canvas(rows, c, x - 4, y - 4)


          def brushed_rows(w, h, seed):
              base = K.parse_argb(SILVER_GREYS["bg"])
              amp = 7.0
              sheen = [7 * math.sin(x / 190.0 + 0.6) + 4 * math.sin(x / 53.0) + 5 * math.sin(x / 611.0) for x in range(w)]
              runs = w // 41 + 2
              rows = []
              for y in range(h):
                  fall = -((y / float(h)) - 0.5) * 8.0                  # slightly lighter at the top
                  row_n = (h01(y * 977 + seed) - 0.5) * 1.2 * amp
                  run_n = [(h01(y * 131 + k * 7919 + seed + 5) - 0.5) * 0.9 * amp for k in range(runs)]
                  row = bytearray(w * 4)
                  for x in range(w):
                      fine = (h01(x * 31 + y * 1009 + seed + 11) - 0.5) * 0.25 * amp
                      d = sheen[x] + fall + row_n + run_n[x // 41] + fine
                      i = x * 4
                      row[i] = clamp8(base[0] + d)
                      row[i + 1] = clamp8(base[1] + d)
                      row[i + 2] = clamp8(base[2] + d * 1.05)
                      row[i + 3] = 255
                  rows.append(row)
              return rows


          def draw_logo_and_title(rows, w, h):
              logo, pad = draw_logo()
              plate_x = w - LOGO_MARGIN - LOGO_PLATE
              plate_y = h - LOGO_MARGIN - LOGO_PLATE
              blend_canvas(rows, logo, plate_x - pad, plate_y - pad)
              # title, to the left of the logo, its baseline level with the bottom of the invader artwork
              tw, th, tb = text_size("title")
              art_bottom = plate_y + int(round((99 + 43.0 * (len(LOGO) - 1) + 37) * LOGO_PLATE / 512.0))
              blend_text(rows, "title", plate_x - TITLE_GAP - tw, art_bottom - tb, TEXT_BLACK)



          # --------------------------------------------------------------------------------------------
          # Control layout
          # --------------------------------------------------------------------------------------------
          GRID_GAP = gen_ui.SLOT_X[1] - gen_ui.SLOT_X[0] - gen_ui.SLOT_W      # the grid's normal gap (42 px)
          SEG_Y = 46          # top of the segment buttons inside their slot (the SDK uses 54); leaves room for the names below
          PARAMS = None       # gen_ui.ParamTable, set in main()


          def handle(name):
              return PARAMS.lookup(name, "make_silver").handle


          def param_index(name):
              return PARAMS.lookup(name, "make_silver").index


          SLOTS = 8
          CELL0, CELL_SLOT2 = 40, 169       # slot 1 cells start at parameter 40, slots 2..8 at 169 (see GlitchFX.cpp)


          def cell_handle(slot, lane, step):
              base = CELL0 if slot == 0 else CELL_SLOT2 + (slot - 1) * 128
              return "Parameter %d" % (base + lane * STEPS + step)


          def lane_component_name(lane, slot):
              return "lane%d slot%d" % (lane + 1, slot + 1)


          def lane_component(lane, slot):
              """One lane row of one pattern slot: 16 step buttons, positioned relative to the row."""
              children = []
              for s in range(STEPS):
                  children.append(gen_ui.entry("%s %d" % (LANES[lane][1], s + 1), "Button",
                                               gen_ui.button_data("sfx_cell%d_on.png" % lane, "sfx_cell%d_off.png" % lane, 1, 1),
                                               rect(cell_x(s) - GX0, 0, CELL_W, CELL_H), "No", "Show", "Always",
                                               remap=[("Data", cell_handle(slot, lane, s))]))
              return gen_ui.component_definition([], children, "00000000")


          _orig_build_tui = gen_ui.build_tui


          def get_key(o, key):
              for k, v in o:
                  if k == key:
                      return v
              raise KeyError(key)


          def build_tui(*args, **kwargs):
              """As gen_ui, plus the 64 lane-row components (8 lanes x 8 pattern slots) the pages instantiate."""
              tui = _orig_build_tui(*args, **kwargs)
              defs = get_key(get_key(get_key(tui, "pageData"), "componentDefinitions"), "localComponentDefinitions")
              for slot in range(SLOTS):
                  for lane in range(len(LANES)):
                      defs.append(gen_ui.obj(("key", lane_component_name(lane, slot)), ("value", lane_component(lane, slot))))
              return tui


          _orig_dump_json = gen_ui.dump_json


          def dump_compact(value, indent=0):
              """gen_ui.dump_json without the whitespace (keeps the duplicate keys): the file is large."""
              if isinstance(value, gen_ui.Obj):
                  return "{" + ",".join(gen_ui.json.dumps(str(k)) + ":" + dump_compact(v) for k, v in value) + "}"
              if isinstance(value, dict):
                  return dump_compact(gen_ui.Obj(value.items()))
              if isinstance(value, (list, tuple)):
                  return "[" + ",".join(dump_compact(v) for v in value) + "]"
              return _orig_dump_json(value)


          def slot_positions(page):
              """[(control index, x, y)] for the knob / fader / switch slots drawn on a page."""
              idx = [i for i, c in enumerate(page.controls) if c.widget != "empty"]
              if page.name == "GRID":
                  return [(i,) + LENGTH_SLOT for i in idx if page.controls[i].param.name == "Length"]
              if page.name in FX_PAGES:
                  return [(i, KNOB_X0 + (i % 4) * KNOB_PITCH, BLOCK_Y[i // 4]) for i in idx]
              out = []                                    # MAIN: centred rows of up to four (row = control index // 4)
              for r in range(4):
                  row = [i for i in idx if i // 4 == r]
                  if not row:
                      continue
                  total = len(row) * gen_ui.SLOT_W + (len(row) - 1) * GRID_GAP
                  x0 = (gen_ui.SCREEN_W - total) // 2
                  for j, i in enumerate(row):
                      out.append((i, x0 + j * (gen_ui.SLOT_W + GRID_GAP), MAIN_Y[r]))
              return out


          def radio_component(style, overlay_name, n):
              """gen_ui.radio_component with the segment buttons raised to SEG_Y so their names fit inside the slot."""
              width, xs = gen_ui.SEGMENTS[n]
              children = [gen_ui.focus_child(style),
                          gen_ui.entry("name", "Label", gen_ui.label_data("Name", style["muted"], 24.0), "15 8 248 34",
                                       "No", "Show", "Always")]
              for i, x in enumerate(xs):
                  children.append(gen_ui.entry("seg %d" % i, "Button",
                                               gen_ui.button_data("seg%d_on.png" % n, "seg%d_off.png" % n, i, n),
                                               "%d %d %d 40" % (x, SEG_Y, width), "No", "Show", "Always"))
              return gen_ui.component_definition(gen_ui.control_actions(overlay_name, double_click=False), children,
                                                 "00000000")


          def rect(x, y, w, h):
              return "%d %d %d %d" % (x, y, w, h)


          def filmstrip(name, image, frames, hname, bounds):
              data = gen_ui.obj(("version", 2), ("imageType", "FilmStrip"), ("colour", "0"), ("image", image),
                                ("numFrames", frames), ("handleName", hname))
              return gen_ui.entry(name, "Image", data, bounds, "No", "Show", "Always")


          def led_entries(y):
              """The two LED strips over a lane: dim LEDs inside the pattern length, the bright running step on top."""
              b = rect(GX0, y, GRID_W, LED_H)
              return [filmstrip("leds length", "sfx_len.png", STEPS, handle("Length"), b),
                      filmstrip("leds playhead", "sfx_head.png", STEPS + 1, handle("Playhead"), b)]


          def cell_entries(lane, y):
              """The lane row of all 8 slots at the same place; only the slot chosen by Pattern is visible."""
              pat = handle("Pattern")
              return [gen_ui.entry("lane %d slot %d" % (lane + 1, slot + 1), lane_component_name(lane, slot),
                                   gen_ui.obj(("version", 1), ("handleName", "Data")), rect(GX0, y, GRID_W, CELL_H),
                                   "No", "Show", "Always", remap=[("Data", pat)],
                                   invalidating=["IndexedEnabling/%d/%d/%s" % (slot, SLOTS, pat)])
                      for slot in range(SLOTS)]


          def pattern_entries():
              e = []
              for i in range(8):
                  e.append(gen_ui.entry("pattern %d" % (i + 1), "Button",
                                        gen_ui.button_data("sfx_pat%d_on.png" % i, "sfx_pat%d_off.png" % i, i, 8),
                                        rect(PAT_X0 + i * (PAT_W + PAT_GAP), PAT_Y, PAT_W, PAT_H), "No", "Show", "Always",
                                        remap=[("Data", handle("Pattern"))]))
              return e


          def tab_component(page, style):
              """The page's slots (no on-button caption labels: the names are painted in the background), plus the
              step grid, LEDs and pattern keys."""
              children = []
              for i, x, y in slot_positions(page):
                  ctl = page.controls[i]
                  children.append(gen_ui.entry(ctl.param.name, ctl.definition,
                                               gen_ui.obj(("version", 1), ("handleName", "Data")),
                                               rect(x, y, gen_ui.SLOT_W, gen_ui.SLOT_H),
                                               "Yes", "Hide", "Always", remap=[("Data", ctl.param.handle)]))
              if page.name == "GRID":
                  children += led_entries(GRID_LED_Y)
                  for lane in range(len(LANES)):
                      children += cell_entries(lane, ROW_Y0 + lane * ROW_PITCH)
                  children += pattern_entries()
              elif page.name in FX_PAGES:
                  for b, lane in enumerate(FX_PAGES[page.name]):
                      children += led_entries(BLOCK_Y[b] + FX_LED_DY)
                      children += cell_entries(lane, BLOCK_Y[b] + FX_CELL_DY)
              return gen_ui.component_definition([], children, style["background"], bg_image=page.background)


          def qlink_rows(page):
              """Parameter names per Q-Link row (top row first) for a page."""
              if page.name == "GRID":
                  return [["Pattern", "Length", "Step Rate", "Swing"], ["Mix", "Level"]]
              rows = [[], [], [], []]
              for i, c in enumerate(page.controls):
                  if c.param is not None:
                      rows[i // 4].append(c.param.name)
              return [r for r in rows if r]


          def qlink_rects(page, groups="rows"):
              pad = gen_ui.QLINK_PAD
              if page.name == "GRID":
                  x2 = LENGTH_SLOT[0] + gen_ui.SLOT_W + pad
                  return [rect(PAT_X0 - pad, LENGTH_SLOT[1] - pad, x2 - (PAT_X0 - pad), gen_ui.SLOT_H + 2 * pad)]
              rects = []
              pos = slot_positions(page)
              for y in sorted({p[2] for p in pos}):
                  xs = [p[1] for p in pos if p[2] == y]
                  x, x2 = min(xs) - pad, max(xs) + gen_ui.SLOT_W + pad
                  rects.append(rect(max(x, 2), y - pad, min(x2, gen_ui.SCREEN_W - 2) - max(x, 2), gen_ui.SLOT_H + 2 * pad))
              return rects


          # Program (Track) Q-Link mode, by knob number: 13-16 top row ... 1-4 bottom row
          PROGRAM_QLINKS = {
              13: "Pattern", 14: "Length", 15: "Step Rate", 16: "Swing",
              9: "Mix", 10: "Level", 11: "Cutoff", 12: "Filt Sweep",
              5: "Stut Pitch", 6: "Gate Duty", 7: "Crush Bits", 8: "Drive",
              1: "Ring Freq", 2: "Delay Fdbk", 3: "Delay Depth", 4: "Verb Depth",
          }


          def build_qlinks(pages, params, groups="rows"):
              entries = []
              for ti, page in enumerate(pages):
                  qmap = {}
                  for r, row in enumerate(qlink_rows(page)):
                      for c, name in enumerate(row):
                          qmap[13 + c - 4 * r] = param_index(name)
                  entries.append(gen_ui.obj(("Tab", ti + 1), ("SubTab", 1), ("Bank Direction", "RowTopDown"),
                                            ("Q-Links", gen_ui.Obj(("Q-Link %d" % q, qmap.get(q, -1)) for q in range(1, 17)))))
              program = gen_ui.Obj(("Q-Link %d" % q, param_index(PROGRAM_QLINKS[q])) for q in range(1, 17))
              return gen_ui.obj(("version", 4),
                                ("info", gen_ui.obj(("version", 1), ("type", "CompleteDescription"))),
                                ("Screen Mode Q-Links", gen_ui.obj(("version", 4), ("map", entries))),
                                ("Program Mode Q-Links", program))


          # --------------------------------------------------------------------------------------------
          # Images: step cells, pattern keys, LED strips
          # --------------------------------------------------------------------------------------------
          def mixc(a, b, t):
              return tuple(clamp8(a[i] + (b[i] - a[i]) * t) for i in range(3))


          def render_cell(col, on):
              """A pad of the touch matrix (1.3.2): sunken into the ribbon channel; lit softly in the lane colour."""
              w, h = CELL_W, CELL_H
              c = K.Canvas(w, h)
              rad = 5.0
              x0, y0, cw, ch = 1, 1, w - 2, h - 2
              if on:
                  # lane colour at about 60 %, a little brighter in the middle (light from under the surface)
                  edge_col = mixc(col, (16, 17, 21), 0.55)
                  mid_col = mixc(col, (16, 17, 21), 0.22)
                  cx, cy = x0 + cw / 2.0, y0 + ch / 2.0 + 2
                  def glow(px, py):
                      d = min(1.0, math.hypot((px - cx) / (cw * 0.62), (py - cy) / (ch * 0.75)))
                      t = d * d
                      return tuple(int(mid_col[i] + (edge_col[i] - mid_col[i]) * t) for i in range(3)) + (255,)
                  K.rrect(c, x0, y0, cw, ch, rad, glow)
              else:
                  top = mixc(col, (22, 23, 28), 0.90)
                  bottom = mixc(col, (40, 42, 48), 0.86)
                  K.rrect(c, x0, y0, cw, ch, rad, K.vgrad(y0, y0 + ch, top + (255,), bottom + (255,)))
              # sunken: inner shadow along the top and left, a faint lit lip along the bottom
              K.rrect(c, x0, y0, cw, 7, rad, K.vgrad(y0, y0 + 7, (0, 0, 0, 120 if on else 150), (0, 0, 0, 0)))
              K.rrect(c, x0, y0, 4, ch, rad, (0, 0, 0, 40))
              K.rrect(c, x0 + 4, y0 + ch - 2, cw - 8, 1.5, 0.75,
                      (mixc(col, (255, 255, 255), 0.35) + (70,)) if on else (255, 255, 255, 22))
              K.rrect_outline(c, x0, y0, cw, ch, rad, 1.0, (8, 9, 12, 200))
              return c


          def render_pattern_key(n, on):
              """Pattern key n (0-based): a brushed blue key with its number."""
              w, h = PAT_W, PAT_H
              c = K.Canvas(w, h)
              rad = 8.0
              K.rrect(c, 1, 3, w - 2, h - 4, rad, (37, 39, 43, 150))
              top, bottom = BTN_ON if on else BTN_OFF
              K.rrect(c, 1, 1, w - 2, h - 4, rad, brushed(1, h - 3, top, bottom, 17, 6.0))
              K.rrect_outline(c, 1, 1, w - 2, h - 4, rad, 2.0 if on else 1.0, BTN_EDGE_ON if on else BTN_EDGE_OFF)
              rows = [bytearray(r) for r in c.rows()]
              _w, th_, _b = text_size("d22:%d" % (n + 1))
              text_at(rows, "d22:%d" % (n + 1), w / 2.0, (h - 4) / 2.0 + th_ / 2.0 + 1,
                      (255, 255, 255) if on else (196, 214, 244))
              return rows


          def make_led_strip(path, frames, lit):
              """frames x (GRID_W x LED_H); lit(frame, step) -> RGBA or None."""
              c = K.Canvas(GRID_W, LED_H * frames)
              for f in range(frames):
                  for s in range(STEPS):
                      col = lit(f, s)
                      if col is None:
                          continue
                      x = cell_x(s) - GX0 + 10
                      if col[3] == 255 and col[0] > 100:      # the running step gets a glow
                          K.rrect(c, x - 3, f * LED_H, CELL_W - 14, LED_H, 4.0, (90, 158, 255, 80))
                      K.rrect(c, x, f * LED_H + 2, CELL_W - 20, LED_H - 4, 2.5, col)
              write_png_rgba(path, GRID_W, c.rows())


          def make_images(out):
              for lane, (_name, _prefix, col) in enumerate(LANES):
                  for on in (True, False):
                      c = render_cell(col, on)
                      write_png_rgba(os.path.join(out, "sfx_cell%d_%s.png" % (lane, "on" if on else "off")), c.w, c.rows())
              for n in range(8):
                  for on in (True, False):
                      write_png_rgba(os.path.join(out, "sfx_pat%d_%s.png" % (n, "on" if on else "off")), PAT_W,
                                     render_pattern_key(n, on))
              # Length: frame k = length k + 1 (dim LEDs inside the pattern, brighter on the beats)
              make_led_strip(os.path.join(out, "sfx_len.png"), STEPS,
                             lambda f, s: ((104, 112, 128, 255) if s % 4 == 0 else (80, 86, 100, 255)) if s <= f else None)
              # Playhead: frame 0 = stopped, frame k = step k lit
              make_led_strip(os.path.join(out, "sfx_head.png"), STEPS + 1,
                             lambda f, s: (150, 205, 255, 255) if f >= 1 and s == f - 1 else None)


          # --------------------------------------------------------------------------------------------
          # Page backgrounds: brushed aluminium, 1280 x 628 (the tab area, drawn 1:1)
          # --------------------------------------------------------------------------------------------
          def light_panel(rows, box):
              x, y, w, h = box
              panel(rows, box, K.vgrad(y, y + h, (214, 217, 222, 255), (196, 199, 205, 255)), 12.0)


          def led_well(rows, y):
              c = K.Canvas(GRID_W + 12, LED_H + 8)
              K.rrect(c, 0, 0, GRID_W + 12, LED_H + 8, 5.0, (21, 24, 30, 255))
              blend_canvas(rows, c, GX0 - 6, y - 4)


          def ribbon_channel(rows, y, inner_h=CELL_H):
              """1.3.2: the recessed well the pads sit in (y = top of the first pads, inner_h = height of the pads)."""
              pad = 5
              x, w, h = GX0 - pad, GRID_W + 2 * pad, inner_h + 2 * pad
              c = K.Canvas(w + 2, h + 2)
              K.rrect(c, 1, 2, w, h, 8.0, (255, 255, 255, 120))                        # lit lower rim of the cut-out
              K.rrect(c, 1, 0, w, h, 8.0, K.vgrad(0, h, (10, 11, 14, 255), (30, 32, 38, 255)))
              K.rrect(c, 1, 0, w, 6, 8.0, K.vgrad(0, 6, (0, 0, 0, 140), (0, 0, 0, 0)))    # shadow under the top lip
              blend_canvas(rows, c, x - 1, y - pad)


          def ink_rows(key):
              """First and last row of a text mask that has ink, relative to its baseline."""
              w, h, b, packed = TEXT_MASKS[key]
              alpha = zlib.decompress(base64.b64decode(packed))
              inked = [yy for yy in range(h) if max(alpha[yy * w:(yy + 1) * w]) > 40]
              return inked[0] - b, inked[-1] + 1 - b


          def lane_label(rows, lane, y, cy=None):
              """Colour bar and the lane name, left of a row of cells whose top is y, centred on cy
              (default: the middle of the cells, which is also the middle of the sunken channel)."""
              name, _prefix, col = LANES[lane]
              if cy is None:
                  cy = y + CELL_H / 2.0
              bar_h = CELL_H - 12
              c = K.Canvas(10, bar_h + 2)
              K.rrect(c, 1, 1, 8, bar_h, 3.0, col + (255,))
              K.rrect_outline(c, 1, 1, 8, bar_h, 3.0, 1.0, mixc(col, (10, 10, 12), 0.55) + (255,))
              blend_canvas(rows, c, LANE_X, int(round(cy - bar_h / 2.0)) - 1)
              top, bottom = ink_rows("cap:" + name)
              text_at(rows, "cap:" + name, LANE_X + 18, cy - (top + bottom) / 2.0, TEXT_BLACK, align="left")


          def step_numbers(rows, baseline):
              for s in range(STEPS):
                  text_at(rows, "s13:%d" % (s + 1), cell_x(s) + CELL_W / 2.0, baseline,
                          TEXT_BLACK if s % 4 == 0 else INK_MUTED)


          def caption_spots(page):
              """[(text key, centre x, baseline y)] for the names under every segmented choice switch."""
              spots = []
              pos = {i: (x, y) for i, x, y in slot_positions(page)}
              for i, ctl in enumerate(page.controls):
                  if i not in pos or not ctl.definition.startswith("radio"):
                      continue
                  x0, y0 = pos[i]
                  width, xs = gen_ui.SEGMENTS[len(ctl.param.choices)]
                  for choice, x in zip(ctl.param.choices, xs):
                      spots.append(("cap:" + CAPTIONS.get(choice, choice.upper()), x0 + x + width / 2.0, y0 + SEG_Y + 56))
              return spots


          def draw_captions(rows, page):
              for key, cx, baseline_y in caption_spots(page):
                  if key not in TEXT_MASKS:
                      print('make_silver: no pre-rendered text for "%s"; that button name is not drawn.' % key)
                      continue
                  text_at(rows, key, cx, baseline_y, TEXT_BLACK)


          def make_background(path, page, w=1280, h=628, seed=41):
              rows = brushed_rows(w, h, seed)
              if page.name == "GRID":
                  light_panel(rows, GRID_PANEL)
                  step_numbers(rows, NUM_BASE)
                  led_well(rows, GRID_LED_Y)
                  ribbon_channel(rows, ROW_Y0, (len(LANES) - 1) * ROW_PITCH + CELL_H)
                  for lane in range(len(LANES)):
                      lane_label(rows, lane, ROW_Y0 + lane * ROW_PITCH)
                  keys_w = 8 * PAT_W + 7 * PAT_GAP
                  text_at(rows, "cap:PATTERN", PAT_X0 + keys_w / 2.0, PAT_Y + PAT_H + 26, TEXT_BLACK)
              elif page.name in FX_PAGES:
                  for b, lane in enumerate(FX_PAGES[page.name]):
                      y = BLOCK_Y[b]
                      light_panel(rows, (10, y + FX_LED_DY - 10, 1260, FX_CELL_DY - FX_LED_DY + CELL_H + 18))
                      led_well(rows, y + FX_LED_DY)
                      ribbon_channel(rows, y + FX_CELL_DY)
                      lane_label(rows, lane, y + FX_CELL_DY)            # centred on the pads / sunken channel
              draw_logo_and_title(rows, w, h)
              draw_captions(rows, page)
              write_png_rgba(path, w, rows)


          # --------------------------------------------------------------------------------------------
          # The double-tap / Enter overlays (KnobOverlay, MenuOverlay) are full-screen components whose background
          # gen_ui sets to the page colour; on the MPC that made them near-white. Keep them on the SDK's dark colour.
          OVERLAY_BG = "ff1e1d1e"


          def install_theme():
              _overlay_component = gen_ui.overlay_component
              gen_ui.overlay_component = lambda type_name, data, _bg: _overlay_component(type_name, data, OVERLAY_BG)
              gen_ui.tab_component = tab_component
              gen_ui.radio_component = radio_component
              gen_ui.qlink_rects = qlink_rects
              gen_ui.build_qlinks = build_qlinks
              gen_ui.build_tui = build_tui
              gen_ui.dump_json = dump_compact
              K.GREYS.update(SILVER_GREYS)
              K.THEMES["silver"] = ACCENT
              K.knob_static = knob_static
              K.fader_cap = fader_cap
              K.render_button = render_button


          def main(argv):
              global PARAMS
              install_theme()
              params = os.path.join(HERE, "build", "params.json")
              ui = os.path.join(HERE, "ui.json")
              out = os.path.join(HERE, "skins")
              if not os.path.isfile(params):
                  print("make_silver: build/params.json is missing. Run first:\n"
                        '  python tools/build.py "plugins/Glitch FX" --target native')
                  return 1
              if os.path.isdir(out):
                  shutil.rmtree(out)
              os.makedirs(out)
              PARAMS = gen_ui.ParamTable(gen_ui.load_params(params))
              pages = gen_ui.load_ui(ui, PARAMS)[0]
              for page in pages:
                  make_background(os.path.join(out, page.background), page)
              make_images(out)
              gen_ui.generate(params, ui, out, assets_dir=out, quiet=False, kit_cache=None)
              print("make_silver: wrote %s (%d files)" % (out, len(os.listdir(out))))
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          GLITCHEOF
      - name: First build (native) to list the parameters
        run: python tools/build.py "plugins/Glitch FX" --target native
      - name: Draw the brushed silver skin
        run: python "plugins/Glitch FX/make_silver.py"
      - name: Build, validate, make MPC folder
        run: python tools/build.py "plugins/Glitch FX"
      - name: Upload MPC plugin folder
        uses: actions/upload-artifact@v4
        with:
          name: Glitch-FX-MPC
          path: plugins/Glitch FX/build/*VST*
          if-no-files-found: error
