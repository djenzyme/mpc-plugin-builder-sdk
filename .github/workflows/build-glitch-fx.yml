name: Build Glitch FX

# One-file setup: this workflow writes the whole Glitch FX project (code, UI layout and the brushed
# silver skin generator, which also paints the step grid, logo, title and button names) into
# plugins/Glitch FX/ on the build server, then builds and validates it.
# To change the plugin later, edit the file contents below.

on:
  push:
  workflow_dispatch:   # lets you press "Run workflow" from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write plugin files
        run: |
          set -e
          mkdir -p "plugins/Glitch FX"
          cd "plugins/Glitch FX"
          mkdir -p "$(dirname "plugin.json")"
          cat > "plugin.json" <<'GLITCHEOF'
          {
            "name": "Glitch FX",
            "manufacturer": "gltchsqnz",
            "version": "1.3.3",
            "format": "vst2",
            "kind": "effect",
            "uid": "GFJg",
            "numInputs": 2,
            "numOutputs": 2,
            "category": "Effect",
            "shortName": "Glitch FX",
            "knobs": [
              {
                "parameter": 1,
                "label": "Pattern"
              },
              {
                "parameter": 3,
                "label": "Rate"
              },
              {
                "parameter": 5,
                "label": "Mix"
              }
            ],
            "shiftKnobs": [
              {
                "parameter": 2,
                "label": "Length"
              },
              {
                "parameter": 4,
                "label": "Swing"
              },
              {
                "parameter": 0,
                "label": "Level"
              }
            ],
            "file32": "VST/glitch-fx-arm32.so",
            "file64": "VST/glitch-fx-arm64.so",
            "description": "Step-sequenced multi effect: eight effect lanes (stutter, gate, crush, drive, ring mod, filter, delay throw, reverb throw) switched by a 16-step grid, with 8 pattern slots you can switch from the MPC sequencer or a Q-Link.",
            "author": "gltchsqnz",
            "url": "",
            "license": "MIT"
          }
          GLITCHEOF
          mkdir -p "$(dirname "ui.json")"
          cat > "ui.json" <<'GLITCHEOF'
