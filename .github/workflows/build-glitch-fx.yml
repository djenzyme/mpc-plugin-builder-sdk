          GLITCHEOF
          mkdir -p "$(dirname "README.md")"
          cat > "README.md" <<'GLITCHEOF'
          # Glitch FX

          A step-sequenced multi effect for the Akai MPC by **gltchsqnz**, in the spirit of Sugar Bytes Effectrix.
          Eight effect lanes each have a row of 16 steps; while a lane's step is lit, that effect is switched in
          (with a 3 ms crossfade, so switching never clicks). Eight pattern slots hold eight different grids, and
          the Pattern parameter can be switched from the MPC sequencer (automation) or a Q-Link.

          Version 1.3.3, uid `GFJg`, MIT licence. All DSP is written from scratch for this plugin.

          ## The lanes (top to bottom = signal order)

          | Lane | Colour | What it does | Knobs |
          |---|---|---|---|
          | STUTTER | orange | From the start of the step it records one Repeat length, then repeats it. Retriggers every step when Repeat is shorter than a step. The only buffer effect. | Stut Repeat (1/4 .. 1/64), Stut Pitch (speed of the repeats, -24 .. +12 st), Stut Decay (each repeat quieter), Stut Depth |
          | GATE | yellow | Tempo-synced chopper | Gate Rate (1/8 .. 1/64, triplets), Gate Duty, Gate Smooth (edge, ms), Gate Depth |
          | CRUSH | red | Bit depth and sample-rate reduction | Crush Bits (1 .. 16, fractional), Crush Rate (Hz), Crush Tone, Crush Depth |
          | DRIVE | pink | Shaper: 0 soft (tanh), 50 hard clip, 100 wavefold | Drive (dB), Drive Shape, Drive Tone, Drive Depth |
          | RING | purple | Ring modulator, right side detuned by Spread | Ring Freq, Ring Spread, Ring Shape (sine -> square), Ring Depth |
          | FILTER | blue | Resonant SVF, LP -> BP -> HP morph, Sweep glides the cutoff over each step (+-4 octaves) | Cutoff, Resonance, Filt Morph, Filt Sweep (+ Filt Depth on MAIN) |
          | DELAY | cyan | Ping-pong delay **throw**: fed only while its steps are on, the echoes ring on | Delay Time (1/32 .. 1/2), Delay Fdbk, Delay Tone, Delay Depth |
          | REVERB | green | Reverb **throw** (4-line FDN): fed only while its steps are on, the tail rings on | Verb Decay (s), Verb Damp, Verb Width, Verb Depth |

          ## Global

          - **Pattern** 1 .. 8: the slot shown in the grid and played. Automatable, on Q-Link 13 (top left).
          - **Length** 1 .. 16 steps: the pattern loops after this many steps (the dim LEDs above the grid).
          - **Step Rate** 1/32, 1/16T, 1/16, 1/8T, 1/8, 1/4: the length of one step.
          - **Swing** 50 % (straight) .. 75 %.
          - **Run**: *Play* runs the grid only while the MPC plays; *Always* keeps it running on its own clock while
            stopped (useful for live input). When the MPC plays, the grid locks to the song position.
          - **Mix**, **Level**.
          - **Depth** for every lane (0 = that effect does nothing even when its steps are lit). All 8 are on the MAIN
            page; on the effect pages the 4th knob of each row is its Depth (Filter: Sweep there, Filt Depth on MAIN).

          ## Pages

          | Tab | Contents |
          |---|---|
          | GRID | the 8 x 16 grid (tap a cell to toggle it), the running-step LEDs, pattern keys 1-8, Length |
          | MAIN | Step Rate, Length, Swing, Run / Pattern, Mix, Level / the 8 lane Depths (two rows, Q-Links 1-8) |
          | GLITCH | Stutter knobs + its lane, Gate knobs + its lane |
          | DIRT | Crush, Drive |
          | TONE | Ring, Filter |
          | SPACE | Delay, Reverb |

          Each effect page shows the lanes of its two effects under their knobs, so you can edit steps while tweaking.

          **Q-Links** (Screen mode): GRID top row = Pattern, Length, Step Rate, Swing; second row = Mix, Level.
          On the effect pages the top row is the upper effect, the second row the lower one.
          **Program mode**: 13-16 Pattern, Length, Step Rate, Swing; 9-12 Mix, Level, Cutoff, Filt Sweep;
          5-8 Stut Pitch, Gate Duty, Crush Bits, Drive; 1-4 Ring Freq, Delay Fdbk, Delay Depth, Verb Depth.

          ## Patterns and presets

          - After a preset or project loads, the plugin reports Pattern, every knob and all cells to the MPC (the
            shown slot first, all of it within about 0.75 s), because the MPC does not redraw them by itself. It also reports a
            slot's cells when Pattern changes. For 2 s after a load the plugin keeps the loaded cells, Pattern and knobs (not
            Level), so an edit in those 2 s is undone.
          - Every slot has its own 128 cells. The screen shows the grid of the slot chosen by Pattern, and that is
            exactly what plays: the plugin never rewrites cells, so the display cannot drift from the sound.
          - All 8 slots are saved with the project. Projects from 1.1.x are converted when they load.
          - Presets set all 8 slots, and every preset has its own 8 patterns (since 1.3.1):
            - Glitch FX (the factory bank, also the defaults): 1 Clean (all off: a "bypass" slot for the
              sequencer), 2 Chop, 3 Stutter fills, 4 Dirt, 5 Ring and filter, 6 Space throws, 7 Glitch, 8 Chaos.
            - Lo-Fi Chop: 1 Dusty, 2 Half chop, 3 Skip, 4 Chop, 5 Bit stab, 6 Tape chop, 7 Crunch, 8 Fill.
            - Dub Throws: 1 Snare throw, 2 Last beat, 3 Offbeats, 4 Dub filter, 5 Echo chamber, 6 Space, 7 Skank, 8 Wash
              out.
            - Ring Glitch: 1 Bell, 2 Ring 8ths, 3 Clang, 4 Metal fill, 5 Robot, 6 Stutter ring, 7 Glitch, 8 Ring chaos.
            - Filter Sweeps: 1 Open bar, 2 Second half, 3 Whole bar, 4 Pump, 5 Sweep drive, 6 Swung, 7 Breakdown, 8
              Build.
            - Tape Stutter: 1 End roll, 2 Half roll, 3 Bar roll, 4 Stops, 5 Repeats, 6 Tape stop, 7 Stutter fills, 8
              Scratch.
            - Hard Drive: 1 Grit, 2 Kick push, 3 Offbeat dirt, 4 Dirt, 5 Shred, 6 Chug, 7 Fold, 8 Meltdown.
            - Space Gate: 1 Trance gate, 2 Gated verb, 3 Pulse, 4 Shimmer, 5 Dotted, 6 Space throws, 7 Cathedral, 8
              Starfield.
          - Presets: Glitch FX, Lo-Fi Chop, Dub Throws, Ring Glitch, Filter Sweeps, Tape Stutter, Hard Drive, Space Gate,
            Init (every Depth at 0 and all 8 pattern slots empty: a blank start).

          ## Automation

          Every knob is smoothed and automatable, including Pattern, Length, Step Rate, Swing and Run. Not automatable:
          **Delay Time** (a change glides the delay and bends the echoes' pitch) and the **grid cells** (there are
          1024 of them, which would swamp the automation list: automate Pattern to switch between grids instead).

          ## MPC Sample (Knob FX)

          Knobs: Pattern, Rate, Mix. SHIFT: Length, Swing, Level. The grid cannot be edited there; the 8 factory
          patterns are played (program 0, "Glitch FX").

          ## Parameter list (order is permanent)

          0 Level, 1 Pattern, 2 Length, 3 Step Rate, 4 Swing, 5 Mix, 6 Run, 7-10 Stutter, 11-14 Gate, 15-18 Crush,
          19-22 Drive, 23-26 Ring, 27-30 Filter, 31-34 Delay, 35-38 Reverb, 39 Playhead (read-only display),
          40-167 slot 1 cells (lane L, step S = 40 + 16 L + S), 168 Bank Load (1.1.1 only, unused),
          169-1064 slots 2-8 cells (slot P = 2..8: 169 + 128 (P - 2) + 16 L + S), 1065 Filt Depth (1.3.0).
          1066 parameters in all.

          ## Q-Link labels

          The MPC labels plugin Q-Links as "<track / program name> (<parameter>)", e.g. "Drum001 (Pattern)". The
          prefix comes from the MPC, not from the plugin, and a plugin cannot change it. Renaming the track or program
          (e.g. to "GLITCH") makes the labels read "GLITCH (Pattern)".

          ## Changes

          - 1.3.3: the double-tap edit overlays have a dark background again (they were white).
          - 1.3.2: new look for the step grid (skin only, same parameters): a sunken touch matrix whose pads
            light softly in the lane colour; lane names centred on their rows.
          - 1.3.1: every preset has its own 8 patterns (before, all presets shared the factory bank and only
            chose a different slot). After a preset or project load the knobs are reported to the MPC too (Init
            now shows all Depths at 0), and kept for 2 s like the grid.
          - 1.3.0: Depth for every lane (new Filt Depth; the other lanes' "Mix" knobs renamed "Depth"), all on MAIN;
            Init sets every Depth to 0. The plugin reports cells and Pattern to the MPC after loads and Pattern
            changes, with a 2 s guard after loads against late write-backs.
          - 1.2.0: each pattern slot has its own cells; the skin shows the selected slot's grid (conditional
            visibility on Pattern). Fixes the grid not matching the sound after turning Pattern or changing preset,
            and one pattern turning up in every slot. 1.1.x projects are converted on load.
          - 1.1.1: fix: after changing preset the grid could show lit cells that did not play until toggled.
            Presets now carry a hidden Bank Load parameter, and every cell the plugin rewrites is reported to the MPC.
          - 1.1.0: Init preset (blank), appended as the last preset.
          - 1.0.0: first release.

          ## Notes

          - CPU: about 0.3 % of a desktop core per instance with all lanes running; expect a few percent on the MPC.
          - Memory: about 3 MB (stutter and delay buffers).
          - 1.3.0 has 1066 parameters (1024 of them grid cells, not automatable) and a 600 KB TUI.json (64 lane
            rows: 8 lanes x 8 slots, each a component with 16 step buttons, shown only for its slot).

          ## Building

          The plugin is built by `build-glitch-fx.yml` on GitHub Actions (native build -> `make_silver.py` skin ->
          arm32 + arm64 build and validation -> artifact `Glitch-FX-MPC`). Locally:

          ```
          python tools/build.py "plugins/Glitch FX" --target native
          python "plugins/Glitch FX/make_silver.py"
          python tools/build.py "plugins/Glitch FX"
          ```
          GLITCHEOF
          mkdir -p "$(dirname ".gitignore")"
          cat > ".gitignore" <<'GLITCHEOF'
          build/
          dist/
          GLITCHEOF
          mkdir -p "$(dirname "src/GlitchFX.cpp")"
          cat > "src/GlitchFX.cpp" <<'GLITCHEOF'
          // Glitch FX - an MPC insert effect plugin by gltchsqnz (MIT licence)
          //
          // A step-sequenced multi effect in the spirit of Sugar Bytes Effectrix: eight effect lanes, each with
          // its own row of 16 steps. While a lane's step is lit, that effect is switched in (with a 3 ms
          // crossfade, so switching never clicks). The grid runs from the MPC's song position (or from its own
          // clock while the MPC is stopped, if Run is "Always").
          //
          // Signal flow (per sample):
          //
          //   in -> STUTTER -> GATE -> CRUSH -> DRIVE -> RING -> FILTER --+--------------------+--> Mix -> Level -> out
          //                                                                \-> DELAY  (send) --+
          //                                                                 \-> REVERB (send) -+
          //
          //   The first six lanes are inserts (the lane crossfades between the signal and the effect).
          //   Delay and Reverb are sends: they are fed only while their steps are on, and their echoes / tails
          //   ring on after the step ends, the classic "throw".
          //
          // Patterns: there are 8 pattern slots, and every slot has its own 128 cell parameters (1.2.0). The skin
          // shows only the grid of the slot chosen by Pattern (conditional visibility on the MPC side), and the
          // audio plays that slot's cells. The plugin never writes a cell itself, so what is lit is always what
          // plays. Pattern is automatable and sits on a Q-Link, so the MPC sequencer can switch patterns.
          // Presets set all 8 slots.
          //
          // Parameters (order and ids are permanent once released; append new ones at the END):
          //   Global
          //    0 Level        output level, dB (harmless: the host nudges parameter 0 on load)
          //    1 Pattern      pattern slot 1..8 (automatable: switch patterns from the sequencer / Q-Links)
          //    2 Length       pattern length in steps, 1..16
          //    3 Step Rate    length of one step: 1/32 .. 1/4
          //    4 Swing        50 % (straight) .. 75 %
          //    5 Mix          dry / processed
          //    6 Run          Play: the grid runs only while the MPC plays; Always: free-runs while stopped
          //   Lanes (four knobs each)
          //    7 Stut Repeat  8 Stut Pitch   9 Stut Decay  10 Stut Depth
          //   11 Gate Rate   12 Gate Duty   13 Gate Smooth 14 Gate Depth
          //   15 Crush Bits  16 Crush Rate  17 Crush Tone  18 Crush Depth
          //   19 Drive       20 Drive Shape 21 Drive Tone  22 Drive Depth
          //   23 Ring Freq   24 Ring Spread 25 Ring Shape  26 Ring Depth
          //   27 Cutoff      28 Resonance   29 Filt Morph  30 Filt Sweep
          //   31 Delay Time  32 Delay Fdbk  33 Delay Tone  34 Delay Depth
          //   35 Verb Decay  36 Verb Damp   37 Verb Width  38 Verb Depth
          //   (the "... Depth" knobs were named "... Mix" before 1.3.0; same ids, same values)
          //   Display
          //   39 Playhead     the running step (written by the plugin, not automatable)
          //   Grid
          //   40..167 cells   slot 1: lane L (0..7), step S (0..15) is parameter 40 + 16 L + S
          //  168 Bank Load    1.1.1 only, no longer used as a value (kept so the parameter order never changes).
          //                   Since 1.3.0 a write to it marks a preset / project load (see reset()).
          //  169..1064 cells  slots 2..8 (1.2.0): slot P (1..7, 0-based) lane L step S is 169 + 128 (P-1) + 16 L + S
          //                   The cells are not automatable (1024 of them would swamp the automation list):
          //                   automate Pattern to switch between grids instead.
          //
          // 1065 Filt Depth  (1.3.0) the filter lane's amount, like the other lanes' Depth knobs
          //
          // Display refresh (1.3.0): the MPC does not redraw the grid cells when a preset or project changes them,
          // so after every load the plugin reports the cells to the host (the shown slot first), a few at a time,
          // and reports the new slot's cells again whenever Pattern changes. For 2 s after a load the plugin keeps the
          // loaded cells and Pattern: a host writing back older values (late echoes of those reports) is undone.
          // 1.3.1: the knobs are not redrawn after a preset change either (Init showed the old Depths), so a full
          // refresh now also reports every knob, and the guard keeps the loaded knob values too (all but Level).
          //
          // 1.1.x projects (one grid + the 8 slots in extra state "SFX1") are converted when they load.
          //
          // Automation: every knob is smoothed and automatable, except Delay Time (a change glides the delay,
          // which bends the pitch of the echoes) and the grid cells.

          #include "mpc_plugin.h"
          #include "dsp/tempo.h"
          #include "dsp/smoother.h"
          #include "GlitchFxDsp.h"

          #include <algorithm>
          #include <atomic>
          #include <cmath>
          #include <cstdio>
          #include <cstring>

          namespace {

          // Set to true if, on the hardware, the grid cannot be edited while its parameters are not automatable.
          constexpr bool kCellsAutomatable = false;

          enum ParamIndex
          {
              kLevel = 0, kPattern, kLength, kRate, kSwing, kMix, kRun,
              kStRepeat, kStPitch, kStDecay, kStMix,
              kGtRate, kGtDuty, kGtSmooth, kGtDepth,
              kCrBits, kCrRate, kCrTone, kCrMix,
              kDrDrive, kDrShape, kDrTone, kDrMix,
              kRgFreq, kRgSpread, kRgShape, kRgMix,
              kFlCut, kFlRes, kFlMorph, kFlSweep,
              kDlTime, kDlFb, kDlTone, kDlMix,
              kRvDecay, kRvDamp, kRvWidth, kRvMix,
              kPlayhead,
              kCell0,
              kBankLoad = kCell0 + 128,   // 1.1.1, unused since 1.2.0
              kCellSlot2,                 // 1.2.0: slots 2..8
              kFlDepth = kCellSlot2 + 7 * 128,   // 1.3.0
              kNumParams
          };

          constexpr int kLanes = 8, kSteps = 16, kPatterns = 8;
          inline int cellIndex(int slot, int lane, int step)
          {
              return (slot == 0 ? kCell0 : kCellSlot2 + (slot - 1) * 128) + lane * kSteps + step;
          }

          enum Lane { kStutter = 0, kGate, kCrush, kDrive, kRing, kFilter, kDelay, kReverb };
          const char* const kLaneShort[kLanes] = {"Stut", "Gate", "Crush", "Drive", "Ring", "Filt", "Delay", "Verb"};

          const float kRateBeats[] = {0.125f, 1.0f / 6.0f, 0.25f, 1.0f / 3.0f, 0.5f, 1.0f};
          const float kRepeatBeats[] = {1.0f, 0.5f, 0.25f, 0.125f, 0.0625f};
          const float kGateBeats[] = {0.5f, 0.25f, 1.0f / 6.0f, 0.125f, 1.0f / 12.0f, 0.0625f};
          const float kDelayBeats[] = {0.125f, 1.0f / 6.0f, 0.25f, 1.0f / 3.0f, 0.5f, 0.75f, 1.0f, 1.5f, 2.0f};

          // Factory pattern bank: [pattern][lane], 'x' = step on. Lanes: Stutter Gate Crush Drive Ring Filter Delay Reverb
          const char* const kFactory[kPatterns][kLanes] = {
              {   // 1 Clean: everything off (a handy "bypass" slot for the sequencer)
                  "................", "................", "................", "................",
                  "................", "................", "................", "................"},
              {   // 2 Chop
                  "................", "..xx..xx..xx..xx", "................", "................",
                  "................", "................", "...............x", "................"},
              {   // 3 Stutter fills
                  "............xxxx", "........x.x.....", "................", "................",
                  "................", "............xxxx", "................", "...x...........x"},
              {   // 4 Dirt
                  "................", "................", "x..x..x...x..x..", "....xxxx....xxxx",
