name: Build Comb Filter

# One-file setup: this workflow writes the whole Comb Filter project (code, UI layout and the brushed
# silver skin generator, which also paints the logo, title and button names) into
# plugins/Comb Filter/ on the build server, then builds and validates it.
# To change the plugin later, edit the file contents below.

on:
  push:
  workflow_dispatch:   # lets you press "Run workflow" from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write plugin files
        run: |
          set -e
          mkdir -p "plugins/Comb Filter"
          cd "plugins/Comb Filter"
          mkdir -p "$(dirname "plugin.json")"
          cat > "plugin.json" <<'SWEEPEOF'
          {
            "name": "Comb Filter",
            "manufacturer": "gltchsqnz",
            "version": "1.0.0",
            "format": "vst2",
            "kind": "effect",
            "uid": "GPGE",
            "numInputs": 2,
            "numOutputs": 2,
            "category": "Effect",
            "shortName": "Comb Filter",
            "knobs": [
              {
                "parameter": 3,
                "label": "Freq"
              },
              {
                "parameter": 4,
                "label": "Amount"
              },
              {
                "parameter": 5,
                "label": "Damping"
              }
            ],
            "shiftKnobs": [
              {
                "parameter": 7,
                "label": "Drive"
              },
              {
                "parameter": 8,
                "label": "Mix"
              },
              {
                "parameter": 6,
                "label": "Spread"
              }
            ],
            "file32": "VST/comb-filter-arm32.so",
            "file64": "VST/comb-filter-arm64.so",
            "description": "Stereo comb filter with a positive / negative switch, feedback or feedforward type, damping, stereo spread, overdrive and output level.",
            "author": "gltchsqnz",
            "url": "",
            "license": "MIT"
          }
          SWEEPEOF
          mkdir -p "$(dirname "ui.json")"
          cat > "ui.json" <<'SWEEPEOF'
          {
            "kit": "silver",
            "qlinkGroups": "rows",
            "style": {
              "background": "ffc4c7cd",
              "text": "ff16181b",
              "muted": "ff3d4148"
            },
            "pages": [
              {
                "name": "COMB",
                "background": "silver_bg.png",
                "controls": [
                  {
                    "param": "Freq",
                    "widget": "knob"
                  },
                  {
                    "param": "Amount",
                    "widget": "knob"
                  },
                  {
                    "param": "Damping",
                    "widget": "knob"
                  },
                  {
                    "param": "Spread",
                    "widget": "knob"
                  },
                  {
                    "param": "Polarity",
                    "widget": "switch"
                  },
                  {
                    "param": "Type",
                    "widget": "switch"
                  },
                  {
                    "param": "Drive",
                    "widget": "knob"
                  },
                  "empty",
                  {
                    "param": "Mix",
                    "widget": "fader"
                  },
                  {
                    "param": "Level",
                    "widget": "fader"
                  },
                  "empty",
                  "empty"
                ]
              }
            ]
          }
          SWEEPEOF
          mkdir -p "$(dirname "README.md")"
          cat > "README.md" <<'SWEEPEOF'
          # Comb Filter

          A stereo comb filter for Akai MPC standalone, by gltchsqnz. It mixes a short delay back with the signal,
          which carves a regular row of peaks and notches into the spectrum: from metallic ringing and flanging
          to robot voices and plucked-string tones.

          ## Parameters

          | # | Name | What it does |
          |---|------|--------------|
          | 0 | Level | Output volume, -24 to +12 dB |
          | 1 | Polarity | **Positive**: peaks at the Freq and its multiples (2x, 3x ...), a bright, metallic ring. **Negative**: peaks at the odd multiples of half the Freq (0.5x, 1.5x ...), a hollower sound that rings an octave lower |
          | 2 | Type | **Feedback**: resonant, the comb rings on after the sound stops. **Feedforward**: notches and peaks only, no ringing (flanger / phaser-like) |
          | 3 | Freq | The comb's pitch, 40 Hz to 8 kHz. Play it like a tuned resonator |
          | 4 | Amount | Feedback (Feedback type) or depth (Feedforward type), 0 to 100 % |
          | 5 | Damping | Darkens the loop so every repeat loses highs; low values ring bright, high values sound like a damped string. Pitch stays on Freq |
          | 6 | Spread | Detunes the left and right combs apart, up to an octave at 100 % |
          | 7 | Drive | Overdrive before the comb, 0 (clean) to 100 % |
          | 8 | Mix | Dry/wet |

          Programs: Metal Pipe, Hollow Flange, Plucked String, Robot Voice, Wide Phase, Hot Resonator, Odd Harmonics.

          ## Notes

          - The wet signal is level-matched, so Amount changes the sound more than the volume. Resonant settings
            are still louder at their peaks: use Level, or lower Mix, if they get hot.
          - A limiter inside the feedback loop keeps even 100 % Amount with full Drive stable.
          - Feedback combs ring on after the input stops (the plugin tells the MPC to keep processing for 8 s).
          - Freq follows the delay `1 / Freq`: at 441 Hz the delay is 100 samples. Keep Damping modest above about 4 kHz.
          - Not tempo-synced: Freq is a pitch, not a note length.
          - CPU is very low: one delay read, one one-pole filter and up to two `fastTanh()` per sample per channel.

          ## Look

          Brushed silver skin with blue buttons (names painted underneath), rows of controls centred on the screen,
          and the gltchsqnz logo with the title bottom right. `make_silver.py` draws it; the logo size (`LOGO_PLATE`,
          about 1.5 cm on 7" MPCs) and colours are constants at the top of that file.

          ## Knob FX mapping

          The SDK requires effects to declare one. It only matters on an MPC Sample:
          knobs Freq / Amount / Damping; SHIFT + knobs Drive / Mix / Spread.

          ## Licence

          MIT. Built on the MPC Plugin SDK's `dsp/delay_line.h`, `dsp/onepole.h` and `dsp/math.h`.
          SWEEPEOF
          mkdir -p "$(dirname "src/CombFilter.cpp")"
          cat > "src/CombFilter.cpp" <<'SWEEPEOF'
          // Comb Filter - an MPC insert effect plugin by gltchsqnz
          //
          // A stereo comb filter with a positive / negative switch, a feedback or feedforward type, damping,
          // stereo spread, an overdrive and an output level. The audio core is in CombDsp.h (read its header for
          // the maths); this file declares the parameters and runs the two channels.
          //
          // Signal flow:
          //     in -> DC block -> Drive (overdrive) -> comb -> Mix with the dry input -> Level -> out
          //
          // Parameters (order is permanent once released; append new ones at the END):
          //   0 Level      output volume (dB)  - harmless on load, as the host nudges param 0
          //   1 Polarity   Positive: peaks at f, 2f, 3f ...    Negative: peaks at f/2, 3f/2, ... (hollow, an octave lower)
          //   2 Type       Feedback (resonant, rings) or Feedforward (notches only, no ringing)
          //   3 Freq       the comb's pitch (Hz): the delay is 1 / Freq
          //   4 Amount     feedback (Feedback type) or depth (Feedforward type), %
          //   5 Damping    darkens the loop: each repeat loses highs (%)
          //   6 Spread     detunes the left and right combs apart, up to an octave (%)
          //   7 Drive      overdrive before the comb (%)
          //   8 Mix        dry/wet (%)
          //
          // CPU: per sample and channel there is one delay read, one one-pole filter and up to two fastTanh();
          // pitch and coefficients are updated every kCtrl samples.

          #include "mpc_plugin.h"
          #include "CombDsp.h"

          #include <algorithm>
          #include <cmath>

          namespace {

          enum ParamIndex
          {
              kLevel = 0,  // dB
              kPolarity,   // choice
              kType,       // choice
              kFreq,       // Hz
              kAmount,     // %
              kDamping,    // %
              kSpread,     // %
              kDrive,      // %
              kMix,        // % wet
              kNumParams
          };

          constexpr int kMaxChannels = 2;
          constexpr int kCtrl        = 32;     // control-rate block (samples)

          enum Polarity { kPositive = 0, kNegative };
          enum Type     { kFeedback = 0, kFeedforward };

          // One-pole smoother, advanced once per control block.
          struct Smooth
          {
              float v = 0.0f, rate = 0.12f;
              void  snap(float x) { v = x; }
              float next(float target) { v += rate * (target - v); return v; }
          };

          // Per-sample smoother for gain-type controls (avoids zipper noise).
          struct SampleSmooth
          {
              float v = 0.0f, rate = 0.002f;
              void  snap(float x) { v = x; }
              float next(float target) { v += rate * (target - v); return v; }
          };

          } // namespace

          class CombFilter : public mpc::Plugin
          {
          public:
              CombFilter() : mpc::Plugin(makeInfo())
              {
                  using namespace mpc;

                  // ids are saved in projects: never rename them once released.
                  addParam(floatParam ("level",    "Level",    -24.0f, 12.0f, 0.0f,   "dB", 1));
                  addParam(choiceParam("polarity", "Polarity", {"Positive", "Negative"}, kPositive));
                  addParam(choiceParam("type",     "Type",     {"Feedback", "Feedforward"}, kFeedback));
                  addParam(logParam   ("freq",     "Freq",     comb::kMinFreq, comb::kMaxFreq, 220.0f, "Hz", 0));
                  addParam(floatParam ("amount",   "Amount",   0.0f, 100.0f, 60.0f,   "%",  0));
                  addParam(floatParam ("damping",  "Damping",  0.0f, 100.0f, 25.0f,   "%",  0));
                  addParam(floatParam ("spread",   "Spread",   0.0f, 100.0f, 0.0f,    "%",  0));
                  addParam(floatParam ("drive",    "Drive",    0.0f, 100.0f, 0.0f,    "%",  0));
                  addParam(floatParam ("mix",      "Mix",      0.0f, 100.0f, 100.0f,  "%",  0));

                  // Built-in programs, plain values in parameter order:
                  //        Level Polarity Type Freq Amount Damping Spread Drive Mix
                  addProgram("Metal Pipe",     {0.0f, kPositive, kFeedback,    330.0f, 85.0f, 35.0f,  0.0f,  0.0f, 100.0f});
                  addProgram("Hollow Flange",  {0.0f, kNegative, kFeedback,    120.0f, 70.0f, 20.0f, 25.0f,  0.0f, 100.0f});
                  addProgram("Plucked String", {0.0f, kPositive, kFeedback,    196.0f, 92.0f, 55.0f, 10.0f, 15.0f, 100.0f});
                  addProgram("Robot Voice",    {0.0f, kPositive, kFeedforward, 110.0f, 80.0f,  0.0f,  0.0f, 10.0f, 100.0f});
                  addProgram("Wide Phase",     {0.0f, kNegative, kFeedforward, 700.0f, 55.0f,  0.0f, 45.0f,  0.0f,  60.0f});
                  addProgram("Hot Resonator",  {-3.0f, kPositive, kFeedback,   440.0f, 80.0f, 30.0f, 20.0f, 60.0f,  80.0f});
                  addProgram("Odd Harmonics",  {0.0f, kNegative, kFeedback,    220.0f, 75.0f, 40.0f,  0.0f,  0.0f, 100.0f});
              }

              void prepare(double sampleRate, int maxBlockSize) override
              {
                  (void)maxBlockSize;
                  for (comb::Channel& c : channels_) c.prepare(sampleRate);
                  reset();
              }

              void reset() override
              {
                  for (comb::Channel& c : channels_) c.reset();
                  level_.snap(dbToGain(get(kLevel)));
                  mix_.snap(get(kMix) * 0.01f);
                  logFreq_.snap(std::log2(get(kFreq)));
                  amount_.snap(get(kAmount) * 0.01f);
                  damping_.snap(get(kDamping) * 0.01f);
                  spread_.snap(get(kSpread) * 0.01f);
                  drive_.snap(get(kDrive) * 0.01f);
              }

              void process(mpc::ProcessContext& ctx) override
              {
                  const int numFrames   = ctx.numFrames;
                  const int numChannels = mpc::clamp(ctx.numOutputs, 0, kMaxChannels);

                  // --- read parameters once per block ---------------------------------
                  comb::Block base;
                  base.negative    = getInt(kPolarity) == kNegative;
                  base.feedforward = getInt(kType) == kFeedforward;
                  const float freqT    = std::log2(std::max(1.0f, get(kFreq)));
                  const float amountT  = get(kAmount) * 0.01f;
                  const float dampingT = get(kDamping) * 0.01f;
                  const float spreadT  = get(kSpread) * 0.01f;
                  const float driveT   = get(kDrive) * 0.01f;
                  const float levelT   = dbToGain(get(kLevel));
                  const float mixT     = get(kMix) * 0.01f;

                  for (int start = 0; start < numFrames; start += kCtrl)
                  {
                      const int len = std::min(kCtrl, numFrames - start);

                      base.amount  = amount_.next(amountT);
                      base.damping = damping_.next(dampingT);
                      base.drive   = drive_.next(driveT);
                      const float freq   = std::exp2(logFreq_.next(freqT));
                      const float spread = spread_.next(spreadT);

                      float freqs[kMaxChannels];
                      comb::spreadFreqs(freq, spread, freqs[0], freqs[1]);
                      for (int ch = 0; ch < numChannels; ++ch)
                      {
                          comb::Block b = base;
                          b.freq = freqs[ch];
                          channels_[ch].setBlock(b, len);
                      }

                      for (int n = 0; n < len; ++n)
                      {
                          const int i = start + n;
                          const float level = level_.next(levelT);
                          const float mix   = mix_.next(mixT);

                          for (int ch = 0; ch < numChannels; ++ch)
                          {
                              const float dry = (ctx.inputs != nullptr && ch < ctx.numInputs && ctx.inputs[ch] != nullptr)
                                                    ? ctx.inputs[ch][i] : 0.0f;
                              const float wet = channels_[ch].process(dry);
                              ctx.outputs[ch][i] = (dry + (wet - dry) * mix) * level;
                          }
                      }
                  }
              }

              void parameterChanged(int index, float plainValue) override { (void)index; (void)plainValue; }

          private:
              static mpc::PluginInfo makeInfo()
              {
                  mpc::PluginInfo info;
                  info.name         = "Comb Filter";
                  info.vendor       = "gltchsqnz";   // must match plugin.json "manufacturer"
                  info.uniqueId     = MPC_FOURCC(kUid[0], kUid[1], kUid[2], kUid[3]);   // must match plugin.json "uid"
                  info.version      = 1000;           // 1.0.0.0
                  info.isInstrument = false;
                  info.numInputs    = 2;
                  info.numOutputs   = 2;
                  info.tailSamples  = 8 * 44100;      // a resonant comb rings on after the input stops
                  return info;
              }

              static constexpr char kUid[5] = "GPGE";

              static float dbToGain(float dB) { return std::pow(10.0f, dB / 20.0f); }

              comb::Channel channels_[kMaxChannels];
              SampleSmooth  level_, mix_;
              Smooth        logFreq_, amount_, damping_, spread_, drive_;
          };

          MPC_PLUGIN_ENTRY(CombFilter)
          SWEEPEOF
          mkdir -p "$(dirname "src/CombDsp.h")"
          cat > "src/CombDsp.h" <<'SWEEPEOF'
          // CombDsp.h - the audio core of Comb Filter (one channel). Uses only the SDK's dsp/ helpers, so it can
          // be compiled and tested on its own, away from the MPC framework.
          //
          // Signal flow (one channel):
          //
          //   in -> DC block -> overdrive -> [ comb ] -> normalise -> wet
          //
          //   Feedback comb     y[n] = x[n] + g * damp( sat( y[n-D] ) )      resonant, rings at f = fs / D and its multiples
          //   Feedforward comb  y[n] = x[n] + g * damp( x[n-D] )             notches / peaks, no ringing
          //
          //   D = fs / Freq (fractional, linear interpolation).  g is signed:
          //     g > 0  POSITIVE comb: peaks at   f, 2f, 3f ...           (notches halfway between)
          //     g < 0  NEGATIVE comb: peaks at   f/2, 3f/2, 5f/2 ...    (odd multiples of f/2: a hollow, octave-down sound)
          //
          //   damp() is a one-pole lowpass in the loop (Damping). Its delay is subtracted from D, so the pitch stays on
          //   Freq as Damping changes. sat() is a tanh limiter in the feedback loop: resonances grow warm, never explode.
          //   The wet signal is normalised (about unity RMS on noise), so Amount does not change the level much.
          //
          // No allocation outside prepare(). No transcendental function per sample except the two fastTanh().

          #ifndef COMB_DSP_H
          #define COMB_DSP_H

          #include "dsp/delay_line.h"
          #include "dsp/math.h"
          #include "dsp/onepole.h"

          #include <algorithm>
          #include <cmath>

          namespace comb {

          constexpr float kMinFreq  = 40.0f;     // Hz, lowest Freq parameter value
          constexpr float kMaxFreq  = 8000.0f;   // Hz, highest Freq parameter value
          constexpr float kMaxSpread = 12.0f;    // semitones between the two channels at Spread = 100 %
          constexpr float kMaxFeedback = 0.97f;  // loop gain at Amount = 100 % (feedback type)

          // Everything the channel needs for one control block (a few milliseconds), already in DSP units.
          struct Block
          {
              float freq        = 220.0f;   // Hz
              float amount      = 0.5f;     // 0..1
              bool  negative    = false;    // polarity
              bool  feedforward = false;    // type
              float damping     = 0.0f;     // 0..1 (0 = bright loop, 1 = dark loop)
              float drive       = 0.0f;     // 0..1
          };

          inline float dampingCutoff(float damping)   // 0 -> 20 kHz (open), 1 -> 1.5 kHz
          {
              return 20000.0f * std::pow(1500.0f / 20000.0f, std::min(1.0f, std::max(0.0f, damping)));
          }

          class Channel
          {
          public:
              void prepare(double sampleRate)
              {
                  sr_ = (float)sampleRate;
                  // longest delay: Freq at its minimum, detuned down by the full Spread, plus a little headroom
                  const float lowest = kMinFreq * std::pow(2.0f, -kMaxSpread / 24.0f);
                  delay_.prepare((int)(sr_ / lowest) + 16);
                  dc_.prepare(sampleRate, 10.0f);
                  reset();
              }

              void reset()
              {
                  delay_.reset();
                  dc_.reset();
                  damp_.reset();
                  cur_ = target_ = std::max(2.0f, sr_ / 220.0f);
                  step_ = 0.0f;
                  primed_ = false;     // the first block after a reset jumps straight to the set frequency
              }

              // Called once per control block. `len` is the number of samples until the next call: the delay glides
              // there, so frequency changes sweep smoothly instead of clicking.
              void setBlock(const Block& b, int len)
              {
                  const float a = std::max(0.02f, std::min(1.0f, 1.0f - std::exp(-6.2831853f * dampingCutoff(b.damping) / sr_)));
                  damp_.setCoeff(a);
                  const float loopDelay = (1.0f - a) / a;                       // group delay of the damping filter at low frequencies
                  const float want = std::max(2.0f, sr_ / std::max(1.0f, b.freq) - loopDelay);
                  if (!primed_) { cur_ = want; primed_ = true; }
                  target_ = want;
                  step_ = len > 0 ? (target_ - cur_) / (float)len : 0.0f;

                  feedforward_ = b.feedforward;
                  const float sign = b.negative ? -1.0f : 1.0f;
                  if (b.feedforward)
                  {
                      gain_ = sign * std::min(1.0f, std::max(0.0f, b.amount));
                      norm_ = 1.0f / std::sqrt(1.0f + gain_ * gain_);
                  }
                  else
                  {
                      gain_ = sign * kMaxFeedback * std::min(1.0f, std::max(0.0f, b.amount));
                      norm_ = std::sqrt(1.0f - gain_ * gain_);
                  }

                  const float d = std::min(1.0f, std::max(0.0f, b.drive));
                  driveGain_ = 1.0f + 24.0f * d;                                // up to about +28 dB into the shaper
                  driveComp_ = 1.0f / std::sqrt(driveGain_);                    // roughly level-matched
                  driveBlend_ = std::min(1.0f, d * 10.0f);                      // exactly clean at 0, fully shaped from 10 %
              }

              float process(float x)
              {
                  cur_ += step_;

                  // input: DC block, then overdrive
                  x = dc_.process(x);
                  if (driveBlend_ > 0.0f)
                  {
                      const float shaped = mpc::dsp::fastTanh(x * driveGain_) * driveComp_;
                      x += driveBlend_ * (shaped - x);
                  }

                  // comb: read before write, so a delay of D samples really is D samples
                  const float tap = damp_.process(delay_.readLinear(cur_));
                  float y;
                  if (feedforward_)
                  {
                      y = x + gain_ * tap;
                      delay_.write(x);
                  }
                  else
                  {
                      y = x + gain_ * mpc::dsp::fastTanh(tap);
                      delay_.write(y);
                  }
                  return mpc::dsp::flushDenormal(y * norm_);
              }

          private:
              mpc::dsp::DelayLine delay_;
              mpc::dsp::OnePoleLP damp_;
              mpc::dsp::DCBlocker dc_;
              float sr_ = 44100.0f;
              float cur_ = 200.0f, target_ = 200.0f, step_ = 0.0f;
              float gain_ = 0.0f, norm_ = 1.0f;
              float driveGain_ = 1.0f, driveComp_ = 1.0f, driveBlend_ = 0.0f;
              bool  feedforward_ = false;
              bool  primed_ = false;
          };

          // The stereo detune: the two channels are spread symmetrically around Freq by up to kMaxSpread semitones.
          inline void spreadFreqs(float freq, float spread01, float& left, float& right)
          {
              const float half = std::min(1.0f, std::max(0.0f, spread01)) * kMaxSpread * 0.5f;
              left  = freq * std::pow(2.0f, -half / 12.0f);
              right = freq * std::pow(2.0f,  half / 12.0f);
          }

          } // namespace comb

          #endif // COMB_DSP_H
          SWEEPEOF
          mkdir -p "$(dirname "make_silver.py")"
          cat > "make_silver.py" <<'SWEEPEOF'
          #!/usr/bin/env python3
          """Comb Filter - brushed silver skin.

          Draws a brushed-aluminium version of the SDK's UI kit (knobs, faders, blue segment buttons)
          and a brushed page background, then runs the SDK's own gen_ui.py on ui.json. On top of the
          plain generator output it
            * centres every row of controls (and its Q-Link rectangle) on the screen,
            * paints the gltchsqnz logo (about 1.5 cm) bottom right, with the bold title to its left,
            * paints the names of the choices (Positive / Negative, Feedback / Feedforward) in black under the
              segment buttons.
          The logo, title and button names are pixels in the page background, so they always show.

          The result goes to ./skins/, which build.py copies verbatim into "Plugin Skins/".

          Needs build/params.json first:   python tools/build.py "plugins/Comb Filter" --target native
          Run from anywhere:               python "plugins/Comb Filter/make_silver.py"
          Optional preview sheet:          ... make_silver.py --preview preview.png

          Standard library only. Nothing here changes the SDK; the silver theme is registered
          inside this process only.
          """

          import base64
          import math
          import os
          import shutil
          import struct
          import sys
          import zlib

          HERE = os.path.dirname(os.path.abspath(__file__))
          SDK = os.path.dirname(os.path.dirname(HERE))          # plugins/<Name>/ -> SDK root
          sys.path.insert(0, os.path.join(SDK, "tools"))

          import make_ui_kit as K   # noqa: E402
          import gen_ui             # noqa: E402

          ACCENT = "ff1d5fd6"       # the lit colour (knob arcs, fader fill). Change it here.

          # Button colours (brushed blue).
          BTN_OFF = ((70, 120, 215, 255), (36, 78, 170, 255))     # top -> bottom, resting
          BTN_ON = ((90, 158, 255, 255), (40, 112, 238, 255))     # top -> bottom, selected
          BTN_EDGE_ON = (205, 228, 255, 255)
          BTN_EDGE_OFF = (16, 40, 92, 255)

          # Logo and text on the page.
          LOGO_PLATE = 128          # logo size in screen pixels: about 1.5 cm on the 7" MPC screens (~85 px/cm)
          LOGO_MARGIN = 26          # gap from the bottom-right corner of the screen
          TITLE_GAP = 24            # gap between the title and the logo
          TEXT_BLACK = (14, 15, 17)
          BLOCK_SHIFT = -20         # nudge the control block up a little to leave room for the logo band

          LOGO = (                  # the gltchsqnz invader, 8 x 7 cells
              ".#....#.",
              "..#..#..",
              ".######.",
              "##.##.##",
              "########",
              ".#....#.",
              "..#..#..",
          )

          SILVER_GREYS = {
              "bg":         "ffc4c7cd",   # page colour
              "body":       "ffb4b8bf",   # knob / button body
              "bodyLight":  "fff0f1f4",   # lit edge
              "bodyDark":   "ff6f737b",   # shaded edge, grooves
