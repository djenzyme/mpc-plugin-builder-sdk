name: Build Analysis Meter

# One-file setup: this workflow writes the whole Analysis Meter project (code, UI layout and the brushed
# silver skin generator, which also draws the spectrum curve, goniometer, meters, logo, title and button names) into
# plugins/Analysis Meter/ on the build server, then builds and validates it.
# To change the plugin later, edit the file contents below.

on:
  push:
  workflow_dispatch:   # lets you press "Run workflow" from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write plugin files
        run: |
          set -e
          mkdir -p "plugins/Analysis Meter"
          cd "plugins/Analysis Meter"
          mkdir -p "$(dirname "plugin.json")"
          cat > "plugin.json" <<'AMEOF'
          {
            "name": "Analysis Meter",
            "manufacturer": "gltchsqnz",
            "version": "1.0.0",
            "format": "vst2",
            "kind": "effect",
            "uid": "GAnM",
            "numInputs": 2,
            "numOutputs": 2,
            "category": "Effect",
            "shortName": "Analysis",
            "knobs": [
              { "parameter": 0, "label": "Source" },
              { "parameter": 1, "label": "Response" },
              { "parameter": 2, "label": "Slope" }
            ],
            "shiftKnobs": [
              { "parameter": 4, "label": "ScopeGn" },
              { "parameter": 5, "label": "Persist" },
              { "parameter": 6, "label": "Refresh" }
            ],
            "file32": "VST/analysis-meter-arm32.so",
            "file64": "VST/analysis-meter-arm64.so",
            "description": "Spectrum analyser (8192-point FFT curve with slope, peak finder and cursor) and goniometer with phase correlation, balance and side/mid meters.",
            "author": "gltchsqnz",
            "url": "",
            "license": "MIT"
          }
          AMEOF
          mkdir -p "$(dirname "ui.json")"
          cat > "ui.json" <<'AMEOF'
          {
            "kit": "silver",
            "qlinkGroups": "rows",
            "style": {
              "background": "ffc4c7cd",
              "text": "ff16181b",
              "muted": "ff3d4148"
            },
            "pages": [
              {
                "name": "SPECTRUM",
                "background": "silver_spectrum_bg.png",
                "controls": [
                  { "param": "Source", "widget": "knob", "overlay": "menu" },
                  { "param": "Response", "widget": "switch" },
                  { "param": "Slope", "widget": "switch" },
                  { "param": "Cursor", "widget": "knob" }
                ]
              },
              {
                "name": "STEREO",
                "background": "silver_stereo_bg.png",
                "controls": [
                  { "param": "Scope Gain", "widget": "knob", "overlay": "menu" },
                  { "param": "Persistence", "widget": "knob" },
                  { "param": "Refresh", "widget": "switch" }
                ]
              }
            ]
          }
          AMEOF
          mkdir -p "$(dirname "README.md")"
          cat > "README.md" <<'AMEOF'
          # Analysis Meter

          A spectrum analyser and stereo meter for Akai MPC standalone, by gltchsqnz. The spectrum works like
          Voxengo SPAN (an FFT curve on a log frequency axis); the stereo page has a goniometer, phase correlation,
          balance and side / mid. Put it last on a track or the master: audio passes through untouched (bit-exact),
          the plugin only measures.

          ## SPECTRUM tab

          - **The curve**: an 8192-point FFT (Hann window, 87.5 % overlap, about 47 new spectra a second; 16384
            points at 88.2 / 96 kHz) drawn from 20 Hz to 20 kHz on a log axis, -90 to +6 dB. A column that covers
            several FFT bins shows the loudest one; at the low end, where bins are wider than a column, the curve is
            interpolated between bins.
          - **Source** (knob, menu): **Stereo** (L and R analysed separately and their powers averaged, so
            out-of-phase content does not cancel), **Mid** (L+R)/2, **Side** (L-R)/2, **Left**, **Right**
          - **Response**: **FAST** (125 ms average), **SLOW** (1 s average), **PEAK** (instant rise, falls at 20 dB/s),
            **MAX** (holds the highest level; switch to another response and back to clear it)
          - **Slope**: tilts the display around 1 kHz like SPAN's slope: **FLAT**, **3 dB** or **4.5 dB** per octave
            (default 4.5, so a typical mix looks roughly level). Only the curve is tilted, never the numbers.
          - **Cursor** (knob, or touch / drag on the plot): a frequency marked by the amber line. The **CURSOR**
            readout shows its frequency and the exact level there.
          - **PEAK** readout: the frequency of the loudest component with its note name and tuning in cents
            (A4 = 440 Hz), and its level.

          ### Accuracy

          - Calibration: a sine reads its peak level (a 0 dBFS sine reads 0.0 dB) at any frequency. Each bin's level
            is the power of that bin and its two neighbours over the Hann window's main-lobe energy, which cancels the
            window's scalloping loss. Measured with test tones at random frequencies (25 Hz .. 17 kHz) and levels
            (0 to -60 dB) at 44.1, 48 and 96 kHz: Peak and Cursor readouts within 0.13 dB, the curve within one pixel
            (0.36 dB).
          - Peak frequency: interpolated between bins (log-parabolic, accurate for a Hann window); shown to 0.1 Hz
            below 1 kHz and to 1 Hz above; largest error in the tests 0.13 Hz (at 27 Hz, where bins are 5.9 Hz apart).
          - With **Stereo**, a signal in one channel only reads 3 dB lower (the power average of L and R); use
            **Left** / **Right** to read one channel by itself.
          - At 44.1 kHz the analyser stops at the Nyquist frequency, 22.05 kHz; the plot ends at 20 kHz.
          - Noise is shown with the same calibration as tones (per FFT bin), so noise reads lower than its total
            level, as in other FFT analysers. Use the Slope to view pink-noise-like material level.

          ## STEREO tab

          - **Goniometer**: Mid vertical, Side horizontal. Mono is a vertical line, a signal in L only lies on the
            L diagonal and one in R only on the R diagonal, out-of-phase content spreads sideways (horizontal at
            -1 correlation). At 0 dB scope gain every unclipped signal stays inside the outer diamond; the dashed
            diamond is half scale. The plot is 51 columns x 56 rows; each column shows the span of rows hit.
          - **Scope Gain** (knob, menu): **Auto** (zooms so the loudest recent peak fills 90 % of the scope; zooms
            out at once, in at 10 dB/s, up to +36 dB) or fixed 0, +6, +12, +18, +24 dB. **Scope Level** shows the gain in
            use.
          - **Persistence**: how long a point stays lit, 20 .. 1000 ms (default 150 ms)
          - **Refresh**: how often the screen is updated, **15 Hz**, **30 Hz** (default) or **60 Hz**. This affects the
            screen only; the measuring runs on every sample.
          - **Phase Correlation**: -1 .. +1, about 300 ms response. +1 is mono / in phase, 0 is wide or unrelated,
            below 0 out of phase (red: problems when summed to mono).
          - **Balance**: the level difference of R and L, L 24 .. R 24 dB (C = centred). Blue within 3 dB, amber to
            12 dB, red beyond.
          - **Side / Mid**: side level relative to mid level in dB ("mono" when there is no side signal at all).
            About -20 dB is narrow, -10 to -6 dB wide, 0 dB or more means as much side as mid.

          ## Programs

          Mix (default: Fast, 4.5 dB slope), Flat FFT, Slow Average, Peaks, Max Hold, Side Check (Side source,
          slow), Low End (Mid, flat, cursor at 60 Hz), Tuning (Mid, flat, cursor at 440 Hz).

          ## Parameters

          | # | Name | |
          |---|------|--|
          | 0 | Source | Stereo / Mid / Side / Left / Right |
          | 1 | Response | Fast / Slow / Peak / Max |
          | 2 | Slope | Flat / 3 dB/oct / 4.5 dB/oct |
          | 3 | Cursor | 20 .. 20000 Hz |
          | 4 | Scope Gain | Auto / 0 / +6 / +12 / +18 / +24 dB |
          | 5 | Persistence | 20 .. 1000 ms |
          | 6 | Refresh | 15 / 30 / 60 Hz |
          | 7-166 | Curve 1-160 | readings: column heights |
          | 167-169 | Cursor Level, Peak Freq, Peak Level | readings |
          | 170-271 | Scope Up 1-51, Scope Dn 1-51 | readings: goniometer columns |
          | 272-275 | Correlation, Balance, Side / Mid, Scope Level | readings |

          Readings are written by the plugin and are not automatable.

          ## How the meters reach the screen

          The MPC gives scripted skins no audio of their own, and its graph (Plotter) widget does not draw, so every
          reading is a parameter that the plugin writes and reports to the host. The spectrum curve is 160 columns,
          each a film strip of a filled slice with a bright top edge (271 frames, one per pixel of height); the
          goniometer is 102 film strips whose frame encodes the lit span of the column. Readings are re-sent only when
          what they show has changed; numbers about 10 times a second. For 0.3 s after a project or preset load
          nothing is written, so the loaded state stays intact.

          With busy music the plugin reports about 2,500 (15 Hz), 4,200 (30 Hz) or 6,000 (60 Hz) parameter changes a
          second. Utility Meter's ~30 Hz meters are proven on hardware, but this is many more readings at once. If the
          screen lags or the MPC feels sluggish, lower **Refresh**.

          ## CPU

          The FFT work is spread over the audio blocks in small steps (no spike when a new spectrum is computed).
          Measured on a desktop CPU: about 1 % of one core at 48 kHz, 2 % at 96 kHz, worst block well under 3 % of
          its time budget. Expect several times that on the MPC: still a light plugin.

          ## Knob FX mapping (MPC Sample)

          Knobs: Source, Response, Slope. SHIFT knobs: Scope Gain, Persistence, Refresh. The MPC Sample has no screen
          for the meters, so the plugin is of little use there; it passes audio through untouched.

          ## Look

          Brushed silver skin, blue Response / Slope / Refresh buttons with their names painted underneath, the
          gltchsqnz logo with the title bottom right, dark LCD panels with the curve and the scope in the LED blue.
          `make_silver.py` draws it all (curve slices, cursor line, scope strips, bars, grids, panels, logo). The
          double-tap / Enter edit overlays use the MPC's usual dark background.

          ## Licence

          MIT. All code is original (radix-2 FFT, analysis and skin generator); the Poppins font masks are SIL OFL.
          AMEOF
          mkdir -p "$(dirname ".gitignore")"
          cat > ".gitignore" <<'AMEOF'
          build/
          dist/
          AMEOF
          mkdir -p "$(dirname "src/AnalysisMeter.cpp")"
          cat > "src/AnalysisMeter.cpp" <<'AMEOF'
          // Analysis Meter - an MPC insert effect plugin by gltchsqnz
          //
          // A spectrum analyser in the manner of Voxengo SPAN and a goniometer with phase correlation, balance and
          // side / mid meters. Audio passes through untouched (bit-exact); the plugin only measures. The measuring
          // core is AnalysisDsp.h (its header explains the maths and the calibration).
          //
          // Signal flow:
          //     in -> out (unchanged)
          //      \-> source select (Stereo / Mid / Side / Left / Right) -> 8192-point FFT -> averaging -> 160 columns
          //      \-> goniometer (M / S scatter with persistence), correlation, balance, side / mid
          //
          // How the screen is driven: the MPC has no level feed from a plugin, and its graph (Plotter) widget does
          // not draw, so every reading is a parameter that the plugin writes itself (the read-only "readings") and
          // reports to the host. The skin binds film-strip images and labels to them:
          //   - the spectrum curve is 160 columns, each a film strip of a filled slice with a bright top edge
          //     (frame = height in pixels),
          //   - the goniometer is 51 columns x 2 halves, each a film strip whose frame encodes the lit span,
          //   - correlation and balance are LED bars, the numbers are labels.
          // The screen is refreshed at the Refresh rate (15 / 30 / 60 Hz), numbers about 10 times a second, and a
          // reading is only re-sent when it has visibly changed. For 0.3 s after a project / preset load nothing is
          // written, so the loaded state stays intact. The measuring itself runs on every sample, whatever the rate.
          //
          // Parameters (order is permanent once released; append new ones at the END):
          //   Controls
          //   0 Source       Stereo (L and R powers averaged), Mid, Side, Left, Right. Harmless on load (param 0).
          //   1 Response     Fast (125 ms), Slow (1 s), Peak (20 dB/s fall), Max (holds the highest)
          //   2 Slope        display tilt around 1 kHz: Flat, 3 dB/oct, 4.5 dB/oct (readouts are never tilted)
          //   3 Cursor       a frequency whose exact level is shown in the Cursor readout (marker on the curve)
          //   4 Scope Gain   goniometer gain: Auto, 0, +6, +12, +18, +24 dB
          //   5 Persistence  how long a goniometer dot stays lit, 20 .. 1000 ms
          //   6 Refresh      screen refresh: 15, 30, 60 Hz
          //   Readings (written by the plugin, not automatable)
          //   7 .. 166       Curve 1 .. 160   column heights (0 = empty, 1 .. 270 pixels)
          //   167            Cursor Level     dB at the Cursor frequency
          //   168            Peak Freq        frequency of the loudest component, Hz (0 = none)
          //   169            Peak Level       its level, dB
          //   170 .. 220     Scope Up 1 .. 51 goniometer columns, upper half (frame index of the lit span)
          //   221 .. 271     Scope Dn 1 .. 51 goniometer columns, lower half
          //   272            Correlation      -1 .. +1
          //   273            Balance          dB, + = right louder
          //   274            Side / Mid       dB
          //   275            Scope Level      the goniometer gain in use (Auto shows what it chose)

          #include "mpc_plugin.h"
          #include "AnalysisDsp.h"

          #include <algorithm>
          #include <cmath>
          #include <cstdio>
          #include <cstring>

          namespace {

          constexpr int kCurveCols = ana::Spectrum::kCols;           // 160
          constexpr int kScopeCols = ana::Goniometer::kCols;         // 51

          enum ParamIndex
          {
              kSource = 0, kResponse, kSlope, kCursor, kScopeGain, kPersist, kRefresh,
              kCurve0,
              kCursorLevel = kCurve0 + kCurveCols,
              kPeakFreq, kPeakLevel,
              kScopeUp0,
              kScopeDn0 = kScopeUp0 + kScopeCols,
              kCorr = kScopeDn0 + kScopeCols,
              kBalance, kSideMid, kScopeLevel,
              kNumParams
          };
          static_assert(kCursorLevel == 167 && kScopeUp0 == 170 && kCorr == 272 && kNumParams == 276, "parameter map");

          enum Source { kSrcStereo = 0, kSrcMid, kSrcSide, kSrcLeft, kSrcRight };

          // Curve geometry: the column film strips have kCurveH + 1 frames (frame = filled height in pixels).
          constexpr int kCurveH = 270;
          constexpr double kDbLo = -90.0, kDbHi = 6.0;     // bottom and top of the spectrum plot
          constexpr float kLevelLo = -150.0f;               // "nothing" for the dB readouts

          const double kSlopes[] = {0.0, 3.0, 4.5};
          const double kScopeGains[] = {0.0, 1.0, 1.99526231, 3.98107171, 7.94328235, 15.8489319};   // 0 = auto
          const int kRates[] = {15, 30, 60};

          const char* const kNoteNames[] = {"C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"};

          } // namespace

          class AnalysisMeter : public mpc::Plugin
          {
          public:
              AnalysisMeter() : mpc::Plugin(makeInfo())
              {
                  using namespace mpc;
                  // ids are saved in projects: never rename them once released.
                  addParam(choiceParam("source",   "Source",   {"Stereo", "Mid", "Side", "Left", "Right"}, kSrcStereo));
                  addParam(choiceParam("response", "Response", {"Fast", "Slow", "Peak", "Max"}, ana::kFast));
                  addParam(choiceParam("slope",    "Slope",    {"Flat", "3 dB/oct", "4.5 dB/oct"}, 2));
                  addParam(logParam   ("cursor",   "Cursor",   20.0f, 20000.0f, 1000.0f, "Hz", 0));
                  addParam(choiceParam("scopegain", "Scope Gain", {"Auto", "0 dB", "+6 dB", "+12 dB", "+18 dB", "+24 dB"}, 0));
                  addParam(logParam   ("persist",  "Persistence", 20.0f, 1000.0f, 150.0f, "ms", 0));
                  addParam(choiceParam("refresh",  "Refresh",  {"15 Hz", "30 Hz", "60 Hz"}, 1));

                  char id[32], name[32];
                  for (int c = 0; c < kCurveCols; ++c)
                  {
                      std::snprintf(id, sizeof(id), "curve%d", c + 1);
                      std::snprintf(name, sizeof(name), "Curve %d", c + 1);
                      reading(id, name, 0.0f, (float)kCurveH, 0);
                  }
                  reading("cursorlevel", "Cursor Level", kLevelLo, 12.0f);
                  reading("peakfreq",    "Peak Freq",    0.0f, 24000.0f, 1);
                  reading("peaklevel",   "Peak Level",   kLevelLo, 12.0f);
                  for (int half = 0; half < 2; ++half)
                      for (int c = 0; c < kScopeCols; ++c)
                      {
                          std::snprintf(id, sizeof(id), half ? "scopedn%d" : "scopeup%d", c + 1);
                          std::snprintf(name, sizeof(name), half ? "Scope Dn %d" : "Scope Up %d", c + 1);
                          reading(id, name, 0.0f, (float)(ana::Goniometer::kFrames - 1), 0);
                      }
                  reading("corr",       "Correlation", -1.0f, 1.0f, 2);
                  reading("balance",    "Balance",     -24.0f, 24.0f, 1);
                  reading("sidemid",    "Side / Mid",  -60.0f, 20.0f, 1);
                  reading("scopelevel", "Scope Level", 0.0f, 36.0f, 1);

                  // Built-in programs (plain values of the controls, in parameter order):
                  //                        Source       Response     Slope Cursor  Gain Persist Refresh
                  addProgram("Mix",        {kSrcStereo, ana::kFast,  2.0f, 1000.0f, 0.0f, 150.0f, 1.0f});
                  addProgram("Flat FFT",   {kSrcStereo, ana::kFast,  0.0f, 1000.0f, 0.0f, 150.0f, 1.0f});
                  addProgram("Slow Average", {kSrcStereo, ana::kSlow, 2.0f, 1000.0f, 0.0f, 300.0f, 1.0f});
                  addProgram("Peaks",      {kSrcStereo, ana::kPeak,  2.0f, 1000.0f, 0.0f, 150.0f, 1.0f});
                  addProgram("Max Hold",   {kSrcStereo, ana::kMax,   2.0f, 1000.0f, 0.0f, 150.0f, 1.0f});
                  addProgram("Side Check", {kSrcSide,   ana::kSlow,  2.0f, 1000.0f, 0.0f, 300.0f, 1.0f});
                  addProgram("Low End",    {kSrcMid,    ana::kSlow,  0.0f,   60.0f, 0.0f, 150.0f, 1.0f});
                  addProgram("Tuning",     {kSrcMid,    ana::kFast,  0.0f,  440.0f, 0.0f, 150.0f, 1.0f});
              }

              void prepare(double sampleRate, int maxBlockSize) override
              {
                  (void)maxBlockSize;
                  fs_ = sampleRate;
                  spec_.prepare(sampleRate);
                  for (int c = 0; c < kCurveCols; ++c)        // column centre in octaves from 1 kHz (for Slope)
                      octaves_[c] = std::log2(ana::Spectrum::kFLo / 1000.0)
                                  + (c + 0.5) / kCurveCols * std::log2(ana::Spectrum::kFHi / ana::Spectrum::kFLo);
                  scope_.clear();
                  stats_.prepare(sampleRate);
                  lastSource_ = getInt(kSource);
                  lastResponse_ = getInt(kResponse);
                  spec_.setStereo(lastSource_ == kSrcStereo);
                  spec_.setResponse(lastResponse_);
                  tickCount_ = 0;
                  numTicks_ = 0;
                  quiet_ = 0;
              }

              void reset() override
              {
                  // Called on resume and after a state / preset load: keep the measurement, and stay quiet for a
                  // moment so freshly loaded parameter values are not overwritten at once.
                  quiet_ = (int)(fs_ * 0.3);
              }

              bool formatValue(int index, float v, std::string& out) override
              {
                  char buf[64];
                  switch (index)
                  {
                      case kCursorLevel: case kPeakLevel:
                          if (v <= kLevelLo + 0.05f) { out = "-inf dB"; return true; }
                          out = clean(fmt(buf, sizeof(buf), "%.1f dB", v)); return true;
                      case kPeakFreq:
                      {
                          if (v <= 0.0f) { out = "-"; return true; }
                          const double midi = 69.0 + 12.0 * std::log2(v / 440.0);
                          int note = (int)std::lround(midi);
                          int cents = (int)std::lround((midi - note) * 100.0);
                          if (cents == 50) { cents = -50; ++note; }
                          const int octave = note / 12 - 1;
                          const char* nn = kNoteNames[((note % 12) + 12) % 12];
                          if (v < 1000.0f) std::snprintf(buf, sizeof(buf), "%.1f Hz  %s%d %+d ct", (double)v, nn, octave, cents);
                          else std::snprintf(buf, sizeof(buf), "%.0f Hz  %s%d %+d ct", (double)v, nn, octave, cents);
                          out = buf; return true;
                      }
                      case kPersist:
                          std::snprintf(buf, sizeof(buf), "%.0f ms", (double)v); out = buf; return true;
                      case kCursor:
                          if (v < 1000.0f) std::snprintf(buf, sizeof(buf), "%.0f Hz", (double)v);
                          else std::snprintf(buf, sizeof(buf), "%.2f kHz", (double)v / 1000.0);
                          out = buf; return true;
                      case kCorr:
                          if (std::fabs(v) < 0.005f) { out = "0.00"; return true; }
                          std::snprintf(buf, sizeof(buf), "%+.2f", (double)v); out = buf; return true;
                      case kBalance:
                          if (std::fabs(v) < 0.05f) { out = "C"; return true; }
                          std::snprintf(buf, sizeof(buf), "%s %.1f dB", v < 0 ? "L" : "R", std::fabs((double)v)); out = buf; return true;
                      case kSideMid:
                          if (v <= -59.95f) { out = "mono"; return true; }
                          out = clean(fmt(buf, sizeof(buf), "%.1f dB", v)); return true;
                      case kScopeLevel:
                          std::snprintf(buf, sizeof(buf), "%+.1f dB", (double)v); out = buf; return true;
                      default:
                          return false;
                  }
              }

              void process(mpc::ProcessContext& ctx) override
              {
                  const int n = ctx.numFrames;
                  const float* inL = ctx.inputs ? ctx.inputs[0] : nullptr;
                  const float* inR = (ctx.inputs && ctx.numInputs > 1) ? ctx.inputs[1] : inL;

                  // Audio passes through unchanged. With in-place processing the buffers are the same; otherwise copy.
                  for (int c = 0; c < ctx.numOutputs; ++c)
                  {
                      const float* src = (c == 0) ? inL : inR;
                      if (src && ctx.outputs[c] && ctx.outputs[c] != src) std::memcpy(ctx.outputs[c], src, sizeof(float) * (size_t)n);
                  }
                  if (!inL) return;

                  const int source = getInt(kSource);
                  if (source != lastSource_)
                  {
                      lastSource_ = source;
                      spec_.setStereo(source == kSrcStereo);
                      spec_.restart();
                  }
                  const int response = getInt(kResponse);
                  if (response != lastResponse_)
                  {
                      lastResponse_ = response;
                      spec_.setResponse(response);
                  }
                  const int rate = kRates[std::min(std::max(getInt(kRefresh), 0), 2)];
                  const int tickLen = std::max(1, (int)std::lround(fs_ / rate));

                  for (int i = 0; i < n; ++i)
                  {
                      const float l = inL[i], r = inR[i];
                      float a = l, b = 0.0f;
                      switch (source)
                      {
                          case kSrcStereo: a = l; b = r; break;
                          case kSrcMid:    a = 0.5f * (l + r); break;
                          case kSrcSide:   a = 0.5f * (l - r); break;
                          case kSrcLeft:   a = l; break;
                          default:         a = r; break;
                      }
                      if (spec_.push(a, b)) curveDirty_ = true;
                      scope_.push(l, r);
                      stats_.push(l, r);
                      if (++tickCount_ >= tickLen) { tickCount_ = 0; tick(rate); }
                  }
                  stats_.flush();
                  if (quiet_ > 0) quiet_ = std::max(0, quiet_ - n);
              }

          private:
              static mpc::PluginInfo makeInfo()
              {
                  mpc::PluginInfo i;
                  i.name = "Analysis Meter";
                  i.vendor = "gltchsqnz";
                  i.uniqueId = MPC_FOURCC('G', 'A', 'n', 'M');
                  i.version = 1000;
                  i.isInstrument = false;
                  i.numInputs = 2;
                  i.numOutputs = 2;
                  i.tailSamples = 1;
                  return i;
              }

              void reading(const char* id, const char* name, float lo, float hi, int decimals = 1)
              {
                  mpc::Param p = mpc::floatParam(id, name, lo, hi, lo, "", decimals);
                  p.automatable = false;
                  addParam(p);
              }

              static const char* fmt(char* buf, size_t size, const char* f, float v)
              {
                  std::snprintf(buf, size, f, (double)v);
                  return buf;
              }
              static std::string clean(const char* s)            // "-0.0 ..." -> "0.0 ..."
              {
                  if (s[0] == '-' && s[1] == '0' && s[2] == '.' && s[3] == '0' && (s[4] == 0 || s[4] == ' ')) return std::string(s + 1);
                  return s;
              }

              // Write a reading and tell the host when its value, quantised to `step` (the resolution shown on
              // screen), has changed (or `force`). Quantising (rather than "moved by a whole step") means the
              // screen always ends on the true value.
              void publish(int idx, float plain, float step, bool force = false)
              {
                  if (quiet_ > 0 && !force) return;
                  const mpc::Param& p = param(idx);
                  plain = std::min(std::max(plain, std::fmin(p.min, p.max)), std::fmax(p.min, p.max));
                  if (step > 0.0f) plain = std::round(plain / step) * step;
                  plain = std::min(std::max(plain, std::fmin(p.min, p.max)), std::fmax(p.min, p.max));
                  if (!force && std::fabs(get(idx) - plain) < step * 0.5f) return;
                  set(idx, plain);
                  notifyHostParameterChanged(idx);
              }

              static float dbOrFloor(double db) { return db <= -149.0 ? kLevelLo : (float)db; }

              // One screen frame
              void tick(int rate)
              {
                  ++numTicks_;
                  const double frameSec = 1.0 / rate;

                  // --- goniometer ---
                  const int persist = std::max(1, (int)std::lround(get(kPersist) * 0.001 * rate));
                  const int gm = std::min(std::max(getInt(kScopeGain), 0), 5);
                  scope_.endFrame(persist, kScopeGains[gm], frameSec);
                  for (int h = 0; h < 2; ++h)
                      for (int c = 0; c < kScopeCols; ++c)
                          publish((h ? kScopeDn0 : kScopeUp0) + c, (float)scope_.span(h, c), 1.0f);

                  // --- correlation and balance bars ---
                  publish(kCorr, (float)stats_.correlation(), 0.01f);
                  publish(kBalance, (float)stats_.balanceDb(), 0.1f);

                  // --- spectrum curve (only when a new spectrum has been computed) ---
                  if (curveDirty_)
                  {
                      curveDirty_ = false;
                      const double slope = kSlopes[std::min(std::max(getInt(kSlope), 0), 2)];
                      for (int c = 0; c < kCurveCols; ++c)
                      {
                          double db = spec_.columnDb(c) + slope * octaves_[c];
                          int h = 0;
                          if (db > kDbLo) h = (int)std::lround((db - kDbLo) / (kDbHi - kDbLo) * kCurveH);
                          h = std::min(std::max(h, 0), kCurveH);
                          if (h == 0 && db > kDbLo) h = 1;
                          publish(kCurve0 + c, (float)h, 1.0f);
                      }
                  }

                  // --- numbers, about 10 times a second ---
                  const int every = std::max(1, rate / 10);
                  if (numTicks_ % every == 0)
                  {
                      publish(kCursorLevel, dbOrFloor(spec_.levelAt(get(kCursor))), 0.1f);
                      publish(kPeakFreq, (float)spec_.peakHz(), spec_.peakHz() < 1000.0 ? 0.1f : 1.0f);
                      publish(kPeakLevel, dbOrFloor(spec_.peakDb()), 0.1f);
                      const double sm = stats_.sideMidDb();
                      publish(kSideMid, sm <= -60.0 ? -60.0f : (float)sm, 0.1f);
                      publish(kScopeLevel, (float)scope_.gainDb(), 0.1f);
                  }
              }

              ana::Spectrum spec_;
              ana::Goniometer scope_;
              ana::StereoStats stats_;
              double fs_ = 48000.0;
              int tickCount_ = 0;
              long numTicks_ = 0;
              int quiet_ = 0;
              int lastSource_ = 0, lastResponse_ = 0;
              bool curveDirty_ = false;
              double octaves_[kCurveCols] = {};
          };

          MPC_PLUGIN_ENTRY(AnalysisMeter)
          AMEOF
          mkdir -p "$(dirname "src/AnalysisDsp.h")"
          cat > "src/AnalysisDsp.h" <<'AMEOF'
          // AnalysisDsp.h - the measuring core of Analysis Meter (gltchsqnz, MIT licence)
          //
          // Three independent parts, all realtime-safe (memory is allocated in prepare(), never in process()):
          //
          //   Spectrum   FFT analyser in the manner of Voxengo SPAN.
          //              - Window: Hann, N = 8192 points (16384 above 50 kHz sample rate), hop N/8 (87.5 % overlap),
          //                so the spectrum is recomputed about 47 times a second. Each computation is spread over
          //                the following hop in small steps, so no audio block carries a CPU spike.
          //              - Stereo source: L and R go through ONE complex FFT (z = L + jR) and are separated
          //                afterwards; their powers are averaged (so anti-phase content does not cancel).
          //              - Calibration: a sine of amplitude A reads 20 log10(A) dB (0 dBFS sine = 0 dB) at any
          //                frequency. Each bin's "tone level" is the power summed over that bin and its two
          //                neighbours, divided by the Hann main-lobe energy (1.5 bins); this removes the Hann
          //                scalloping loss (up to 1.42 dB) and leaves at most ~0.1 dB error, wherever the tone falls.
          //              - Averaging (in power, per bin): Fast tau = 125 ms, Slow tau = 1 s; Peak = instant attack,
          //                20 dB/s fall; Max = hold the highest value until reset.
          //              - Display: 160 columns, log spaced 20 Hz .. 20 kHz. A column covering several bins shows the
          //                loudest; a column narrower than a bin (low end) interpolates between bins in dB.
          //              - Peak finder: loudest bin between 20 Hz and 20 kHz, refined by Gaussian (log-parabolic)
          //                interpolation, which is near exact for a Hann window (error well under 0.05 bin).
          //
          //   Goniometer M = (L + R) / 2 vertical, S = (R - L) / 2 horizontal, so a mono signal is a vertical line,
          //              L alone the left diagonal, R alone the right diagonal, anti-phase horizontal, and every
          //              unclipped signal stays inside the diamond |M| + |S| <= 1 (at 0 dB scope gain).
          //              The plot is a grid of COLS x ROWS cells per half (upper half M >= 0, lower half M < 0).
          //              Every sample marks its cell with the current frame number; a cell is lit while it was hit
          //              within the persistence time. For the screen, each column of each half is reported as the
          //              span (nearest and farthest lit row from the centre line), one film-strip frame per span.
          //
          //   Stereo     correlation E[LR] / sqrt(E[L^2] E[R^2]), balance 10 log10(E[R^2] / E[L^2]) and
          //              side / mid 10 log10(E[S^2] / E[M^2]), exponential averages with tau = 300 ms.

          #pragma once

          #include <algorithm>
          #include <cmath>
          #include <cstdint>
          #include <cstring>
          #include <vector>

          namespace ana {

          constexpr double kPi = 3.14159265358979323846;
          constexpr double kSilentDb = -200.0;

          inline double powToDb(double p) { return p > 1e-20 ? 10.0 * std::log10(p) : kSilentDb; }

          // --------------------------------------------------------------------------------------------
          // Radix-2 complex FFT (in place, float, precomputed twiddles and bit reversal)
          // --------------------------------------------------------------------------------------------
          class Fft
          {
          public:
              void prepare(int n)
              {
                  n_ = n;
                  bits_ = 0;
                  while ((1 << bits_) < n) ++bits_;
                  cosT_.resize((size_t)n / 2);
                  sinT_.resize((size_t)n / 2);
                  for (int i = 0; i < n / 2; ++i)
                  {
                      cosT_[(size_t)i] = (float)std::cos(2.0 * kPi * i / n);
                      sinT_[(size_t)i] = (float)-std::sin(2.0 * kPi * i / n);
                  }
                  rev_.resize((size_t)n);
                  for (int i = 0; i < n; ++i)
                  {
                      int r = 0;
                      for (int b = 0; b < bits_; ++b) if (i & (1 << b)) r |= 1 << (bits_ - 1 - b);
                      rev_[(size_t)i] = r;
                  }
              }

              // The transform in steps, so it can be spread over several audio blocks:
              // reorder(), then pass(0) .. pass(passes() - 1).
              int passes() const { return bits_; }

              void reorder(float* re, float* im) const
              {
                  for (int i = 0; i < n_; ++i)
                  {
                      const int r = rev_[(size_t)i];
                      if (r > i) { std::swap(re[i], re[r]); std::swap(im[i], im[r]); }
                  }
              }

              void pass(float* re, float* im, int p) const
              {
                  const int len = 2 << p, half = len >> 1, step = n_ / len;
                  for (int i = 0; i < n_; i += len)
                  {
                      for (int j = 0; j < half; ++j)
                      {
                          const float wr = cosT_[(size_t)(j * step)], wi = sinT_[(size_t)(j * step)];
                          const int a = i + j, b = a + half;
                          const float tr = re[b] * wr - im[b] * wi;
                          const float ti = re[b] * wi + im[b] * wr;
                          re[b] = re[a] - tr; im[b] = im[a] - ti;
                          re[a] += tr;        im[a] += ti;
                      }
                  }
              }

              void run(float* re, float* im) const
              {
                  reorder(re, im);
                  for (int p = 0; p < bits_; ++p) pass(re, im, p);
              }

              int size() const { return n_; }

          private:
              int n_ = 0, bits_ = 0;
              std::vector<float> cosT_, sinT_;
              std::vector<int> rev_;
          };

          // --------------------------------------------------------------------------------------------
          // Spectrum
          // --------------------------------------------------------------------------------------------
          enum Response { kFast = 0, kSlow, kPeak, kMax };

          class Spectrum
          {
          public:
              static constexpr int kCols = 160;
              static constexpr double kFLo = 20.0, kFHi = 20000.0;

              void prepare(double fs)
              {
                  fs_ = fs;
                  n_ = fs > 50000.0 ? 16384 : 8192;
                  hop_ = n_ / 8;
                  nb_ = n_ / 2 + 1;
                  fft_.prepare(n_);
                  win_.resize((size_t)n_);
                  for (int i = 0; i < n_; ++i) win_[(size_t)i] = (float)(0.5 - 0.5 * std::cos(2.0 * kPi * i / n_));   // periodic Hann
                  bufL_.assign((size_t)n_, 0.0f);
                  bufR_.assign((size_t)n_, 0.0f);
                  re_.assign((size_t)n_, 0.0f);
                  im_.assign((size_t)n_, 0.0f);
                  avg_.assign((size_t)nb_, 0.0);
                  tone_.assign((size_t)nb_, 0.0);
                  colDb_.assign(kCols, kSilentDb);
                  // power of a full-scale sine in one bin: (A N / 4)^2 per channel -> normalise to amplitude^2
                  norm_ = 16.0 / ((double)n_ * (double)n_);
                  df_ = fs / n_;
                  const double frameRate = fs / hop_;
                  aFast_ = 1.0 - std::exp(-1.0 / (0.125 * frameRate));
                  aSlow_ = 1.0 - std::exp(-1.0 / (1.0 * frameRate));
                  fallMul_ = std::pow(10.0, -(20.0 / frameRate) / 10.0);
                  // column edges in bins
                  for (int c = 0; c <= kCols; ++c)
                      edge_[c] = kFLo * std::pow(kFHi / kFLo, (double)c / kCols) / df_;
                  for (int c = 0; c < kCols; ++c)
                      centre_[c] = kFLo * std::pow(kFHi / kFLo, (c + 0.5) / kCols) / df_;
                  pos_ = 0;
                  fill_ = 0;
                  step_ = -1;
                  clear();
              }

              void clear()
              {
                  std::fill(avg_.begin(), avg_.end(), 0.0);
                  std::fill(tone_.begin(), tone_.end(), 0.0);
                  std::fill(colDb_.begin(), colDb_.end(), kSilentDb);
                  first_ = true;
                  peakHz_ = 0.0;
                  peakDb_ = kSilentDb;
              }

              void setResponse(int r) { if (r != resp_) { resp_ = r; clear(); } }

              // a new source: forget the old signal completely (the window would otherwise still hold it)
              void restart()
              {
                  std::fill(bufL_.begin(), bufL_.end(), 0.0f);
                  std::fill(bufR_.begin(), bufR_.end(), 0.0f);
                  fill_ = 0;
                  step_ = -1;
                  clear();
              }

              // One stereo frame (for a mono source: the signal as l, and r = 0 with setStereo(false)).
              // Returns true when a new spectrum is ready.
              //
              // CPU spikes: computing a whole spectrum at once would put all the work into one audio block, so
              // each analysis is split into small steps (window copy, bit reversal, one FFT pass per step,
              // averaging, display), one step every kSlice samples. All steps finish well within one hop.
              bool push(float l, float r)
              {
                  bufL_[(size_t)pos_] = l;
                  bufR_[(size_t)pos_] = r;
                  if (++pos_ == n_) pos_ = 0;
                  bool done = false;
                  if (++fill_ >= hop_)
                  {
                      fill_ = 0;
                      if (step_ >= 0) while (step_ >= 0) done |= doStep();     // (safety) finish an unfinished job
                      start_ = pos_;
                      step_ = 0;
                      done |= doStep();                                         // copies the oldest half at once
                  }
                  else if (step_ >= 0 && fill_ % kSlice == 0)
                      done |= doStep();
                  return done;
              }

              void setStereo(bool s) { stereo_ = s; }

              // results
              double columnDb(int c) const { return colDb_[(size_t)c]; }
              double peakHz() const { return peakHz_; }
              double peakDb() const { return peakDb_; }
              double fftSize() const { return n_; }
              double binHz() const { return df_; }

              // tone level (dB) at any frequency: tone levels interpolated in dB between the two nearest bins
              double levelAt(double hz) const
              {
                  const double b = hz / df_;
                  int k = (int)std::floor(b);
                  if (k < 1) k = 1;
                  if (k > nb_ - 3) k = nb_ - 3;
                  const double t = std::min(1.0, std::max(0.0, b - k));
                  const double d0 = powToDb(tone_[(size_t)k]), d1 = powToDb(tone_[(size_t)k + 1]);
                  if (d0 <= kSilentDb + 1.0 && d1 <= kSilentDb + 1.0) return kSilentDb;
                  return d0 + (d1 - d0) * t;
              }

          private:
              static constexpr int kSlice = 32;     // samples between analysis steps (hop / kSlice >= 32 steps)

              // Runs the next step of the current analysis; returns true after the last one.
              bool doStep()
              {
                  const int passes = fft_.passes();
                  const int s = step_;
                  if (s == 0 || s == 1)
                  {
                      // window copy, oldest half first (it is the half the incoming samples overwrite next)
                      const int i0 = s == 0 ? 0 : n_ / 2, i1 = s == 0 ? n_ / 2 : n_;
                      for (int i = i0; i < i1; ++i)
                      {
                          int j = start_ + i;
                          if (j >= n_) j -= n_;
                          const float w = win_[(size_t)i];
                          re_[(size_t)i] = bufL_[(size_t)j] * w;
                          im_[(size_t)i] = bufR_[(size_t)j] * w;
                      }
                  }
                  else if (s == 2)
                      fft_.reorder(re_.data(), im_.data());
                  else if (s < 3 + passes)
                      fft_.pass(re_.data(), im_.data(), s - 3);
                  else if (s == 3 + passes)
                      binsPart(0, nb_ / 2);
                  else if (s == 4 + passes)
                      binsPart(nb_ / 2, nb_);
                  else
                  {
                      finish();
                      step_ = -1;
                      return true;
                  }
                  ++step_;
                  return false;
              }

              void binsPart(int k0, int k1)
              {
                  const double a = resp_ == kSlow ? aSlow_ : aFast_;
                  const double fallMul = fallMul_;
                  for (int k = k0; k < k1; ++k)
                  {
                      double p;
                      const float zr = re_[(size_t)k], zi = im_[(size_t)k];
                      if (stereo_)
                      {
                          const int m = (n_ - k) & (n_ - 1);
                          const float cr = re_[(size_t)m], ci = -im_[(size_t)m];          // conj(Z[N-k])
                          // X_L = (Z + conj) / 2, X_R = (Z - conj) / 2j
                          const double lr = 0.5 * (zr + cr), li = 0.5 * (zi + ci);
                          const double rr = 0.5 * (zi - ci), ri = -0.5 * (zr - cr);
                          p = 0.5 * ((lr * lr + li * li) + (rr * rr + ri * ri));
                      }
                      else
                          p = (double)zr * zr + (double)zi * zi;
                      p *= norm_;
                      double& v = avg_[(size_t)k];
                      switch (resp_)
                      {
                          case kFast: case kSlow: v = first_ ? p : v + a * (p - v); break;
                          case kPeak: v = std::max(p, v * fallMul); break;
                          default:    v = std::max(p, v); break;
                      }
                  }
              }

              void finish()
              {
                  first_ = false;
                  // tone level: 3-bin power sum / Hann main-lobe energy (1.5)
                  tone_[0] = (avg_[0] + avg_[1]) / 1.5;
                  for (int k = 1; k < nb_ - 1; ++k)
                      tone_[(size_t)k] = (avg_[(size_t)k - 1] + avg_[(size_t)k] + avg_[(size_t)k + 1]) / 1.5;
                  tone_[(size_t)nb_ - 1] = (avg_[(size_t)nb_ - 2] + avg_[(size_t)nb_ - 1]) / 1.5;

                  // display columns
                  for (int c = 0; c < kCols; ++c)
                  {
                      const int k0 = (int)std::ceil(edge_[c]), k1 = (int)std::ceil(edge_[c + 1]) - 1;
                      if (k1 >= k0)
                      {
                          double m = 0.0;
                          for (int k = k0; k <= std::min(k1, nb_ - 1); ++k) m = std::max(m, tone_[(size_t)k]);
                          colDb_[(size_t)c] = powToDb(m);
                      }
                      else
                          colDb_[(size_t)c] = levelAt(centre_[c] * df_);
                  }

                  // peak finder (20 Hz .. 20 kHz, below Nyquist)
                  const int kLo = std::max(2, (int)std::ceil(kFLo / df_));
                  const int kHi = std::min(nb_ - 3, (int)std::floor(kFHi / df_));
                  int best = -1;
                  double bp = 0.0;
                  for (int k = kLo; k <= kHi; ++k)
                      if (avg_[(size_t)k] > bp) { bp = avg_[(size_t)k]; best = k; }
                  if (best < 0 || powToDb(tone_[(size_t)best]) < -120.0)
                  {
                      peakHz_ = 0.0;
                      peakDb_ = kSilentDb;
                      return;
                  }
                  const double l0 = std::log(std::max(avg_[(size_t)best - 1], 1e-30));
                  const double l1 = std::log(std::max(avg_[(size_t)best], 1e-30));
                  const double l2 = std::log(std::max(avg_[(size_t)best + 1], 1e-30));
                  const double den = l0 - 2.0 * l1 + l2;
                  double d = den < 0.0 ? 0.5 * (l0 - l2) / den : 0.0;
                  d = std::min(0.5, std::max(-0.5, d));
                  peakHz_ = (best + d) * df_;
                  peakDb_ = powToDb(tone_[(size_t)best]);
              }

              double fs_ = 48000.0, df_ = 5.86, norm_ = 1.0;
              int n_ = 8192, hop_ = 1024, nb_ = 4097;
              int pos_ = 0, fill_ = 0;
              int resp_ = kFast;
              bool stereo_ = true, first_ = true;
              double aFast_ = 0.1, aSlow_ = 0.02, fallMul_ = 0.9;
              int step_ = -1, start_ = 0;
              double edge_[kCols + 1] = {}, centre_[kCols] = {};
              double peakHz_ = 0.0, peakDb_ = kSilentDb;
              Fft fft_;
              std::vector<float> win_, bufL_, bufR_, re_, im_;
              std::vector<double> avg_, tone_, colDb_;
          };

          // --------------------------------------------------------------------------------------------
          // Goniometer
          // --------------------------------------------------------------------------------------------
          class Goniometer
          {
          public:
              static constexpr int kCols = 51;          // odd: the centre column holds mono
              static constexpr int kRows = 28;          // rows per half
              static constexpr int kFrames = 1 + kRows * (kRows + 1) / 2;    // film-strip frames per column

              void clear()
              {
                  std::fill(&hit_[0][0][0], &hit_[0][0][0] + 2 * kCols * kRows, -1000000);
                  env_ = 0.0;
              }

              // one sample pair; gain = linear scope gain
              void push(float l, float r)
              {
                  const float al = std::fabs(l), ar = std::fabs(r);
                  const float mx = al > ar ? al : ar;
                  if (mx > winPeak_) winPeak_ = mx;
                  if (mx < 1e-5f) return;                         // below -100 dBFS: nothing to draw
                  const float m = (l + r) * 0.5f * gain_, s = (r - l) * 0.5f * gain_;
                  int c = (int)((s + 1.0f) * 0.5f * kCols);
                  c = c < 0 ? 0 : (c >= kCols ? kCols - 1 : c);
                  const int half = m >= 0.0f ? 0 : 1;
                  int row = (int)(std::fabs(m) * kRows);
                  row = row >= kRows ? kRows - 1 : row;
                  hit_[half][c][row] = tick_;
              }

              // called once per display frame. persistTicks >= 1. gainMode: 0 = auto, else fixed linear gain.
              void endFrame(int persistTicks, double fixedGain, double frameSeconds)
              {
                  // spans of lit rows per column and half
                  for (int h = 0; h < 2; ++h)
                      for (int c = 0; c < kCols; ++c)
                      {
                          int lo = -1, hi = -1;
                          for (int r = 0; r < kRows; ++r)
                              if (tick_ - hit_[h][c][r] < persistTicks) { if (lo < 0) lo = r; hi = r; }
                          span_[h][c] = lo < 0 ? 0 : 1 + hi * (hi + 1) / 2 + lo;
                      }
                  ++tick_;
                  // auto gain: follow the peak (instant up, 10 dB/s down) and keep it at 90 % of full scale
                  const double fall = std::pow(10.0, -10.0 * frameSeconds / 20.0);
                  env_ = std::max((double)winPeak_, env_ * fall);
                  winPeak_ = 0.0f;
                  double g;
                  if (fixedGain > 0.0) g = fixedGain;
                  else g = env_ > 1e-6 ? std::min(64.0, std::max(1.0, 0.9 / env_)) : gain_;
                  gain_ = (float)g;
              }

              int span(int half, int col) const { return span_[half][col]; }
              double gainDb() const { return 20.0 * std::log10(gain_); }

          private:
              int hit_[2][kCols][kRows];
              int span_[2][kCols] = {};
              int tick_ = 0;
              float gain_ = 1.0f, winPeak_ = 0.0f;
              double env_ = 0.0;
          };

          // --------------------------------------------------------------------------------------------
          // Stereo statistics
          // --------------------------------------------------------------------------------------------
          class StereoStats
          {
          public:
              void prepare(double fs) { a_ = 1.0 - std::exp(-1.0 / (0.3 * fs)); clear(); }
              void clear() { ll_ = rr_ = lr_ = mm_ = ss_ = 0.0; }

              void push(float l, float r)
              {
                  const double L = l, R = r, M = 0.5 * (L + R), S = 0.5 * (L - R);
                  ll_ += a_ * (L * L - ll_);
                  rr_ += a_ * (R * R - rr_);
                  lr_ += a_ * (L * R - lr_);
                  mm_ += a_ * (M * M - mm_);
                  ss_ += a_ * (S * S - ss_);
              }
              void flush()   // keep the averages out of the denormal range during silence
              {
                  if (ll_ < 1e-30) ll_ = 0.0;
                  if (rr_ < 1e-30) rr_ = 0.0;
                  if (std::fabs(lr_) < 1e-30) lr_ = 0.0;
                  if (mm_ < 1e-30) mm_ = 0.0;
                  if (ss_ < 1e-30) ss_ = 0.0;
              }

              bool silent() const { return ll_ < 1e-10 && rr_ < 1e-10; }          // below -100 dBFS
              double correlation() const
              {
                  const double d = ll_ * rr_;
                  return d > 1e-24 ? std::max(-1.0, std::min(1.0, lr_ / std::sqrt(d))) : 0.0;
              }
              double balanceDb() const          // + = right louder
              {
                  if (silent()) return 0.0;
                  return powToDb(std::max(rr_, 1e-20)) - powToDb(std::max(ll_, 1e-20));
              }
              double sideMidDb() const { return silent() ? kSilentDb : powToDb(ss_) - powToDb(std::max(mm_, 1e-20)); }

          private:
              double a_ = 0.0001, ll_ = 0, rr_ = 0, lr_ = 0, mm_ = 0, ss_ = 0;
          };

          } // namespace ana
          AMEOF
          mkdir -p "$(dirname "make_silver.py")"
          cat > "make_silver.py" <<'AMEOF'
          #!/usr/bin/env python3
          """Analysis Meter - brushed silver skin.

          Same design language as Sync Filter, Comb Filter, Utility Meter and Glitch FX: a brushed-aluminium version
          of the SDK's UI kit (knobs, blue segment buttons), the gltchsqnz logo (about 1.5 cm) bottom right with the
          bold title to its left, and the button names painted in black under the buttons. On top of the SDK's
          gen_ui.py output it adds two pages:

            SPECTRUM  an FFT spectrum curve (160 film-strip columns, each a translucent blue slice with a bright top
                      edge, over a dB / frequency grid), a cursor line (a Slider bound to Cursor, so the plot can be
                      touched to move it), and readouts for the cursor and the loudest frequency (with note name).
            STEREO    a goniometer (51 columns x 2 halves of film strips over a diamond grid with L / R / M / S
                      markings), a phase correlation bar (-1 .. +1), a balance bar (L 24 .. R 24 dB) and readings
                      for side / mid and the scope gain.

          The meters are film-strip images and labels bound to the plugin's read-only "reading" parameters, which
          the plugin writes at the Refresh rate (numbers about 10 times a second). All text drawn by the MPC uses
          its own Titillium Web; painted text (title, button names, scales) is pre-rendered Poppins Bold.

          The result goes to ./skins/, which build.py copies verbatim into "Plugin Skins/".

          Needs build/params.json first:   python tools/build.py "plugins/Analysis Meter" --target native
          Run from anywhere:               python "plugins/Analysis Meter/make_silver.py"

