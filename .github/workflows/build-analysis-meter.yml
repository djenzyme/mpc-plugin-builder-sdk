          # --------------------------------------------------------------------------------------------
          # Brushed-metal noise (deterministic: same skin on every build)
          # --------------------------------------------------------------------------------------------
          def h01(n):
              """Integer hash -> 0..1."""
              n = (int(n) * 0x9E3779B1) & 0xFFFFFFFF
              n ^= n >> 15
              n = (n * 0x85EBCA77) & 0xFFFFFFFF
              n ^= n >> 13
              return (n & 0xFFFF) / 65535.0


          def streak(x, y, seed):
              """About -1.2 .. +1.2: long thin horizontal brush lines, broken into short runs."""
              row = h01(int(y) * 977 + seed)
              run = h01(int(y) * 131 + (int(x) // 41) * 7919 + seed + 5)
              fine = h01(int(x) * 31 + int(y) * 1009 + seed + 11)
              return (row - 0.5) * 1.2 + (run - 0.5) * 0.9 + (fine - 0.5) * 0.25


          def clamp8(v):
              return max(0, min(255, int(round(v))))


          def shade(c, d):
              return (clamp8(c[0] + d), clamp8(c[1] + d), clamp8(c[2] + d), c[3])


          def brushed(y0, y1, c0, c1, seed, amp=7.0):
              """Vertical gradient c0 -> c1 with horizontal brushing on top."""
              base = K.vgrad(y0, y1, c0, c1)
              return lambda px, py: shade(base(px, py), streak(px, py, seed) * amp)


          # --------------------------------------------------------------------------------------------
          # Drawing overrides (same geometry as the SDK kit, silver surfaces) - identical to the other plugins
          # --------------------------------------------------------------------------------------------
          def turned(cx, cy, radius, seed=3):
              """Turned-aluminium knob face: concentric brush lines and a two-lobed highlight."""
              light = -0.75 * math.pi

              def f(px, py):
                  dx, dy = px - cx, py - cy
                  rad = math.hypot(dx, dy)
                  lobes = math.cos(2.0 * (math.atan2(dy, dx) - light))
                  ring = h01(int(rad * 2.4) + seed * 101) - 0.5
                  fine = h01(int(px * 13) + int(py * 29) * 7 + seed) - 0.5
                  lum = 188 + 30 * lobes * (0.35 + 0.65 * min(1.0, rad / radius)) + ring * 16 + fine * 4
                  return (clamp8(lum), clamp8(lum + 1), clamp8(lum + 4), 255)   # a touch cool
              return f


          def knob_static(size, th):
              c = K.Canvas(size, size)
              cx = cy = size / 2.0
              r = size / 2.0
              ring_out, ring_in = r - 1.0, r - max(4.0, size * 0.1)
              body_r = ring_in - max(3.0, size * 0.07)
              K.arc(c, cx, cy, ring_in, ring_out, -K.SWEEP / 2.0, K.SWEEP / 2.0, th["track"])
              K.circle(c, cx, cy + 1.5, body_r + 1.0, K.with_alpha(th["outline"], 150))
              K.circle(c, cx, cy, body_r, K.light_rim(cx, cy, th["bodyLight"], th["bodyDark"]))
              face_r = body_r - max(1.5, size * 0.035)
              K.circle(c, cx, cy, face_r, turned(cx, cy, face_r))
              return c, (cx, cy, ring_in, ring_out, body_r, face_r)


          def fader_cap(g, th):
              w, h = g["cap_len"], g["cap_th"]
              c = K.Canvas(w + 2, h + 4)
              K.rrect(c, 1, 3, w, h, 5.0, K.with_alpha(th["outline"], 170))
              K.rrect(c, 1, 1, w, h, 5.0, brushed(1, 1 + h, th["thumbLight"], th["thumbDark"], 23, 6.0))
              K.rrect_outline(c, 1, 1, w, h, 5.0, 1.0, K.with_alpha(th["outline"], 180))
              cx = 1 + w / 2.0
              K.capsule(c, cx, 1 + h * 0.28, cx, 1 + h * 0.72, 2.0, th["accentDark"])
              K.capsule(c, cx, 1 + h * 0.28, cx, 1 + h * 0.72, 1.4, th["accent"])
              return c


          def render_button(th, on, w=120, h=44, led=True):
              """Blue brushed key: deep blue at rest, bright lit blue when selected."""
              c = K.Canvas(w, h)
              rad = 8.0
              K.rrect(c, 1, 3, w - 2, h - 4, rad, K.with_alpha(th["outline"], 150))
              top, bottom = BTN_ON if on else BTN_OFF
              K.rrect(c, 1, 1, w - 2, h - 4, rad, brushed(1, h - 3, top, bottom, 17, 6.0))
              K.rrect_outline(c, 1, 1, w - 2, h - 4, rad, 2.0 if on else 1.0, BTN_EDGE_ON if on else BTN_EDGE_OFF)
              if on and not led:
                  K.rrect(c, 10, h - 9, w - 20, 3, 1.5, BTN_EDGE_ON)
              if led:
                  lx, ly, lw, lh = 11, (h - 4) / 2.0 + 1 - 9, 6, 18
                  if on:
                      K.rrect(c, lx - 3, ly - 3, lw + 6, lh + 6, 6.0, th["accentGlow"])
                  K.rrect(c, lx, ly, lw, lh, 3.0, BTN_EDGE_ON if on else th["ledOff"])
              return c.rows(), w


          # --------------------------------------------------------------------------------------------
          # Control layout: one centred row of controls along the top of each page
          # --------------------------------------------------------------------------------------------
          GRID_GAP = gen_ui.SLOT_X[1] - gen_ui.SLOT_X[0] - gen_ui.SLOT_W      # the grid's normal gap (42 px)
          SEG_Y = 46          # top of the segment buttons inside their slot (the SDK uses 54); leaves room for the names below


          def slot_positions(page):
              """[(control index, x, y)] for the controls in use. Each page holds one row of up to four controls."""
              idx = [i for i, c in enumerate(page.controls) if c.widget != "empty"]
              total = len(idx) * gen_ui.SLOT_W + max(0, len(idx) - 1) * GRID_GAP
              x0 = (gen_ui.SCREEN_W - total) // 2
              return [(i, x0 + j * (gen_ui.SLOT_W + GRID_GAP), TOP_Y) for j, i in enumerate(idx)]


          def radio_component(style, overlay_name, n):
              """gen_ui.radio_component with the segment buttons raised to SEG_Y so their names fit inside the slot."""
              width, xs = gen_ui.SEGMENTS[n]
              children = [gen_ui.focus_child(style),
                          gen_ui.entry("name", "Label", gen_ui.label_data("Name", style["muted"], 24.0), "15 8 248 34",
                                       "No", "Show", "Always")]
              for i, x in enumerate(xs):
                  children.append(gen_ui.entry("seg %d" % i, "Button",
                                               gen_ui.button_data("seg%d_on.png" % n, "seg%d_off.png" % n, i, n),
                                               "%d %d %d 40" % (x, SEG_Y, width), "No", "Show", "Always"))
              return gen_ui.component_definition(gen_ui.control_actions(overlay_name, double_click=False), children,
                                                 "00000000")


          PARAMS = None       # gen_ui.ParamTable, set in main()


          def handle(name):
              return PARAMS.lookup(name, "make_silver").handle


          def tab_component(page, style):
              """The page's controls (no on-button caption labels: the names are painted in the background),
              plus the page's meters."""
              children = []
              for i, x, y in slot_positions(page):
                  ctl = page.controls[i]
                  bounds = "%d %d %d %d" % (x, y, gen_ui.SLOT_W, gen_ui.SLOT_H)
                  children.append(gen_ui.entry(ctl.param.name, ctl.definition,
                                               gen_ui.obj(("version", 1), ("handleName", "Data")), bounds,
                                               "Yes", "Hide", "Always", remap=[("Data", ctl.param.handle)]))
              if page.name == "SPECTRUM":
                  children += spectrum_entries()
              elif page.name == "STEREO":
                  children += stereo_entries()
              return gen_ui.component_definition([], children, style["background"], bg_image=page.background)


          def qlink_rects(page, groups="columns"):
              """One Q-Link rectangle around the page's row of controls."""
              pos = [(x, y) for i, x, y in slot_positions(page) if page.controls[i].param is not None]
              if not pos:
                  return []
              pad = gen_ui.QLINK_PAD
              x = max(min(p[0] for p in pos) - pad, 2)
              y = max(pos[0][1] - pad, 2)
              x2 = min(max(p[0] for p in pos) + gen_ui.SLOT_W + pad, gen_ui.SCREEN_W - 2)
              y2 = min(pos[0][1] + gen_ui.SLOT_H + pad, gen_ui.SCREEN_H - 2)
              return ["%d %d %d %d" % (x, y, x2 - x, y2 - y)]


          _orig_build_qlinks = gen_ui.build_qlinks
          CONTROLS = ("Source", "Response", "Slope", "Cursor", "Scope Gain", "Persistence", "Refresh")


          def build_qlinks(pages, params, groups="columns"):
              """As gen_ui, but in Program Mode the knobs only reach the controls (never the read-only readings)."""
              q = _orig_build_qlinks(pages, params, groups)
              idx = [int(handle(n).split()[-1]) for n in CONTROLS]
              for i, (k, _v) in enumerate(q):
                  if k == "Program Mode Q-Links":
                      q[i] = (k, gen_ui.Obj(("Q-Link %d" % (n + 1), idx[n] if n < len(idx) else -1) for n in range(16)))
              return q


          # --------------------------------------------------------------------------------------------
          # Page widgets
          # --------------------------------------------------------------------------------------------
          def rect(x, y, w, h):
              return "%d %d %d %d" % (x, y, w, h)


          def text_style(colour, height, style="Regular", just="left verticallyCentred"):
              return gen_ui.obj(("version", 1),
                                ("font", gen_ui.obj(("version", 1), ("name", gen_ui.FONT_NAME), ("style", style),
                                                    ("height", float(height)))),
                                ("colour", colour), ("justification", just), ("case", "Original"))


          def label(name, kind, hname, bounds, colour, height, style="Regular", just="left verticallyCentred",
                    text=None, visible=None):
              """A Label bound straight to a handle (kind Name / Value), or fixed text (kind Text).
              visible: an extra handle (e.g. IndexedEnabling/...) that hides the label while it is invalid."""
              pairs = [("version", 1), ("textStyle", text_style(colour, height, style, just)), ("type", kind),
                       ("handleName", hname)]
              if text is not None:
                  pairs.append(("text", text))
              return gen_ui.entry(name, "Label", gen_ui.Obj(pairs), bounds, "No", "Hide" if visible else "Show", "Always",
                                  invalidating=[visible] if visible else None)


          def filmstrip(name, image, frames, hname, bounds, visible=None):
              data = gen_ui.obj(("version", 2), ("imageType", "FilmStrip"), ("colour", "0"), ("image", image),
                                ("numFrames", frames), ("handleName", hname))
              return gen_ui.entry(name, "Image", data, bounds, "No", "Show", "Always",
                                  invalidating=[visible] if visible else None)


          def picture(name, image, bounds):
              data = gen_ui.obj(("version", 2), ("imageType", "Regular"), ("colour", "0"), ("image", image))
              return gen_ui.entry(name, "Image", data, bounds, "No", "Show", "Always")


          def cursor_slider(bounds):
              """The cursor line: a TrackAndThumb slider bound to Cursor (a log parameter, so its normalised value
              is the position on the log frequency axis). Touching the plot moves the cursor."""
              data = gen_ui.obj(("version", 3), ("sliderType", "TrackAndThumb"), ("direction", "Horizontal"),
                                ("thumbImage", "am_cursor.png"), ("thumbTrackVisible", False), ("revealedImage", ""),
                                ("handleName", "Data"))
              return gen_ui.entry("cursor line", "Slider", data, bounds, "No", "Show", "Always",
                                  remap=[("Data", handle("Cursor"))])


          def spectrum_entries():
              e = []
              for c in range(CURVE_COLS):
                  e.append(filmstrip("curve %d" % (c + 1), "am_column.png", CURVE_H + 1, handle("Curve %d" % (c + 1)),
                                     rect(PLOT_X + c * COL_W, PLOT_Y, COL_W, CURVE_H)))
              # the thumb's centre travels from half a thumb inside each end, so the bounds reach half a thumb out
              e.append(cursor_slider(rect(PLOT_X - CURSOR_W // 2 - 1, PLOT_Y, PLOT_W + CURSOR_W + 1, CURVE_H)))

              # readouts under the plot
              x, y, w, h = CUR_BOX
              e.append(label("cursor title", "Text", "Data", rect(x + 16, y + 8, 160, 26), LCD_MUTED, 20, "SemiBold",
                             text="CURSOR"))
              e.append(label("cursor freq", "Value", handle("Cursor"), rect(x + w - 216, y + 8, 200, 26), LCD_TEXT, 22,
                             "SemiBold", "right verticallyCentred"))
              e.append(label("cursor level", "Value", handle("Cursor Level"), rect(x + 10, y + 40, w - 20, 92), LCD_TEXT,
                             64, "SemiBold", "horizontallyCentred verticallyCentred"))
              x, y, w, h = PEAK_BOX
              e.append(label("peak title", "Text", "Data", rect(x + 16, y + 8, 160, 26), LCD_MUTED, 20, "SemiBold",
                             text="PEAK"))
              e.append(label("peak level", "Value", handle("Peak Level"), rect(x + w - 216, y + 8, 200, 26), LCD_TEXT, 22,
                             "SemiBold", "right verticallyCentred"))
              e.append(label("peak freq", "Value", handle("Peak Freq"), rect(x + 10, y + 40, w - 20, 92), LCD_TEXT, 40,
                             "SemiBold", "horizontallyCentred verticallyCentred"))
              return e


          def bar_rect(panel_box, segs, pitch):
              px, py, pw, _ = panel_box
              w = segs * pitch
              return rect(px + (pw - w) // 2, py + 40, w, BAR_H)


          def stereo_entries():
              e = []
              for c in range(SC_COLS):
                  x = SC_X + c * SC_COL_W
                  e.append(filmstrip("scope up %d" % (c + 1), "am_scope_up.png", SC_FRAMES, handle("Scope Up %d" % (c + 1)),
                                     rect(x, SC_Y, SC_COL_W, SC_HALF)))
                  e.append(filmstrip("scope dn %d" % (c + 1), "am_scope_dn.png", SC_FRAMES, handle("Scope Dn %d" % (c + 1)),
                                     rect(x, SC_Y + SC_HALF, SC_COL_W, SC_HALF)))
              # correlation
              x, y, w, h = CORR_P
              e.append(label("corr title", "Text", "Data", rect(x + 16, y + 6, 260, 26), LCD_MUTED, 20, "SemiBold",
                             text="PHASE CORRELATION"))
              e.append(label("corr value", "Value", handle("Correlation"), rect(x + w - 156, y + 6, 140, 26), LCD_TEXT, 22,
                             "SemiBold", "right verticallyCentred"))
              e.append(filmstrip("corr bar", "am_corr.png", CORR_FRAMES, handle("Correlation"),
                                 bar_rect(CORR_P, CORR_SEGS, CORR_PITCH)))
              # balance
              x, y, w, h = BAL_P
              e.append(label("bal title", "Text", "Data", rect(x + 16, y + 6, 260, 26), LCD_MUTED, 20, "SemiBold",
                             text="BALANCE"))
              e.append(label("bal value", "Value", handle("Balance"), rect(x + w - 156, y + 6, 140, 26), LCD_TEXT, 22,
                             "SemiBold", "right verticallyCentred"))
              e.append(filmstrip("bal bar", "am_balance.png", BAL_FRAMES, handle("Balance"),
                                 bar_rect(BAL_P, BAL_SEGS, BAL_PITCH)))
              # readings
              x, y, w, h = INFO_P
              cw = (w - 32) // 2
              for col, name in enumerate(("Side / Mid", "Scope Level")):
                  cx = x + 16 + col * cw
                  hd = handle(name)
                  e.append(label(name + " name", "Name", hd, rect(cx + 8, y + 12, cw - 16, 24), INK_MUTED, 20))
                  e.append(label(name + " value", "Value", hd, rect(cx + 8, y + 38, cw - 16, 40), INK, 32, "SemiBold"))
              return e


          # --------------------------------------------------------------------------------------------
          # Images
          # --------------------------------------------------------------------------------------------
          # --------------------------------------------------------------------------------------------
          # Images
          # --------------------------------------------------------------------------------------------
          def write_png_rgba(path, width, rows):
              def chunk(tag, data):
                  body = tag + data
                  return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)
              raw = b"".join(b"\0" + bytes(r) for r in rows)
              png = b"\x89PNG\r\n\x1a\n"
              png += chunk(b"IHDR", struct.pack(">IIBBBBB", width, len(rows), 8, 6, 0, 0, 0))
              png += chunk(b"IDAT", zlib.compress(raw, 9))
              png += chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)


          def canvas_rows(c):
              return [bytearray(r) for r in c.rows()]


          def make_column_strip(path):
              """CURVE_H + 1 frames of one spectrum column: frame k = filled k px from the bottom, translucent blue
              (stronger towards the top of the plot) with a 2 px bright edge on top. All 160 columns share it."""
              w, h = COL_W, CURVE_H
              fill = []
              for y in range(h):
                  a = 0.16 + 0.42 * (1.0 - y / float(h - 1))          # top of the plot 0.58, bottom 0.16
                  fill.append(bytes(TRACE + (clamp8(a * 255),)) * w)
              edge = bytes(TRACE_HI + (255,)) * w
              under = bytes((120, 182, 255, 235)) * w
              empty = bytes(w * 4)
              rows = []
              for k in range(h + 1):
                  top = h - k
                  for y in range(h):
                      if y < top:
                          rows.append(empty)
                      elif y == top:
                          rows.append(edge)
                      elif y == top + 1:
                          rows.append(under if k >= 3 else edge)
                      else:
                          rows.append(fill[y])
              write_png_rgba(path, w, rows)


          def make_cursor(path):
              """The cursor line (Slider thumb): a 1 px amber line down the plot with a small marker at the top."""
              w, h = CURSOR_W, CURVE_H
              c = K.Canvas(w, h)
              cx = w // 2
              K.rrect(c, cx - 1, 0, 3, h, 0.0, CURSOR_COL + (60,))
              K.rrect(c, cx, 0, 1, h, 0.0, CURSOR_COL + (230,))
              for y in range(6):                                   # small downward triangle
                  half = (6 - y) * 0.75
                  K.rrect(c, cx + 0.5 - half, y, 2 * half, 1, 0.0, CURSOR_COL + (255,))
              write_png_rgba(path, w, c.rows())


          def span_rows(lo, hi, flip):
              """One scope column (SC_COL_W x SC_HALF) with rows lo .. hi lit (row 0 next to the centre line)."""
              w, h = SC_COL_W, SC_HALF
              c = K.Canvas(w, h)
              if lo >= 0:
                  y0, y1 = h - (hi + 1) * SC_ROW_H, h - lo * SC_ROW_H          # upper half: centre at the bottom
                  if flip:
                      y0, y1 = lo * SC_ROW_H, (hi + 1) * SC_ROW_H              # lower half: centre at the top
                  K.rrect(c, 0, y0, w, y1 - y0, 3.0, TRACE + (110,))                         # glow (joins the neighbours)
                  K.rrect(c, 1, y0 + 1, w - 2, y1 - y0 - 2, 2.5, TRACE + (255,))             # trace
                  K.rrect(c, 2.5, y0 + 2.5, w - 5, y1 - y0 - 5, 1.5, TRACE_HI + (255,))      # bright core
              return c.rows()


          def make_scope_strip(path, flip):
              """SC_FRAMES frames: 0 = nothing; 1 + hi * (hi + 1) / 2 + lo = rows lo .. hi lit (same code as the plugin)."""
              rows = list(span_rows(-1, -1, flip))
              for hi in range(SC_ROWS):
                  for lo in range(hi + 1):
                      rows += span_rows(lo, hi, flip)
              write_png_rgba(path, SC_COL_W, rows)


          def corr_colour(centre, lit):
              """Correlation segment colour: red when out of phase (< 0), blue when in phase."""
              if centre < 0:
                  on, off = (255, 66, 58), (74, 28, 28)
              else:
                  on, off = (70, 150, 255), (28, 44, 74)
              return (on if lit else off) + (255,)


          def bal_colour(centre, lit):
              """Balance segment colour: blue within 3 dB of the centre, amber to 12 dB, red beyond."""
              a = abs(centre)
              if a > 12:
                  on, off = (255, 66, 58), (74, 28, 28)
              elif a > 3:
                  on, off = (255, 186, 40), (78, 62, 26)
              else:
                  on, off = (70, 150, 255), (28, 44, 74)
              return (on if lit else off) + (255,)


          def make_centre_bar(path, segs, pitch, lit_w, frames, lo_v, hi_v, colour):
              """frames for lo_v .. hi_v: segments lit from the centre (0) out to the value, plus a white marker."""
              w, h = segs * pitch, BAR_H
              rows = []
              for k in range(frames):
                  v = lo_v + (hi_v - lo_v) * k / (frames - 1)
                  c = K.Canvas(w, h)
                  lo, hi = min(0.0, v), max(0.0, v)
                  for i in range(segs):
                      s0 = lo_v + (hi_v - lo_v) * i / segs
                      s1 = s0 + (hi_v - lo_v) / segs
                      lit = s1 > lo + 1e-9 and s0 < hi - 1e-9
                      K.rrect(c, i * pitch + (pitch - lit_w) / 2.0, 3, lit_w, h - 6, 1.0, colour((s0 + s1) / 2.0, lit))
                  mx = (v - lo_v) / (hi_v - lo_v) * w
                  K.rrect(c, min(max(mx - 2.0, 0.0), w - 4.0), 0, 4, h, 1.5, (245, 248, 255, 255))
                  rows += c.rows()
              write_png_rgba(path, w, rows)


          # --------------------------------------------------------------------------------------------
          # Page background: brushed aluminium, 1280 x 628 (the tab area, drawn 1:1), logo, title, captions
          # --------------------------------------------------------------------------------------------
          def draw_logo():
              """The invader on a black plate (a canvas with room for the drop shadow), LOGO_PLATE px square.
              Cell geometry is measured from the supplied 512 px logo and scaled."""
              s = LOGO_PLATE / 512.0
              pad, size = 6, LOGO_PLATE
              c = K.Canvas(size + 2 * pad, size + 2 * pad)
              rad = size * 0.11
              K.rrect(c, pad, pad + 3, size, size, rad, (0, 0, 0, 110))
              K.rrect(c, pad, pad, size, size, rad, K.vgrad(pad, pad + size, (24, 25, 28, 255), (2, 2, 3, 255)))
              K.rrect_outline(c, pad, pad, size, size, rad, 1.0, (112, 116, 124, 255))
              for r, line in enumerate(LOGO):
                  for col, ch in enumerate(line):
                      if ch == "#":
                          K.rrect(c, pad + (85 + 43.57 * col) * s, pad + (99 + 43.0 * r) * s, 37 * s, 37 * s, 1.0,
                                  (248, 250, 253, 255))
              return c, pad


          def blend_canvas(rows, canvas, x0, y0):
              for y in range(canvas.h):
                  if not 0 <= y0 + y < len(rows):
                      continue
                  row = rows[y0 + y]
                  for x in range(canvas.w):
                      r, g, b, a = canvas.px[y * canvas.w + x]
                      if a <= 0.0:
                          continue
                      i = (x0 + x) * 4
                      row[i] = clamp8(row[i] + (r - row[i]) * a)
                      row[i + 1] = clamp8(row[i + 1] + (g - row[i + 1]) * a)
                      row[i + 2] = clamp8(row[i + 2] + (b - row[i + 2]) * a)


          def text_size(name):
              w, h, baseline, _ = TEXT_MASKS[name]
              return w, h, baseline


          def blend_text(rows, name, x0, y0, colour, alpha_rows=False):
              """Paint a pre-rendered mask. alpha_rows: the target is transparent, so write colour + alpha."""
              w, h, _baseline, packed = TEXT_MASKS[name]
              alpha = zlib.decompress(base64.b64decode(packed))
              for yy in range(h):
                  if not 0 <= y0 + yy < len(rows):
                      continue
                  row = rows[y0 + yy]
                  for xx in range(w):
                      a = alpha[yy * w + xx] / 255.0
                      if a <= 0.0:
                          continue
                      i = (x0 + xx) * 4
                      if alpha_rows:
                          row[i], row[i + 1], row[i + 2] = colour[0], colour[1], colour[2]
                          row[i + 3] = max(row[i + 3], clamp8(a * 255))
                      else:
                          for k in range(3):
                              row[i + k] = clamp8(row[i + k] + (colour[k] - row[i + k]) * a)


          def text_at(rows, key, cx, baseline_y, colour, align="centre"):
              w, _h, b = text_size(key)
              x = int(round(cx - w / 2.0)) if align == "centre" else (int(round(cx - w)) if align == "right" else int(cx))
              blend_text(rows, key, x, int(round(baseline_y)) - b, colour)


          def fill_rows(rows, x, y, w, h, colour):
              for yy in range(max(0, y), min(len(rows), y + h)):
                  row = rows[yy]
                  for xx in range(max(0, x), min(len(row) // 4, x + w)):
                      i = xx * 4
                      row[i], row[i + 1], row[i + 2] = colour[0], colour[1], colour[2]


          def panel(rows, box, fill, radius=12.0, bezel=True):
              """A recessed panel: dark bevel + shadow, then the face."""
              x, y, w, h = box
              c = K.Canvas(w + 8, h + 8)
              K.rrect(c, 3, 5, w, h, radius + 1, (0, 0, 0, 70))                 # shadow
              if bezel:
                  K.rrect(c, 4, 4, w, h, radius, K.vgrad(4, 4 + h, (96, 100, 108, 255), (236, 238, 242, 255)))
                  K.rrect(c, 6, 6, w - 4, h - 4, radius - 2, fill)
              else:
                  K.rrect(c, 4, 4, w, h, radius, fill)
              blend_canvas(rows, c, x - 4, y - 4)


          def brushed_rows(w, h, seed):
              base = K.parse_argb(SILVER_GREYS["bg"])
              amp = 7.0
              sheen = [7 * math.sin(x / 190.0 + 0.6) + 4 * math.sin(x / 53.0) + 5 * math.sin(x / 611.0) for x in range(w)]
              runs = w // 41 + 2
              rows = []
              for y in range(h):
                  fall = -((y / float(h)) - 0.5) * 8.0                  # slightly lighter at the top
                  row_n = (h01(y * 977 + seed) - 0.5) * 1.2 * amp
                  run_n = [(h01(y * 131 + k * 7919 + seed + 5) - 0.5) * 0.9 * amp for k in range(runs)]
                  row = bytearray(w * 4)
                  for x in range(w):
                      fine = (h01(x * 31 + y * 1009 + seed + 11) - 0.5) * 0.25 * amp
                      d = sheen[x] + fall + row_n + run_n[x // 41] + fine
                      i = x * 4
                      row[i] = clamp8(base[0] + d)
                      row[i + 1] = clamp8(base[1] + d)
                      row[i + 2] = clamp8(base[2] + d * 1.05)
                      row[i + 3] = 255
                  rows.append(row)
              return rows


          def caption_spots(page):
              """[(text key, centre x, baseline y)] for the names under every segmented choice switch."""
              spots = []
              pos = {i: (x, y) for i, x, y in slot_positions(page)}
              for i, ctl in enumerate(page.controls):
                  if ctl.widget == "empty" or not ctl.definition.startswith("radio"):
                      continue
                  x0, y0 = pos[i]
                  width, xs = gen_ui.SEGMENTS[len(ctl.param.choices)]
                  for choice, x in zip(ctl.param.choices, xs):
                      spots.append(("cap:" + CAPTIONS.get(choice, choice.upper()), x0 + x + width / 2.0, y0 + SEG_Y + 56))
              return spots


          def draw_logo_and_title(rows, w, h):
              logo, pad = draw_logo()
              plate_x = w - LOGO_MARGIN - LOGO_PLATE
              plate_y = h - LOGO_MARGIN - LOGO_PLATE
              blend_canvas(rows, logo, plate_x - pad, plate_y - pad)
              # title, to the left of the logo, its baseline level with the bottom of the invader artwork
              tw, th, tb = text_size("title")
              art_bottom = plate_y + int(round((99 + 43.0 * (len(LOGO) - 1) + 37) * LOGO_PLATE / 512.0))
              blend_text(rows, "title", plate_x - TITLE_GAP - tw, art_bottom - tb, TEXT_BLACK)


          def draw_captions(rows, page):
              for key, cx, baseline_y in caption_spots(page):
                  if key not in TEXT_MASKS:
                      print('make_silver: no pre-rendered text for "%s"; that button name is not drawn.' % key)
                      continue
                  text_at(rows, key, cx, baseline_y, TEXT_BLACK)


          def x_of_freq(f):
              return PLOT_X + math.log(f / F_LO) / math.log(F_HI / F_LO) * PLOT_W


          def y_of_db(db):
              return PLOT_Y + (DB_HI - db) / (DB_HI - DB_LO) * CURVE_H


          def draw_spectrum_panel(rows):
              panel(rows, SPEC, LCD + (255,))
              fill_rows(rows, PLOT_X - 1, PLOT_Y - 1, PLOT_W + 2, CURVE_H + 2, (10, 12, 16))
              # horizontal lines every 6 dB, labelled every 12 dB (and +6)
              db = DB_HI
              while db >= DB_LO - 0.01:
                  y = int(round(y_of_db(db)))
                  major = int(db) % 12 == 0 or db == DB_HI
                  col = (88, 58, 58) if db == 0 else ((44, 54, 72) if major else (28, 34, 46))
                  fill_rows(rows, PLOT_X, min(y, PLOT_Y + CURVE_H - 1), PLOT_W, 1, col)
                  if major and db > DB_LO:
                      key = "s13:" + ("+6" if db > 0 else str(int(db)))
                      text_at(rows, key, PLOT_X - 10, y + 5, (255, 120, 110) if db > 0 else (170, 180, 196), "right")
                  db -= 6.0
              text_at(rows, "s13:dB", PLOT_X - 34, PLOT_Y + CURVE_H + 22, (120, 132, 150), "right")
              # vertical lines: 1-2-3..9 per decade, labelled at 20, 50, 100, 200, 500, 1k, 2k, 5k, 10k, 20k
              labels = {20: "20", 50: "50", 100: "100", 200: "200", 500: "500", 1000: "1k", 2000: "2k", 5000: "5k",
                        10000: "10k", 20000: "20k"}
              for dec in (10, 100, 1000, 10000):
                  for m in range(1, 10):
                      f = dec * m
                      if f < F_LO or f > F_HI:
                          continue
                      x = int(round(x_of_freq(f)))
                      major = m == 1
                      col = (50, 62, 82) if major else ((38, 46, 62) if f in labels else (26, 32, 43))
                      fill_rows(rows, min(x, PLOT_X + PLOT_W - 1), PLOT_Y, 1, CURVE_H, col)
                      if f in labels:
                          fill_rows(rows, min(x, PLOT_X + PLOT_W - 1), PLOT_Y + CURVE_H, 1, 5, (120, 132, 150))
                          tx = min(max(x, PLOT_X + 10), PLOT_X + PLOT_W - 12)
                          text_at(rows, "s13:" + labels[f], tx, PLOT_Y + CURVE_H + 22, (170, 180, 196))
              text_at(rows, "s13:Hz", PLOT_X + PLOT_W + 22, PLOT_Y + CURVE_H + 22, (120, 132, 150))
              panel(rows, CUR_BOX, LCD + (255,))
              panel(rows, PEAK_BOX, LCD + (255,))


          def line_rows(rows, x0, y0, x1, y1, colour, dash=0):
              """1 px line (no anti-aliasing), optionally dashed."""
              n = int(max(abs(x1 - x0), abs(y1 - y0))) + 1
              for i in range(n):
                  if dash and (i // dash) % 2:
                      continue
                  t = i / float(max(1, n - 1))
                  x, y = int(round(x0 + (x1 - x0) * t)), int(round(y0 + (y1 - y0) * t))
                  fill_rows(rows, x, y, 1, 1, colour)


          def draw_stereo_panel(rows):
              panel(rows, SCOPE, LCD + (255,))
              fill_rows(rows, SC_X - 1, SC_Y - 1, SC_W + 2, 2 * SC_HALF + 2, (10, 12, 16))
              cx, cy = SC_X + SC_W / 2.0, SC_Y + SC_HALF
              rx, ry = SC_W / 2.0, float(SC_HALF)

              def at(s, m):
                  return cx + s * rx, cy - m * ry
              # half-scale diamond, axes, L / R lines, full-scale diamond
              pts = [at(0, 0.5), at(0.5, 0), at(0, -0.5), at(-0.5, 0), at(0, 0.5)]
              for a, b in zip(pts, pts[1:]):
                  line_rows(rows, a[0], a[1], b[0], b[1], (30, 38, 52), dash=4)
              line_rows(rows, cx, SC_Y, cx, SC_Y + 2 * SC_HALF - 1, (40, 50, 68))
              line_rows(rows, SC_X, cy, SC_X + SC_W - 1, cy, (40, 50, 68))
              for s in (-1, 1):
                  a, b = at(-0.5 * s, 0.5), at(0.5 * s, -0.5)
                  line_rows(rows, a[0], a[1], b[0], b[1], (36, 46, 64), dash=6)
              pts = [at(0, 1), at(1, 0), at(0, -1), at(-1, 0), at(0, 1)]
              for a, b in zip(pts, pts[1:]):
                  line_rows(rows, a[0], a[1], b[0], b[1], (70, 90, 122))
              col = (143, 180, 240)
              lx, ly = at(-0.5, 0.5)
              text_at(rows, "s17:L", lx - 16, ly - 10, col)
              rx_, ry_ = at(0.5, 0.5)
              text_at(rows, "s17:R", rx_ + 16, ry_ - 10, col)
              mx, my = at(0, 1)
              text_at(rows, "s17:M", mx + 22, my + 20, col)
              text_at(rows, "s17:-S", SC_X + 22, cy - 10, col)
              text_at(rows, "s17:+S", SC_X + SC_W - 24, cy - 10, col)
              # correlation and balance panels with their scales
              for box, segs, pitch, marks in (
                      (CORR_P, CORR_SEGS, CORR_PITCH, ((-1.0, "-1"), (-0.5, "-0.5"), (0.0, "0"), (0.5, "+0.5"), (1.0, "+1"))),
                      (BAL_P, BAL_SEGS, BAL_PITCH, ((-1.0, "L 24"), (-0.5, "12"), (0.0, "C"), (0.5, "12"), (1.0, "R 24")))):
                  panel(rows, box, LCD + (255,))
                  px, py, pw, _ = box
                  w = segs * pitch
                  x0 = px + (pw - w) // 2
                  ybar = py + 40
                  fill_rows(rows, x0 - 2, ybar - 2, w + 4, BAR_H + 4, (8, 9, 12))
                  for v, key in marks:
                      x = int(round(x0 + (v + 1.0) / 2.0 * w))
                      colour = (255, 120, 110) if (box is CORR_P and v < 0) else (170, 180, 196)
                      fill_rows(rows, min(x, x0 + w - 1), ybar + BAR_H + 2, 1, 4, colour)
                      text_at(rows, "s13:" + key, min(max(x, x0 + 14), x0 + w - 14), ybar + BAR_H + 18, colour)
              # readings panel (light, like Utility Meter's)
              x, y, w, h = INFO_P
              panel(rows, INFO_P, K.vgrad(y, y + h, (214, 217, 222, 255), (196, 199, 205, 255)), 12.0)
              fill_rows(rows, x + w // 2, y + 14, 1, h - 28, (160, 164, 172))
              fill_rows(rows, x + w // 2 + 1, y + 14, 1, h - 28, (232, 234, 238))


          def make_background(path, page, w=1280, h=628, seed=41):
              rows = brushed_rows(w, h, seed)
              if page.name == "SPECTRUM":
                  draw_spectrum_panel(rows)
              elif page.name == "STEREO":
                  draw_stereo_panel(rows)
              draw_logo_and_title(rows, w, h)
              draw_captions(rows, page)
              write_png_rgba(path, w, rows)


          # --------------------------------------------------------------------------------------------
          # The double-tap / Enter overlays (KnobOverlay, MenuOverlay) are full-screen components whose background
          # gen_ui sets to the page colour; on the MPC that made them near-white. Keep them on the SDK's dark colour.
          OVERLAY_BG = "ff1e1d1e"


          def install_theme():
              _overlay_component = gen_ui.overlay_component
              gen_ui.overlay_component = lambda type_name, data, _bg: _overlay_component(type_name, data, OVERLAY_BG)
              gen_ui.tab_component = tab_component
              gen_ui.radio_component = radio_component
              gen_ui.qlink_rects = qlink_rects
              gen_ui.build_qlinks = build_qlinks
              K.GREYS.update(SILVER_GREYS)
              K.THEMES["silver"] = ACCENT
              K.knob_static = knob_static
              K.fader_cap = fader_cap
              K.render_button = render_button


          def main(argv):
              global PARAMS
              install_theme()
              params = os.path.join(HERE, "build", "params.json")
              ui = os.path.join(HERE, "ui.json")
              out = os.path.join(HERE, "skins")
              if not os.path.isfile(params):
                  print("make_silver: build/params.json is missing. Run first:\n"
                        '  python tools/build.py "plugins/Analysis Meter" --target native')
                  return 1
              if os.path.isdir(out):
                  shutil.rmtree(out)
              os.makedirs(out)
              PARAMS = gen_ui.ParamTable(gen_ui.load_params(params))
              pages = gen_ui.load_ui(ui, PARAMS)[0]
              for page in pages:
                  make_background(os.path.join(out, page.background), page)
              make_column_strip(os.path.join(out, "am_column.png"))
              make_cursor(os.path.join(out, "am_cursor.png"))
              make_scope_strip(os.path.join(out, "am_scope_up.png"), False)
              make_scope_strip(os.path.join(out, "am_scope_dn.png"), True)
              make_centre_bar(os.path.join(out, "am_corr.png"), CORR_SEGS, CORR_PITCH, CORR_LIT, CORR_FRAMES, -1.0, 1.0,
                              corr_colour)
              make_centre_bar(os.path.join(out, "am_balance.png"), BAL_SEGS, BAL_PITCH, BAL_LIT, BAL_FRAMES, -24.0, 24.0,
                              bal_colour)
              gen_ui.generate(params, ui, out, assets_dir=out, quiet=False, kit_cache=None)
              print("make_silver: wrote %s (%d files)" % (out, len(os.listdir(out))))
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          AMEOF
      - name: First build (native) to list the parameters
        run: python tools/build.py "plugins/Analysis Meter" --target native
      - name: Draw the brushed silver skin
        run: python "plugins/Analysis Meter/make_silver.py"
      - name: Build, validate, make MPC folder
        run: python tools/build.py "plugins/Analysis Meter"
      - name: Upload MPC plugin folder
        uses: actions/upload-artifact@v4
        with:
          name: Analysis-Meter-MPC
          path: plugins/Analysis Meter/build/*VST*
          if-no-files-found: error
