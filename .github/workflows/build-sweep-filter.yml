          # --------------------------------------------------------------------------------------------
          # Brushed-metal noise (deterministic: same skin on every build)
          # --------------------------------------------------------------------------------------------
          def h01(n):
              """Integer hash -> 0..1."""
              n = (int(n) * 0x9E3779B1) & 0xFFFFFFFF
              n ^= n >> 15
              n = (n * 0x85EBCA77) & 0xFFFFFFFF
              n ^= n >> 13
              return (n & 0xFFFF) / 65535.0


          def streak(x, y, seed):
              """About -1.2 .. +1.2: long thin horizontal brush lines, broken into short runs."""
              row = h01(int(y) * 977 + seed)
              run = h01(int(y) * 131 + (int(x) // 41) * 7919 + seed + 5)
              fine = h01(int(x) * 31 + int(y) * 1009 + seed + 11)
              return (row - 0.5) * 1.2 + (run - 0.5) * 0.9 + (fine - 0.5) * 0.25


          def clamp8(v):
              return max(0, min(255, int(round(v))))


          def shade(c, d):
              return (clamp8(c[0] + d), clamp8(c[1] + d), clamp8(c[2] + d), c[3])


          def brushed(y0, y1, c0, c1, seed, amp=7.0):
              """Vertical gradient c0 -> c1 with horizontal brushing on top."""
              base = K.vgrad(y0, y1, c0, c1)
              return lambda px, py: shade(base(px, py), streak(px, py, seed) * amp)


          # --------------------------------------------------------------------------------------------
          # Drawing overrides (same geometry as the SDK kit, silver surfaces)
          # --------------------------------------------------------------------------------------------
          def turned(cx, cy, radius, seed=3):
              """Turned-aluminium knob face: concentric brush lines and a two-lobed highlight."""
              light = -0.75 * math.pi

              def f(px, py):
                  dx, dy = px - cx, py - cy
                  rad = math.hypot(dx, dy)
                  lobes = math.cos(2.0 * (math.atan2(dy, dx) - light))
                  ring = h01(int(rad * 2.4) + seed * 101) - 0.5
                  fine = h01(int(px * 13) + int(py * 29) * 7 + seed) - 0.5
                  lum = 188 + 30 * lobes * (0.35 + 0.65 * min(1.0, rad / radius)) + ring * 16 + fine * 4
                  return (clamp8(lum), clamp8(lum + 1), clamp8(lum + 4), 255)   # a touch cool
              return f


          def knob_static(size, th):
              c = K.Canvas(size, size)
              cx = cy = size / 2.0
              r = size / 2.0
              ring_out, ring_in = r - 1.0, r - max(4.0, size * 0.1)
              body_r = ring_in - max(3.0, size * 0.07)
              K.arc(c, cx, cy, ring_in, ring_out, -K.SWEEP / 2.0, K.SWEEP / 2.0, th["track"])
              K.circle(c, cx, cy + 1.5, body_r + 1.0, K.with_alpha(th["outline"], 150))
              K.circle(c, cx, cy, body_r, K.light_rim(cx, cy, th["bodyLight"], th["bodyDark"]))
              face_r = body_r - max(1.5, size * 0.035)
              K.circle(c, cx, cy, face_r, turned(cx, cy, face_r))
              return c, (cx, cy, ring_in, ring_out, body_r, face_r)


          def fader_cap(g, th):
              w, h = g["cap_len"], g["cap_th"]
              c = K.Canvas(w + 2, h + 4)
              K.rrect(c, 1, 3, w, h, 5.0, K.with_alpha(th["outline"], 170))
              K.rrect(c, 1, 1, w, h, 5.0, brushed(1, 1 + h, th["thumbLight"], th["thumbDark"], 23, 6.0))
              K.rrect_outline(c, 1, 1, w, h, 5.0, 1.0, K.with_alpha(th["outline"], 180))
              cx = 1 + w / 2.0
              K.capsule(c, cx, 1 + h * 0.28, cx, 1 + h * 0.72, 2.0, th["accentDark"])
              K.capsule(c, cx, 1 + h * 0.28, cx, 1 + h * 0.72, 1.4, th["accent"])
              return c


          def render_button(th, on, w=120, h=44, led=True):
              """Blue brushed key: deep blue at rest, bright lit blue when selected."""
              c = K.Canvas(w, h)
              rad = 8.0
              K.rrect(c, 1, 3, w - 2, h - 4, rad, K.with_alpha(th["outline"], 150))
              top, bottom = BTN_ON if on else BTN_OFF
              K.rrect(c, 1, 1, w - 2, h - 4, rad, brushed(1, h - 3, top, bottom, 17, 6.0))
              K.rrect_outline(c, 1, 1, w - 2, h - 4, rad, 2.0 if on else 1.0, BTN_EDGE_ON if on else BTN_EDGE_OFF)
              if on and not led:
                  K.rrect(c, 10, h - 9, w - 20, 3, 1.5, BTN_EDGE_ON)
              if led:
                  lx, ly, lw, lh = 11, (h - 4) / 2.0 + 1 - 9, 6, 18
                  if on:
                      K.rrect(c, lx - 3, ly - 3, lw + 6, lh + 6, 6.0, th["accentGlow"])
                  K.rrect(c, lx, ly, lw, lh, 3.0, BTN_EDGE_ON if on else th["ledOff"])
              return c.rows(), w


          # --------------------------------------------------------------------------------------------
          # Layout: centre every row of controls (and its Q-Link rectangle); centre the block vertically
          # --------------------------------------------------------------------------------------------
          GRID_GAP = gen_ui.SLOT_X[1] - gen_ui.SLOT_X[0] - gen_ui.SLOT_W      # the grid's normal gap (42 px)


          def row_x(page, row):
              """{column: x} of the occupied slots in a grid row, packed with the normal gap and centred."""
              cols = [c for c in range(4)
                      if row * 4 + c < len(page.controls) and page.controls[row * 4 + c].widget != "empty"]
              total = len(cols) * gen_ui.SLOT_W + max(0, len(cols) - 1) * GRID_GAP
              x0 = (gen_ui.SCREEN_W - total) // 2
              return {c: x0 + j * (gen_ui.SLOT_W + GRID_GAP) for j, c in enumerate(cols)}


          SEG_Y = 46          # top of the Mode buttons inside their slot (the SDK uses 54); leaves room for the names below


          def radio_component(style, overlay_name, n):
              """gen_ui.radio_component with the segment buttons raised to SEG_Y so their names fit inside the slot."""
              width, xs = gen_ui.SEGMENTS[n]
              children = [gen_ui.focus_child(style),
                          gen_ui.entry("name", "Label", gen_ui.label_data("Name", style["muted"], 24.0), "15 8 248 34",
                                       "No", "Show", "Always")]
              for i, x in enumerate(xs):
                  children.append(gen_ui.entry("seg %d" % i, "Button",
                                               gen_ui.button_data("seg%d_on.png" % n, "seg%d_off.png" % n, i, n),
                                               "%d %d %d 40" % (x, SEG_Y, width), "No", "Show", "Always"))
              return gen_ui.component_definition(gen_ui.control_actions(overlay_name, double_click=False), children,
                                                 "00000000")


          def tab_component(page, style):
              """gen_ui.tab_component with centred rows and without the on-button caption labels
              (the Mode names are painted under the buttons in the page background instead)."""
              children = []
              for i, ctl in enumerate(page.controls):
                  row, col = divmod(i, 4)
                  if ctl.widget == "empty":
                      continue
                  bounds = "%d %d %d %d" % (row_x(page, row)[col], gen_ui.SLOT_Y[row], gen_ui.SLOT_W, gen_ui.SLOT_H)
                  invalidating = None
                  if ctl.visible:
                      vp, idx = ctl.visible
                      invalidating = ["IndexedEnabling/%d/%d/%s" % (idx, len(vp.choices), vp.handle)]
                  if ctl.widget == "text":
                      children.append(gen_ui.entry("text %d" % i, "Label",
                                                   gen_ui.label_data("Text", style["text"], 30.0, "left", ctl.text),
                                                   bounds, "No", "Show", "Always", invalidating=invalidating))
                      continue
                  children.append(gen_ui.entry(ctl.param.name, ctl.definition,
                                               gen_ui.obj(("version", 1), ("handleName", "Data")), bounds,
                                               "Yes", "Hide", "Always", remap=[("Data", ctl.param.handle)],
                                               invalidating=invalidating))
              return gen_ui.component_definition([], children, style["background"], bg_image=page.background)


          _orig_qlink_rects = gen_ui.qlink_rects


          def qlink_rects(page, groups="columns"):
              """Q-Link rectangles around each (centred) row of controls."""
              if groups != "rows":
                  return _orig_qlink_rects(page, groups)
              pad, out = gen_ui.QLINK_PAD, []
              for r in range(4):
                  xs = row_x(page, r)
                  cs = [c for c in xs if page.controls[r * 4 + c].param is not None]
                  if not cs:
                      continue
                  x = max(xs[min(cs)] - pad, 2)
                  y = max(gen_ui.SLOT_Y[r] - pad, 2)
                  x2 = min(xs[max(cs)] + gen_ui.SLOT_W + pad, gen_ui.SCREEN_W - 2)
                  y2 = min(gen_ui.SLOT_Y[r] + gen_ui.SLOT_H + pad, gen_ui.SCREEN_H - 2)
                  out.append("%d %d %d %d" % (x, y, x2 - x, y2 - y))
              return out


          def centre_vertically(page):
              """Shift the grid rows so the rows in use sit in the middle of the 628 px tab."""
              used = max(i // 4 for i, c in enumerate(page.controls) if c.widget != "empty") + 1
              block = (gen_ui.SLOT_Y[used - 1] + gen_ui.SLOT_H) - gen_ui.SLOT_Y[0]
              dy = (gen_ui.SCREEN_H - block) // 2 - gen_ui.SLOT_Y[0] + BLOCK_SHIFT
              gen_ui.SLOT_Y = [y + dy for y in gen_ui.SLOT_Y]


          def caption_spots(page):
              """[(text, centre x, top y)] for the names under every segmented choice switch."""
              spots = []
              for i, ctl in enumerate(page.controls):
                  if ctl.widget == "empty" or not ctl.definition.startswith("radio"):
                      continue
                  row, col = divmod(i, 4)
                  width, xs = gen_ui.SEGMENTS[len(ctl.param.choices)]
                  for choice, x in zip(ctl.param.choices, xs):
                      spots.append((choice, row_x(page, row)[col] + x + width / 2.0, gen_ui.SLOT_Y[row] + SEG_Y + 42))
              return spots


          # --------------------------------------------------------------------------------------------
          # Page background: brushed aluminium, 1280 x 628 (the tab area, drawn 1:1), logo, title, captions
          # --------------------------------------------------------------------------------------------
          def write_png_rgba(path, width, rows):
              def chunk(tag, data):
                  body = tag + data
                  return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)
              raw = b"".join(b"\0" + bytes(r) for r in rows)
              png = b"\x89PNG\r\n\x1a\n"
              png += chunk(b"IHDR", struct.pack(">IIBBBBB", width, len(rows), 8, 6, 0, 0, 0))
              png += chunk(b"IDAT", zlib.compress(raw, 9))
              png += chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)


          def draw_logo():
              """The invader on a black plate (a canvas with room for the drop shadow), LOGO_PLATE px square.
              Cell geometry is measured from the supplied 512 px logo and scaled."""
              s = LOGO_PLATE / 512.0
              pad, size = 6, LOGO_PLATE
              c = K.Canvas(size + 2 * pad, size + 2 * pad)
              rad = size * 0.11
              K.rrect(c, pad, pad + 3, size, size, rad, (0, 0, 0, 110))
              K.rrect(c, pad, pad, size, size, rad, K.vgrad(pad, pad + size, (24, 25, 28, 255), (2, 2, 3, 255)))
              K.rrect_outline(c, pad, pad, size, size, rad, 1.0, (112, 116, 124, 255))
              for r, line in enumerate(LOGO):
                  for col, ch in enumerate(line):
                      if ch == "#":
                          K.rrect(c, pad + (85 + 43.57 * col) * s, pad + (99 + 43.0 * r) * s, 37 * s, 37 * s, 1.0,
                                  (248, 250, 253, 255))
              return c, pad


          def blend_canvas(rows, canvas, x0, y0):
              for y in range(canvas.h):
                  row = rows[y0 + y]
                  for x in range(canvas.w):
                      r, g, b, a = canvas.px[y * canvas.w + x]
                      if a <= 0.0:
                          continue
                      i = (x0 + x) * 4
                      row[i] = clamp8(row[i] + (r - row[i]) * a)
                      row[i + 1] = clamp8(row[i + 1] + (g - row[i + 1]) * a)
                      row[i + 2] = clamp8(row[i + 2] + (b - row[i + 2]) * a)


          def text_size(name):
              w, h, _ = TEXT_MASKS[name]
              return w, h


          def blend_text(rows, name, x0, y0, colour):
              w, h, packed = TEXT_MASKS[name]
              alpha = zlib.decompress(base64.b64decode(packed))
              for yy in range(h):
                  row = rows[y0 + yy]
                  for xx in range(w):
                      a = alpha[yy * w + xx] / 255.0
                      if a <= 0.0:
                          continue
                      i = (x0 + xx) * 4
                      for k in range(3):
                          row[i + k] = clamp8(row[i + k] + (colour[k] - row[i + k]) * a)


          def make_background(path, page, w=1280, h=628, seed=41):
              base = K.parse_argb(SILVER_GREYS["bg"])
              amp = 7.0
              sheen = [7 * math.sin(x / 190.0 + 0.6) + 4 * math.sin(x / 53.0) + 5 * math.sin(x / 611.0) for x in range(w)]
              runs = w // 41 + 2
              rows = []
              for y in range(h):
                  fall = -((y / float(h)) - 0.5) * 8.0                  # slightly lighter at the top
                  row_n = (h01(y * 977 + seed) - 0.5) * 1.2 * amp
                  run_n = [(h01(y * 131 + k * 7919 + seed + 5) - 0.5) * 0.9 * amp for k in range(runs)]
                  row = bytearray(w * 4)
                  for x in range(w):
                      fine = (h01(x * 31 + y * 1009 + seed + 11) - 0.5) * 0.25 * amp
                      d = sheen[x] + fall + row_n + run_n[x // 41] + fine
                      i = x * 4
                      row[i] = clamp8(base[0] + d)
                      row[i + 1] = clamp8(base[1] + d)
                      row[i + 2] = clamp8(base[2] + d * 1.05)
                      row[i + 3] = 255
                  rows.append(row)

              # logo, bottom right
              logo, pad = draw_logo()
              plate_x = w - LOGO_MARGIN - LOGO_PLATE
              plate_y = h - LOGO_MARGIN - LOGO_PLATE
              blend_canvas(rows, logo, plate_x - pad, plate_y - pad)
              # title, to the left of the logo, its baseline level with the bottom of the invader artwork
              # (its last row of cells, measured on the 512 px logo and scaled), not the edge of the plate
              tw, th = text_size("title")
              art_bottom = plate_y + int(round((99 + 43.0 * (len(LOGO) - 1) + 37) * LOGO_PLATE / 512.0))
              blend_text(rows, "title", plate_x - TITLE_GAP - tw, art_bottom - (th - TITLE_DESCENT), TEXT_BLACK)
              # names under the segment buttons
              for text, cx, top in caption_spots(page):
                  key = text.upper()
                  if key not in TEXT_MASKS:
                      print('make_silver: no pre-rendered text for "%s"; that button name is not drawn.' % text)
                      continue
                  cw, _ = text_size(key)
                  blend_text(rows, key, int(round(cx - cw / 2.0)), int(top), TEXT_BLACK)
              write_png_rgba(path, w, rows)


          # --------------------------------------------------------------------------------------------
          def install_theme():
              gen_ui.tab_component = tab_component
              gen_ui.radio_component = radio_component
              gen_ui.qlink_rects = qlink_rects
              K.GREYS.update(SILVER_GREYS)
              K.THEMES["silver"] = ACCENT
              K.knob_static = knob_static
              K.fader_cap = fader_cap
              K.render_button = render_button


          def main(argv):
              install_theme()
              if len(argv) >= 3 and argv[1] == "--preview":
                  K.render_preview(argv[2], K.make_theme("silver"))
                  return 0
              params = os.path.join(HERE, "build", "params.json")
              ui = os.path.join(HERE, "ui.json")
              out = os.path.join(HERE, "skins")
              if not os.path.isfile(params):
                  print("make_silver: build/params.json is missing. Run first:\n"
                        '  python tools/build.py "plugins/Sweep Filter" --target native')
                  return 1
              if os.path.isdir(out):
                  shutil.rmtree(out)
              os.makedirs(out)
              pages = gen_ui.load_ui(ui, gen_ui.ParamTable(gen_ui.load_params(params)))[0]
              centre_vertically(pages[0])
              make_background(os.path.join(out, "silver_bg.png"), pages[0])
              gen_ui.generate(params, ui, out, assets_dir=out, quiet=False, kit_cache=None)
              print("make_silver: wrote %s (%d files)" % (out, len(os.listdir(out))))
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          SWEEPEOF
      - name: First build (native) to list the parameters
        run: python tools/build.py "plugins/Sweep Filter" --target native
      - name: Draw the brushed silver skin
        run: python "plugins/Sweep Filter/make_silver.py"
      - name: Build, validate, make MPC folder
        run: python tools/build.py "plugins/Sweep Filter"
      - name: Upload MPC plugin folder
        uses: actions/upload-artifact@v4
        with:
          name: Sweep-Filter-MPC
          path: plugins/Sweep Filter/build/*VST*
          if-no-files-found: error
