              "outline":    "ff25272b",
              "pointer":    "ff1e2023",   # dark pointer on the light knob face
              "thumb":      "ffd0d3d8",
              "thumbLight": "fff4f5f7",
              "thumbDark":  "ff9a9ea6",
              "ledOff":     "ff9a9ea6",
              "textOn":     "ff111214",
          }

          # Pre-rendered bold text (Poppins Bold, SIL OFL), 8-bit alpha, zlib + base64.
          # name: (width, height, data). Generated by a one-off helper; see make_silver.py.
          TEXT_MASKS = {
              "title": (375, 33,
                  "eNrtWnt4FcUVP7O79yaRJNybIIKtVVqpWkDR1FdrIfKwFftQqtbSTxFFpYCfltqKtElugsijLZbi+/tAjaKI"
                  "FYECSh4XhVp8gSAJhIco8ggQSKCa5N59Tc+Z2d3cxyYBo379g83j7p3Zc+Y3vzlz5syZBcCLqaqqMPh/uhSY"
                  "vN+o/Sl+flkXo+tLwAXfHfWnGZfhR3Xs2LxuX1yl6nRNUbsMSruisHBwYW/ocvdUuJlzmzefd+K8s0sJw1lf"
                  "DANT6OqI9fNe+YxzPgmyN3Hb5k+ABmdhc4WXUnNKJ9JJRgCQP3Dw4Avy5H1X7AnydITExyOWLtO+yjJ4nD9w"
                  "oqoYBPYRhofSBFVFVbQuGoQCBY2cWzFjIhRyk1vW4WwGD1F7+wInpBqf/eWKBhI8tHwkdA0Vg/Bhy4xbY78M"
